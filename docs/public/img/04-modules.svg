<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="export และ import ระหว่างไฟล์" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>export และ import ระหว่างไฟล์</title><desc>money.ts ส่งออกฟังก์ชัน index.ts นำเข้ามาใช้โดยเขียนนามสกุล .js</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="358" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="32" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">แยกไฟล์ด้วย export / import</text>
<rect x="30" y="60" width="330" height="200" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="195.0" y="120.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">src/money.ts</text>
<text x="195.0" y="142.4" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal"></text>
<text x="195.0" y="164.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">export function addVatSatang(...) {...}</text>
<text x="195.0" y="187.4" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal"></text>
<text x="195.0" y="209.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">export function formatBaht(...) {...}</text>
<rect x="440" y="60" width="330" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="605.0" y="108.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">src/index.ts</text>
<text x="605.0" y="131.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal"></text>
<text x="605.0" y="153.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">import { addVatSatang }</text>
<text x="605.0" y="176.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">  from "./money.js";</text>
<text x="605.0" y="198.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal"></text>
<text x="605.0" y="221.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">addVatSatang(150000)</text>
<line x1="362" y1="160" x2="438" y2="160" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<text x="400" y="148" font-size="14" text-anchor="middle" fill="#0b3c91" font-weight="normal">import</text>
<rect x="30" y="285" width="740" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="317.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อควรจำ: เขียน "./money.js" (ลงท้าย .js) แม้ไฟล์จริงคือ money.ts เพราะ Node ดูชื่อไฟล์หลังแปลงแล้ว</text>
</svg>
