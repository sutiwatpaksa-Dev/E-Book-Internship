<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="TRUST_PROXY หลัง Render" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>TRUST_PROXY หลัง Render</title><desc>เปรียบเทียบ TRUST_PROXY เป็น false กับ true: false ทุกคนใช้โควตา IP เดียว true ปลอดภัยเฉพาะเมื่อ proxy เติม IP จริงต่อท้าย และต้องทดสอบเอง</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="498" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">TRUST_PROXY: เลือกผิด เสียทั้งสองทาง</text>
<rect x="30" y="50" width="365" height="34" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="212.5" y="72.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">TRUST_PROXY=false</text>
<rect x="405" y="50" width="365" height="34" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="587.5" y="72.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">TRUST_PROXY=true</text>
<rect x="30" y="92" width="365" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="212.5" y="125.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">server เห็นแต่ IP ของ proxy Render</text>
<text x="212.5" y="147.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เป็น IP เดียวกันหมดทุกคน</text>
<text x="212.5" y="169.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">→ ทุกคนใช้โควตาร่วมกัน</text>
<rect x="405" y="92" width="365" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="587.5" y="125.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">server ใช้ค่าท้ายสุดของ X-Forwarded-For</text>
<text x="587.5" y="147.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ปลอดภัยเฉพาะเมื่อ proxy ของผู้ให้บริการ</text>
<text x="587.5" y="169.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เติม IP จริงต่อท้ายเสมอ</text>
<line x1="212" y1="194" x2="212" y2="222" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="587" y1="194" x2="587" y2="222" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<rect x="30" y="224" width="365" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="212.5" y="257.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ผลเสีย</text>
<text x="212.5" y="279.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">คนร้ายส่งรัว → ลูกค้าจริงส่งฟอร์มไม่ได้</text>
<text x="212.5" y="301.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">และเจ้าของร้านถูกล็อก login</text>
<rect x="405" y="224" width="365" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="587.5" y="257.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ถ้า proxy ไม่ได้เติมแบบนั้น</text>
<text x="587.5" y="279.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">คนร้ายใส่ header นี้เองได้</text>
<text x="587.5" y="301.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">→ หลบการจำกัดได้ทั้งหมด รวมหน้า login</text>
<rect x="30" y="338" width="740" height="142" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="370.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ต้องทดสอบเองหลังขึ้นระบบ (อย่าเดา)</text>
<text x="400.0" y="392.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ส่ง 6 ครั้งโดยปลอม X-Forwarded-For ไม่ซ้ำกัน → ครั้งที่ 6 ต้องได้ 429</text>
<text x="400.0" y="414.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ได้ 429 = ระบบจำกัดได้จริง · ไม่ได้ = หลบได้ (ลบข้อความทดสอบทิ้งหลังลอง)</text>
<text x="400.0" y="436.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ถ้าหลบได้ หรือไม่อยากเสี่ยง: ปิดตัวจำกัดในโค้ด แล้วใช้ตัวจำกัดของผู้ให้บริการ หรือ Cloudflare</text>
<text x="400.0" y="458.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">(กฎสำหรับ /api/contact และ /api/admin/login) ตามที่เขียนในข้อ 4</text>
</svg>
