<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Reverse proxy: ประตูหน้าบานเดียว" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Reverse proxy: ประตูหน้าบานเดียว</title><desc>ผู้ใช้เข้าที่ port 443 ของ Caddy แล้ว Caddy ส่ง /api ไปที่ server และอย่างอื่นไปไฟล์หน้าเว็บ</desc>
