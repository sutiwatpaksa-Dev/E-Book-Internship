<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="ฟอร์ม: ค่าในช่องกรอกอยู่ใน state ทุกตัวอักษร" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ฟอร์ม: ค่าในช่องกรอกอยู่ใน state ทุกตัวอักษร</title><desc>ทุกตัวอักษรที่พิมพ์ทำให้ onChange อัปเดต state แล้ว React วาดช่องกรอกใหม่ด้วยค่าจาก state</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="338" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">ฟอร์ม: ค่าในช่องกรอกอยู่ใน state ทุกตัวอักษร</text>
<rect x="30" y="60" width="200" height="90" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="130.0" y="99.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ผู้ใช้พิมพ์ "บ"</text>
<text x="130.0" y="121.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ในช่องชื่อ</text>
<rect x="300" y="60" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="88.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">onChange</text>
<text x="400.0" y="109.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">update("name", "บ")</text>
<text x="400.0" y="130.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">setForm({...form, ...})</text>
<rect x="570" y="60" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="670.0" y="88.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">state: form</text>
<text x="670.0" y="109.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">{ name: "บ",</text>
<text x="670.0" y="130.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">phone: "", ... }</text>
<line x1="232" y1="105" x2="298" y2="105" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="502" y1="105" x2="568" y2="105" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="300" y="215" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="244.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ช่องกรอกวาดใหม่</text>
<text x="400.0" y="266.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">value={form.name}</text>
<path d="M670,152 L670,250 L502,250" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<rect x="30" y="190" width="200" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="130.0" y="213.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ตอนกด "ส่ง" อ่านจาก state</text>
<text x="130.0" y="234.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">validate(form)</text>
<text x="130.0" y="255.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ผิด → ข้อความใต้ช่อง</text>
<text x="130.0" y="276.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ถูก → ส่ง + ล้างฟอร์ม</text>
<line x1="298" y1="250" x2="232" y2="250" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<text x="400" y="320" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">ที่หน้าเว็บตรวจเพื่อความสะดวกผู้ใช้เท่านั้น server ต้องตรวจซ้ำเสมอ</text>
</svg>
