<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-label="ด่านที่คำขอ POST /api/contact ผ่านตามลำดับ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ด่านที่คำขอ POST /api/contact ผ่านตามลำดับ</title><desc>คำขอผ่าน logger, จับคู่ route, rateLimit, parse ด้วย Zod, db.insert แล้วตอบ 201 แต่ละด่านมีทางออกเป็น error</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker></defs>
<rect x="1" y="1" width="798" height="454" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">POST /api/contact ผ่านอะไรบ้าง ตามลำดับ</text>
<rect x="30" y="52" width="380" height="46" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="220.0" y="69.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">logger()</text>
<text x="220.0" y="91.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">บันทึก log ทุก request</text>
<line x1="220" y1="98" x2="220" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#as)"/>
<rect x="30" y="116" width="380" height="46" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="220.0" y="133.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">app.route("/api", publicRoutes)</text>
<text x="220.0" y="155.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">จับคู่ POST /contact</text>
<line x1="220" y1="162" x2="220" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#as)"/>
<line x1="410" y1="139" x2="470" y2="139" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="470" y="116" width="300" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="620.0" y="133.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่ตรงกับ route ไหน</text>
<text x="620.0" y="155.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">app.notFound → 404</text>
<rect x="30" y="180" width="380" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="220.0" y="197.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">rateLimit({ limit: 5, ... })</text>
<text x="220.0" y="219.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">นับตาม IP ของผู้ส่ง</text>
<line x1="220" y1="226" x2="220" y2="244" stroke="#64748b" stroke-width="2" marker-end="url(#as)"/>
<line x1="410" y1="203" x2="470" y2="203" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="470" y="180" width="300" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="620.0" y="197.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ส่งถี่เกิน</text>
<text x="620.0" y="219.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">throw AppError → 429</text>
<rect x="30" y="244" width="380" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="220.0" y="261.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">parse(ContactInput, body)</text>
<text x="220.0" y="283.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตรวจด้วย Zod</text>
<line x1="220" y1="290" x2="220" y2="308" stroke="#64748b" stroke-width="2" marker-end="url(#as)"/>
<line x1="410" y1="267" x2="470" y2="267" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="470" y="244" width="300" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="620.0" y="261.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลผิด / JSON พัง</text>
<text x="620.0" y="283.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">throw AppError → 400</text>
<rect x="30" y="308" width="380" height="46" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="220.0" y="325.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">db.insert(contactMessages)</text>
<text x="220.0" y="347.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">บันทึกลง PostgreSQL</text>
<line x1="220" y1="354" x2="220" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#as)"/>
<line x1="410" y1="331" x2="470" y2="331" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="470" y="308" width="300" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="620.0" y="325.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">DB พัง (error ไม่ได้ตั้งใจ)</text>
<text x="620.0" y="347.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไป app.onError → 500</text>
<rect x="30" y="372" width="380" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="220.0" y="389.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ok(c, row, 201)</text>
<text x="220.0" y="411.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตอบ { success: true, data }</text>
<text x="400" y="440" font-size="15" text-anchor="middle" fill="#64748b" font-weight="normal">throw AppError ทั้งสองแบบไปออกที่ app.onError เดียวกัน (ดูภาพ app.onError ในข้อ 4)</text>
</svg>
