<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>เส้นทางของคำขอหนึ่งครั้ง</title><defs><marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="snavy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#0b3c91"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="sblue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1a4fb0"/></marker><marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="sor" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#f59e0b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="sgr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="srd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="sgy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker></defs><rect x="2" y="2" width="796" height="436" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="30" y="20" width="160" height="48" rx="10" fill="#e0ebff" stroke="#1a4fb0" stroke-width="2"/><text x="110.0" y="50.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Browser</text><line x1="110" y1="68" x2="110" y2="420" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="320" y="20" width="160" height="48" rx="10" fill="#dbe7fb" stroke="#0b3c91" stroke-width="2"/><text x="400.0" y="50.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Server (API)</text><line x1="400" y1="68" x2="400" y2="420" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="610" y="20" width="160" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="690.0" y="50.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Database</text><line x1="690" y1="68" x2="690" y2="420" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><line x1="116" y1="105" x2="394" y2="105" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#anavy)"/><text x="255.0" y="95" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">1. GET /products</text><line x1="406" y1="165" x2="684" y2="165" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#anavy)"/><text x="545.0" y="155" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">2. SELECT * FROM products</text><line x1="684" y1="225" x2="406" y2="225" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aor)"/><text x="545.0" y="215" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">3. ได้แถวข้อมูล</text><line x1="394" y1="285" x2="116" y2="285" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aor)"/><text x="255.0" y="275" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">4. ตอบ JSON [ {...}, {...} ]</text><rect x="30" y="330" width="280" height="70" rx="10" fill="#e0ebff" stroke="#1a4fb0" stroke-width="2"/><text x="170.0" y="359.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">5. Browser วาดหน้าเว็บ</text><text x="170.0" y="381.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">จากข้อมูล JSON ที่ได้</text><rect x="400" y="330" width="370" height="70" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="585.0" y="359.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ทุกครั้งที่กดปุ่มหรือโหลดหน้า</text><text x="585.0" y="381.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ลูปนี้เกิดขึ้นใหม่ในเสี้ยววินาที</text></svg>