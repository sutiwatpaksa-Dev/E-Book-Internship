<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="ค่าตั้งค่าอยู่ตรงไหนบ้าง" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ค่าตั้งค่าอยู่ตรงไหนบ้าง</title><desc>Neon ให้ connection string ใส่ใน Render env ส่วน vercel.json มีแค่ที่อยู่ API ไม่มีความลับ เครื่องเราใช้รัน migrate ครั้งแรก</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="458" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">ค่าไหนอยู่ที่ไหน</text>
<rect x="30" y="60" width="220" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="140.0" y="87.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Neon</text>
<text x="140.0" y="109.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">สร้างฐานข้อมูล แล้วก๊อป</text>
<text x="140.0" y="131.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">connection string</text>
<text x="140.0" y="153.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ไปใส่ใน Render</text>
<rect x="290" y="60" width="250" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="415.0" y="110.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Render (Environment Variables)</text>
<text x="415.0" y="132.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">DATABASE_URL</text>
<text x="415.0" y="154.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">JWT_SECRET</text>
<text x="415.0" y="176.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">NODE_ENV=production</text>
<text x="415.0" y="198.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">PORT=3000</text>
<text x="415.0" y="220.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">TRUST_PROXY</text>
<rect x="580" y="60" width="190" height="110" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="675.0" y="87.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Vercel</text>
<text x="675.0" y="109.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">client/vercel.json</text>
<text x="675.0" y="131.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">มีแค่ที่อยู่ API</text>
<text x="675.0" y="153.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่มีความลับ</text>
<line x1="252" y1="100" x2="288" y2="100" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="672" y1="172" x2="672" y2="230" stroke="#1a4fb0" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>
<text x="682" y="205" font-size="14" text-anchor="start" fill="#1a4fb0" font-weight="bold">ชี้ไปที่</text>
<rect x="580" y="232" width="190" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="675.0" y="261.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="normal">https://xxx.onrender.com</text>
<text x="675.0" y="283.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="normal">/api/:path*</text>
<line x1="580" y1="267" x2="542" y2="230" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="30" y="290" width="500" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="280.0" y="324.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">เครื่องเรา (ทำครั้งแรกครั้งเดียว)</text>
<text x="280.0" y="346.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">DATABASE_URL=... bun run db:migrate  (+ seed)</text>
<line x1="160" y1="288" x2="160" y2="172" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<text x="172" y="235" font-size="14" text-anchor="start" fill="#0b3c91" font-weight="bold">สร้างตาราง + ข้อมูลตั้งต้น</text>
<rect x="30" y="390" width="740" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="410.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="normal">ค่าลับ (DATABASE_URL, JWT_SECRET) อยู่ในช่อง Environment Variables ของบริการ ไม่อยู่ใน Git</text>
<text x="400.0" y="432.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="normal">คำสั่งที่มีรหัสผ่านจะค้างในประวัติ Terminal: ลบทิ้งหรือพิมพ์ช่องว่างนำหน้า</text>
</svg>
