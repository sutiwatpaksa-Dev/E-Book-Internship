<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 378" role="img" aria-label="Dockerfile หน้าเว็บ 2 ขั้น" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Dockerfile หน้าเว็บ 2 ขั้น</title><desc>ขั้นแรก build หน้าเว็บด้วย Bun ขั้นสองคัดลอก dist ไปไว้ที่ /srv ของกล่อง Caddy</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">client/Dockerfile 2 ขั้น: สร้างในกล่องใหญ่ แล้วย้ายเฉพาะผลลัพธ์</text>
<rect x="24" y="52" width="330" height="230" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="40" y="78" font-size="14" text-anchor="start" fill="#334155" font-weight="bold">ขั้นที่ 1: FROM oven/bun:1 AS build</text>
<rect x="44" y="94" width="290" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="189.0" y="121.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">โค้ด React + node_modules</text>
<line x1="189" y1="140" x2="189" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#as)"/>
<rect x="44" y="162" width="290" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="189.0" y="187.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">bun install → bun run build</text>
<line x1="189" y1="204" x2="189" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#as)"/>
<rect x="44" y="226" width="290" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="189.0" y="253.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">/app/dist  (ไฟล์พร้อมใช้)</text>
<rect x="446" y="52" width="330" height="230" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="462" y="78" font-size="14" text-anchor="start" fill="#15803d" font-weight="bold">ขั้นที่ 2: FROM caddy:2</text>
<rect x="466" y="94" width="290" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="611.0" y="121.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Caddy (ตัวเสิร์ฟ + ทำ HTTPS)</text>
<rect x="466" y="226" width="290" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="611.0" y="253.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">/srv  (หน้าเว็บที่ build แล้ว)</text>
<line x1="336" y1="248" x2="464" y2="248" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<text x="400" y="220" font-size="14" text-anchor="middle" fill="#0b3c91" font-weight="bold">COPY</text>
<text x="400" y="238" font-size="13" text-anchor="middle" fill="#0b3c91" font-weight="bold">--from=build</text>
<rect x="24" y="304" width="330" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="189.0" y="328.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ทิ้งไป: bun, node_modules,</text>
<text x="189.0" y="350.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">โค้ดต้นฉบับ (ไม่ติดไปกับกล่อง)</text>
<rect x="446" y="304" width="330" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="611.0" y="328.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">กล่องสุดท้าย (web) เล็กและสะอาด</text>
<text x="611.0" y="350.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">มีแค่ Caddy กับไฟล์ที่ build แล้ว</text>
</svg>
