<text x="115.0" y="141.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(อีกกล่อง)</text>
<rect x="500" y="76" width="280" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="640.0" y="120.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">กล่อง server</text>
<text x="640.0" y="141.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รอรับที่ 127.0.0.1:3000</text>
