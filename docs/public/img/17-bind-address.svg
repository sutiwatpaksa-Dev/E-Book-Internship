<text x="355" y="116" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เรียก server:3000</text>
<text x="410" y="136" font-size="28" text-anchor="middle" fill="#dc2626" font-weight="bold">✕</text>
<text x="400" y="200" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">Caddy ต่อไม่ถึง  →  502 Bad Gateway</text>
<text x="400" y="250" font-size="16" text-anchor="middle" fill="#16a34a" font-weight="bold">ถูก: server รอรับจากทุกที่</text>
<rect x="20" y="262" width="190" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
