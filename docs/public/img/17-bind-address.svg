<text x="115.0" y="327.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(อีกกล่อง)</text>
<rect x="500" y="262" width="280" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="640.0" y="306.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">กล่อง server</text>
<text x="640.0" y="327.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รอรับที่ 0.0.0.0:3000</text>
<line x1="210" y1="312" x2="498" y2="312" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="355" y="302" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เรียก server:3000</text>
<text x="400" y="386" font-size="15" text-anchor="middle" fill="#16a34a" font-weight="bold">Caddy เรียกถึง  →  ใช้งานได้</text>
