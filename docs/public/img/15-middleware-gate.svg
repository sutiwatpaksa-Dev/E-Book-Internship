<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-label="ด่านตรวจ requireAdmin" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ด่านตรวจ requireAdmin</title><desc>คำขอ login ถูกตอบก่อนถึงด่าน ส่วนคำขออื่นของ /api/admin ต้องผ่านด่าน ไม่ผ่านได้ 401</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="463" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">ด่านตรวจ requireAdmin</text>
<text x="20" y="66" font-size="16" text-anchor="start" fill="#0b3c91" font-weight="bold">คำขอ 1: login (ไม่ต้องมีบัตร)</text><rect x="20" y="78" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="115.0" y="97.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">POST</text><text x="115.0" y="119.2" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">/api/admin/login</text><line x1="210" y1="103" x2="260" y2="103" stroke="#0b3c91" stroke-width="2" marker-end="url(#an)"/><rect x="260" y="78" width="250" height="50" rx="8" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/><text x="385.0" y="97.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">① authRoutes</text><text x="385.0" y="119.2" font-size="15" text-anchor="middle" fill="#0f172a">login / logout</text><line x1="510" y1="103" x2="560" y2="103" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><rect x="560" y="78" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="97.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ตอบกลับเลย</text><text x="670.0" y="119.2" font-size="15" text-anchor="middle" fill="#0f172a">ไม่ผ่านด่าน ②</text><text x="20" y="166" font-size="16" text-anchor="start" fill="#0b3c91" font-weight="bold">คำขอ 2: เรียกข้อมูลหลังบ้าน</text><rect x="20" y="178" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="115.0" y="197.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">GET</text><text x="115.0" y="219.2" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">/api/admin/me</text><line x1="210" y1="203" x2="260" y2="203" stroke="#0b3c91" stroke-width="2" marker-end="url(#an)"/><rect x="260" y="170" width="250" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="385.0" y="186.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">② requireAdmin</text><text x="385.0" y="208.2" font-size="15" text-anchor="middle" fill="#0f172a">มี cookie และ JWT ถูกต้อง</text><text x="385.0" y="230.2" font-size="15" text-anchor="middle" fill="#0f172a">ยังไม่หมดอายุ ?</text><line x1="510" y1="203" x2="560" y2="203" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><text x="535" y="194" font-size="15" text-anchor="middle" fill="#15803d" font-weight="bold">ใช่</text><rect x="560" y="178" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="197.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">③ adminRoutes ทำงาน</text><text x="670.0" y="219.2" font-size="15" text-anchor="middle" fill="#0f172a">→ 200</text><line x1="385" y1="236" x2="385" y2="266" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="405" y="258" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">ไม่</text><rect x="260" y="268" width="250" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="385.0" y="293.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">401 กรุณาเข้าสู่ระบบ</text><rect x="20" y="330" width="430" height="112" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="356" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">app.route("/api/admin", authRoutes);   // ①</text><text x="32" y="381" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">app.use("/api/admin/*", requireAdmin); // ②</text><text x="32" y="406" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">app.route("/api/admin", adminRoutes);  // ③</text><text x="32" y="433" font-size="15" text-anchor="start" fill="#475569">Hono ทำงานตามลำดับบรรทัดที่เขียน</text><rect x="470" y="330" width="310" height="112" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="625" y="358" font-size="16" text-anchor="middle" fill="#b45309" font-weight="bold">ลำดับบรรทัดสำคัญมาก</text><text x="625" y="386" font-size="15" text-anchor="middle" fill="#0f172a">ถ้าสลับ ② ขึ้นก่อน ①</text><text x="625" y="411" font-size="15" text-anchor="middle" fill="#0f172a">คำขอ login ก็ต้องผ่านด่าน</text><text x="625" y="436" font-size="15" text-anchor="middle" fill="#0f172a">→ ไม่มีใคร login ได้เลย</text>
</svg>
