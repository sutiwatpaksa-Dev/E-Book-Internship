<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="เปิดเว็บ 1 ครั้งมี 4 ขั้น" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>เปิดเว็บ 1 ครั้งมี 4 ขั้น</title><desc>พิมพ์ https://shop.example.com/about แล้วผ่าน DNS, TCP, TLS, HTTP ตามลำดับ พร้อมอาการเมื่อพัง</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="468" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">เปิดเว็บ 1 ครั้งมี 4 ขั้น</text>
<rect x="150" y="44" width="500" height="36" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="400.0" y="67.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">https://shop.example.com/about</text>
<rect x="30" y="100" width="300" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="180.0" y="126.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">1 หาที่อยู่ (DNS)</text>
<text x="180.0" y="147.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">"shop.example.com อยู่ IP อะไร?"</text>
<rect x="400" y="104" width="170" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="485.0" y="126.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ผ่าน</text>
<text x="485.0" y="147.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ได้ 203.0.113.10</text>
<rect x="590" y="104" width="185" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="682.5" y="126.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">พัง</text>
<text x="682.5" y="147.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">NXDOMAIN</text>
<line x1="330" y1="132" x2="398" y2="132" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="180" y1="164" x2="180" y2="184" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="30" y="184" width="300" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="180.0" y="210.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">2 ต่อสาย (TCP)</text>
<text x="180.0" y="231.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ต่อไปที่ 203.0.113.10 ประตู 443</text>
<rect x="400" y="188" width="170" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="485.0" y="210.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ผ่าน</text>
<text x="485.0" y="231.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ต่อติด</text>
<rect x="590" y="188" width="185" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="682.5" y="210.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">พัง</text>
<text x="682.5" y="231.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">timed out / refused</text>
<line x1="330" y1="216" x2="398" y2="216" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="180" y1="248" x2="180" y2="268" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="30" y="268" width="300" height="64" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="180.0" y="294.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">3 ตรวจบัตร (TLS)</text>
<text x="180.0" y="315.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ขอดูใบรับรองว่าเป็นเว็บจริง</text>
<rect x="400" y="272" width="170" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="485.0" y="294.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ผ่าน</text>
<text x="485.0" y="315.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ขึ้นรูปกุญแจ</text>
<rect x="590" y="272" width="185" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="682.5" y="294.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">พัง</text>
<text x="682.5" y="315.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">not private</text>
<line x1="330" y1="300" x2="398" y2="300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="180" y1="332" x2="180" y2="352" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="30" y="352" width="300" height="64" rx="10" fill="#0b3c91" stroke="#0b3c91" stroke-width="2"/>
<text x="180.0" y="378.8" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">4 ส่งคำขอ (HTTP)</text>
<text x="180.0" y="399.8" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="normal">ขอหน้า /about</text>
<rect x="400" y="356" width="170" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="485.0" y="378.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ผ่าน</text>
<text x="485.0" y="399.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">200 OK</text>
<rect x="590" y="356" width="185" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="682.5" y="378.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">พัง</text>
<text x="682.5" y="399.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">404 / 500 / 502</text>
<line x1="330" y1="384" x2="398" y2="384" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="400" y="452" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ลูกศรเขียว = ไปขั้นต่อไปได้ · ช่องแดง = ข้อความที่เห็นเมื่อพังที่ขั้นนั้น</text>
</svg>
