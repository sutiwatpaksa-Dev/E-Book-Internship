<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Transaction: BEGIN, คำสั่งหลายขั้น แล้ว COMMIT หรือ ROLLBACK">
<title>Transaction: BEGIN, คำสั่งหลายขั้น แล้ว COMMIT หรือ ROLLBACK</title>
<defs><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker></defs>
<rect x="1" y="1" width="798" height="318" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="25" y="40" width="110" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="80.0" y="66" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">BEGIN</text>
<text x="80.0" y="90" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เริ่มก้อน</text>
<rect x="185" y="40" width="190" height="70" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="280.0" y="66" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT</text>
<text x="280.0" y="90" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">สร้างรายการเช่า</text>
<rect x="425" y="40" width="190" height="70" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="520.0" y="66" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">UPDATE</text>
<text x="520.0" y="90" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เปลี่ยนสถานะเครื่อง</text>
<rect x="665" y="40" width="110" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="720.0" y="66" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">COMMIT</text>
<text x="720.0" y="90" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ยืนยัน</text>
<line x1="135" y1="75" x2="185" y2="75" stroke="#00767f" stroke-width="2" marker-end="url(#arn)"/>
<line x1="375" y1="75" x2="425" y2="75" stroke="#00767f" stroke-width="2" marker-end="url(#arn)"/>
<line x1="615" y1="75" x2="665" y2="75" stroke="#00767f" stroke-width="2" marker-end="url(#arn)"/>
<text x="720" y="134" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ทุกคำสั่งมีผลจริง</text>
<text x="720" y="154" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">และไม่หายแม้ไฟดับ</text>
<line x1="520" y1="110" x2="520" y2="190" stroke="#dc2626" stroke-width="3" marker-end="url(#arr)"/>
<text x="534" y="158" font-size="16" fill="#dc2626" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ERROR! (ผิดกฎ)</text>
<rect x="425" y="195" width="190" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="520.0" y="221" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">ROLLBACK</text>
<text x="520.0" y="245" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ย้อนกลับทั้งหมด</text>
<text x="30" y="205" font-size="16" fill="#dc2626" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ถ้าขั้นไหนพัง</text>
<text x="30" y="228" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">INSERT ที่ทำไปแล้ว</text>
<text x="30" y="248" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ก็ถูกยกเลิกด้วย</text>
<text x="400" y="300" font-size="16" fill="#00767f" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">สำเร็จทั้งหมด หรือไม่เกิดอะไรเลย (Atomicity)</text>
</svg>
