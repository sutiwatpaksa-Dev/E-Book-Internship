<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" role="img" aria-label="เช่าชื่อ สมุดโทรศัพท์ และเครื่องที่รันเว็บ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>เช่าชื่อ สมุดโทรศัพท์ และเครื่องที่รันเว็บ</title><desc>ร้านขายชื่อเว็บ ผู้ดูแล DNS และเครื่องที่รันเว็บอยู่คนละเจ้าได้ เชื่อมกันด้วย nameserver และบรรทัด A</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">เช่าชื่อ สมุดโทรศัพท์ และเครื่องที่รันเว็บ</text>
<rect x="20" y="56" width="220" height="130" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="130.0" y="94.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">1 ร้านขายชื่อเว็บ</text>
<text x="130.0" y="115.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Registrar (ร้าน A)</text>
<text x="130.0" y="136.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เช่าชื่อ จ่ายรายปี</text>
<text x="130.0" y="157.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ภาพจำ: สำนักงานที่ดิน</text>
<rect x="290" y="56" width="220" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="94.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">2 ผู้ดูแลสมุดโทรศัพท์</text>
<text x="400.0" y="115.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">DNS host (Cloudflare)</text>
<text x="400.0" y="136.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เก็บว่าชื่อไหน → IP ไหน</text>
<text x="400.0" y="157.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ภาพจำ: สมุดโทรศัพท์</text>
<rect x="560" y="56" width="220" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="94.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">3 เครื่องที่รันเว็บ</text>
<text x="670.0" y="115.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">VPS / Vercel (เจ้า C)</text>
<text x="670.0" y="136.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รันโปรแกรมและเว็บจริง</text>
<text x="670.0" y="157.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ภาพจำ: ตัวบ้าน</text>
<line x1="240" y1="121" x2="288" y2="121" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="510" y1="121" x2="558" y2="121" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="20" y="230" width="370" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="205.0" y="259.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ลิงก์ 1 → 2</text>
<text x="205.0" y="280.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ใส่ nameserver (NS) ที่ร้านขายชื่อ ให้ชี้ไปหา DNS host</text>
<rect x="410" y="230" width="370" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="595.0" y="259.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ลิงก์ 2 → 3</text>
<text x="595.0" y="280.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ที่ DNS host ใส่บรรทัด A: example.com → IP ของเครื่อง</text>
<text x="400" y="340" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">3 อย่างนี้อยู่คนละเจ้าได้ ขอแค่ลิงก์ทั้งสองตั้งถูก</text>
</svg>
