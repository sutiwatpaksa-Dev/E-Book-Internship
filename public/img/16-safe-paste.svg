<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="อะไรวางใน AI ได้ และอะไรห้ามวาง" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>อะไรวางใน AI ได้ และอะไรห้ามวาง</title><desc>ห้ามวางความลับ ข้อมูลลูกค้า dump ฐานข้อมูลจริง URL ภายใน; ให้วางข้อความ error โค้ดสั้นๆ ที่ปิดข้อมูลแล้ว</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="798" height="408" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">ก่อนกดส่ง: ถามตัวเองว่าอะไรวางได้</text>
<rect x="20" y="50" width="376" height="290" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="208.0" y="74" font-size="16" text-anchor="middle" fill="#0b3c91" font-weight="bold">วางได้ (ถ้าทีมอนุญาตเครื่องมือนี้)</text>
<text x="208.0" y="112" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อความ error (ตัดความลับออก)</text>
<text x="208.0" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">โค้ดสั้นๆ เฉพาะส่วนที่เกี่ยว</text>
<text x="208.0" y="184" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ชื่อและเวอร์ชันของ library</text>
<text x="208.0" y="220" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">สิ่งที่คาดหวัง vs ที่เกิดจริง</text>
<text x="208.0" y="256" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">สิ่งที่ลองแล้ว</text>
<text x="208.0" y="292" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลตัวอย่างที่แต่งเอง</text>
<rect x="404" y="50" width="376" height="290" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="592.0" y="74" font-size="16" text-anchor="middle" fill="#0b3c91" font-weight="bold">ห้ามวาง</text>
<text x="592.0" y="112" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไฟล์ .env, API key, token, รหัสผ่าน</text>
<text x="592.0" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลลูกค้าจริง (ชื่อ เบอร์ อีเมล)</text>
<text x="592.0" y="184" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">dump ฐานข้อมูลจริง</text>
<text x="592.0" y="220" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">URL/IP ภายในองค์กร</text>
<text x="592.0" y="256" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">โค้ดลูกค้าที่ยังไม่ได้รับอนุญาต</text>
<text x="592.0" y="292" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลสัญญา/ภายในที่เป็นความลับ</text>
<rect x="20" y="354" width="760" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400" y="382" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เผลอวางความลับแล้ว: ถือว่ารั่ว → เปลี่ยน (rotate) key ทันที แล้วแจ้งพี่ไบต์</text>
</svg>
