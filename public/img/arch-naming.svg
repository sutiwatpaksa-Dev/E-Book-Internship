<text x="215" y="236" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">use-laptops.ts</text>
<rect x="410" y="64" width="350" height="200" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
