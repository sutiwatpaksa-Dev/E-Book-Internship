<text x="215" y="134" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">laptop-cards/</text>
<text x="215" y="168" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">rent-form.tsx</text>
