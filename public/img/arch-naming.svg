<text x="585" y="134" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">LaptopCards/</text>
<text x="585" y="168" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">แบบฟอร์ม เช่า.tsx</text>
<text x="585" y="202" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">LaptopService.ts</text>
<text x="585" y="236" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">รายการ/</text>
<text x="400" y="288" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">เหตุผล: Linux/Docker แยกตัวพิมพ์เล็ก-ใหญ่ แต่ Windows/Mac ไม่แยก ชื่อผิดแล้วพังตอน deploy</text>
