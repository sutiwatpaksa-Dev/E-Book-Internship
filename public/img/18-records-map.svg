<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" role="img" aria-label="บรรทัดในสมุดโทรศัพท์ ชี้ไปไหนบ้าง" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>บรรทัดในสมุดโทรศัพท์ ชี้ไปไหนบ้าง</title><desc>A ชี้ชื่อไป IP, CNAME ชี้ชื่อไปชื่ออื่น, MX ชี้ไปเครื่องรับอีเมล, TXT เก็บข้อความ</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="412" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">บรรทัดในสมุดโทรศัพท์ ชี้ไปไหนบ้าง</text>
<rect x="20" y="150" width="200" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="120.0" y="183.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">www.example.com</text>
<rect x="300" y="150" width="180" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="390.0" y="183.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">example.com</text>
<rect x="560" y="150" width="220" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="172.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">IP 203.0.113.10</text>
<text x="670.0" y="193.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">(เครื่องเช่า)</text>
<line x1="220" y1="178" x2="298" y2="178" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="260" y="164" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">CNAME</text>
<line x1="480" y1="178" x2="558" y2="178" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="520" y="164" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">A</text>
<text x="260" y="200" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal"></text>
<text x="400" y="70" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">ถามหา www.example.com ได้คำตอบ 2 ต่อ: ตามชื่อไปจนถึง IP</text>
<text x="400" y="96" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">dig +short www.example.com → example.com. แล้วตามด้วย IP</text>
<line x1="20" y1="240" x2="780" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="400" y="268" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">บรรทัดชนิดอื่นของ example.com</text>
<rect x="20" y="284" width="230" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="135.0" y="306.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">MX</text>
<text x="135.0" y="327.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">→ mx.mailprovider.com</text>
<text x="135.0" y="348.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">อีเมล @example.com</text>
<rect x="285" y="284" width="230" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="400.0" y="306.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">TXT</text>
<text x="400.0" y="327.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">"google-site-verification=..."</text>
<text x="400.0" y="348.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ยืนยันเจ้าของ / ตั้งค่าอีเมล</text>
<rect x="550" y="284" width="230" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="665.0" y="306.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">NS</text>
<text x="665.0" y="327.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ns1.cloudflare.com</text>
<text x="665.0" y="348.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ใครดูแลสมุดของชื่อนี้</text>
<text x="400" y="396" font-size="15" text-anchor="middle" fill="#d97706" font-weight="bold">ชื่อหลักใช้ A, www ใช้ CNAME ไปหาชื่อหลัก (CNAME ห้ามมีบรรทัดอื่นปนที่ชื่อเดียวกัน)</text>
</svg>
