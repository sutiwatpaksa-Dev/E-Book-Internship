<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"><title>ภาพรวม Full-Stack</title><defs><marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="snavy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#00767f"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="sblue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#0e8a94"/></marker><marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="sor" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#f59e0b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="sgr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="srd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="sgy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker></defs><rect x="2" y="2" width="796" height="396" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="400" y="34" font-size="19" text-anchor="middle" font-weight="700" fill="#00767f" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Full-Stack = เข้าใจทั้งหน้าบ้านและหลังบ้าน</text><rect x="20" y="70" width="170" height="120" rx="10" fill="#dff3f5" stroke="#0e8a94" stroke-width="2"/><text x="105.0" y="112.4" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Browser</text><text x="105.0" y="135.6" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(Frontend)</text><text x="105.0" y="158.8" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">หน้าเว็บที่ผู้ใช้เห็น</text><rect x="300" y="70" width="170" height="120" rx="10" fill="#d5f0f2" stroke="#00767f" stroke-width="2"/><text x="385.0" y="112.4" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Server</text><text x="385.0" y="135.6" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(Backend / API)</text><text x="385.0" y="158.8" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ตรรกะ + กฎธุรกิจ</text><rect x="610" y="70" width="170" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="695.0" y="112.4" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Database</text><text x="695.0" y="135.6" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ที่เก็บข้อมูลถาวร</text><text x="695.0" y="158.8" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(PostgreSQL)</text><line x1="190" y1="105" x2="300" y2="105" stroke="#00767f" stroke-width="2.5" marker-end="url(#anavy)"/><text x="245" y="95" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">request</text><line x1="300" y1="155" x2="190" y2="155" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aor)"/><text x="245" y="178" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">JSON</text><line x1="470" y1="105" x2="610" y2="105" stroke="#00767f" stroke-width="2.5" marker-end="url(#anavy)"/><text x="540" y="95" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">SQL</text><line x1="610" y1="155" x2="470" y2="155" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aor)"/><text x="540" y="178" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ข้อมูล</text><text x="245" y="214" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ผ่านอินเทอร์เน็ต (HTTP)</text><text x="540" y="214" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ในเครือข่ายหลังบ้าน</text><rect x="20" y="240" width="170" height="100" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="105.0" y="273.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ทำอะไร</text><text x="105.0" y="295.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">HTML / CSS / JS</text><text x="105.0" y="317.0" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ปุ่ม ฟอร์ม หน้าตา</text><rect x="300" y="240" width="170" height="100" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="385.0" y="273.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ทำอะไร</text><text x="385.0" y="295.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">รับคำขอ ตรวจสิทธิ์</text><text x="385.0" y="317.0" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">คิดราคา ตอบกลับ</text><rect x="610" y="240" width="170" height="100" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="695.0" y="273.5" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ทำอะไร</text><text x="695.0" y="295.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เก็บ ค้นหา แก้ไข</text><text x="695.0" y="317.0" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ไม่ให้ข้อมูลหาย</text><text x="105" y="365" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ร้านอาหาร: ลูกค้า</text><text x="385" y="365" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">พนักงาน+ครัว</text><text x="695" y="365" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ห้องเก็บวัตถุดิบ</text></svg>