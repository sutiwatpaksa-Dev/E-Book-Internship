<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="การสำรองข้อมูล: dump ออกเป็นไฟล์ แล้ว restore เข้า database ใหม่">
<title>การสำรองข้อมูล: dump ออกเป็นไฟล์ แล้ว restore เข้า database ใหม่</title>
<defs><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker></defs>
<rect x="1" y="1" width="798" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="20" y="60" width="170" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="105.0" y="98" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">shop</text>
<text x="105.0" y="126" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">database ต้นทาง</text>
<rect x="315" y="60" width="170" height="90" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="400.0" y="98" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">shop.sql</text>
<text x="400.0" y="126" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ไฟล์สำรอง (ข้อความ)</text>
<rect x="610" y="60" width="170" height="90" rx="14" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="695.0" y="98" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">shop_copy</text>
<text x="695.0" y="126" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">database ปลายทาง</text>
<line x1="190" y1="105" x2="315" y2="105" stroke="#00767f" stroke-width="3" marker-end="url(#arn)"/>
<line x1="485" y1="105" x2="610" y2="105" stroke="#00767f" stroke-width="3" marker-end="url(#arn)"/>
<text x="252" y="92" font-size="16" fill="#00767f" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">dump</text>
<text x="548" y="92" font-size="16" fill="#00767f" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">restore</text>
<rect x="20" y="185" width="365" height="86" rx="10" fill="#ffffff" stroke="#0e8a94" stroke-width="2"/>
<text x="34" y="212" font-size="16" fill="#0e8a94" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">PostgreSQL</text>
<text x="34" y="238" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">pg_dump  ...  &gt;  shop.sql</text>
<text x="34" y="260" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">psql  ...  &lt;  shop.sql</text>
<rect x="415" y="185" width="365" height="86" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="429" y="212" font-size="16" fill="#b45309" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">MySQL</text>
<text x="429" y="238" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">mysqldump  ...  &gt;  shop.sql</text>
<text x="429" y="260" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">mysql  ...  &lt;  shop.sql</text>
</svg>
