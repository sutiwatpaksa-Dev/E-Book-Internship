<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" role="img" aria-label="ข้างในบัตรผ่าน (JWT)" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ข้างในบัตรผ่าน (JWT)</title><desc>JWT มี 3 ส่วน header payload signature อ่านได้แต่แก้ไม่ได้ เพราะมีลายเซ็น</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="423" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">ข้างในบัตรผ่าน (JWT)</text>
<rect x="30" y="60" width="230" height="110" rx="8" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/><text x="145" y="92" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="bold">header</text><text x="145" y="118" font-size="15" text-anchor="middle" fill="#475569">บอกวิธีเซ็น</text><text x="145" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">{ alg: "HS256" }</text><rect x="285" y="60" width="230" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="400" y="92" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="bold">payload</text><text x="400" y="118" font-size="15" text-anchor="middle" fill="#475569">ข้อมูลในบัตร</text><text x="400" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">{ sub: "1", exp: ... }</text><rect x="540" y="60" width="230" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="655" y="92" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="bold">signature</text><text x="655" y="118" font-size="15" text-anchor="middle" fill="#475569">ลายเซ็นกันปลอม</text><text x="655" y="148" font-size="15" text-anchor="middle" fill="#0f172a">เซ็นด้วย JWT_SECRET</text><text x="272" y="138" font-size="48" text-anchor="middle" fill="#0f172a" font-weight="bold">.</text><text x="527" y="138" font-size="48" text-anchor="middle" fill="#0f172a" font-weight="bold">.</text><text x="145" y="192" font-size="15" text-anchor="middle" fill="#475569">sub = เลขบัญชี</text><text x="400" y="192" font-size="15" text-anchor="middle" fill="#475569">exp = เวลาหมดอายุ (1 วัน)</text><rect x="30" y="215" width="350" height="150" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="205" y="243" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold">ไม่ได้เข้ารหัส ใครก็อ่านได้</text><text x="205" y="275" font-size="15" text-anchor="middle" fill="#0f172a">header กับ payload ถอดอ่านได้ทันที</text><text x="205" y="300" font-size="15" text-anchor="middle" fill="#0f172a">จึงใส่ได้แค่ข้อมูลที่ไม่ลับ</text><text x="205" y="325" font-size="15" text-anchor="middle" fill="#0f172a">เช่น เลขบัญชี กับเวลาหมดอายุ</text><text x="205" y="350" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="bold">ห้ามใส่รหัสผ่าน</text><rect x="420" y="215" width="350" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="595" y="243" font-size="17" text-anchor="middle" fill="#15803d" font-weight="bold">เซ็นชื่อไว้ กันการแก้</text><text x="595" y="275" font-size="15" text-anchor="middle" fill="#0f172a">กุญแจ JWT_SECRET อยู่ที่ server เท่านั้น</text><text x="595" y="300" font-size="15" text-anchor="middle" fill="#0f172a">ถ้าใครแก้ payload ลายเซ็นจะไม่ตรง</text><text x="595" y="325" font-size="15" text-anchor="middle" fill="#0f172a">verify() ไม่ผ่าน → ถือว่าไม่มีบัตร</text><text x="595" y="350" font-size="15" text-anchor="middle" fill="#0f172a">(ตรวจ exp ให้เองด้วย)</text><text x="400" y="400" font-size="15" text-anchor="middle" fill="#0b3c91" font-weight="bold">JWT = header.payload.signature ต่อกันด้วยจุด</text>
</svg>
