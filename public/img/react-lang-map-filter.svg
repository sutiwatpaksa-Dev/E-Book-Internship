<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="map และ filter: ได้ array ใหม่เสมอ ของเดิมไม่เปลี่ยน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
