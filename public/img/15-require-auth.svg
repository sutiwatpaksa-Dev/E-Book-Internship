<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="RequireAuth ฝั่งหน้าเว็บ 3 สถานะ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>RequireAuth ฝั่งหน้าเว็บ 3 สถานะ</title><desc>checking in out: เรียก getMe ได้ 200 แสดงหน้า ได้ 401 พาไปหน้า login แล้วกลับมาหน้าเดิม</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="428" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">RequireAuth ฝั่งหน้าเว็บ 3 สถานะ</text>
<rect x="30" y="70" width="200" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="130.0" y="104.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">checking</text><text x="130.0" y="126.2" font-size="15" text-anchor="middle" fill="#0f172a">กำลังตรวจสอบสิทธิ์...</text><text x="130" y="60" font-size="15" text-anchor="middle" fill="#475569">เปิดหน้าหลังบ้าน</text><line x1="230" y1="95" x2="330" y2="95" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><text x="280" y="83" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">getMe()</text><text x="280" y="119" font-size="15" text-anchor="middle" fill="#15803d" font-weight="bold">ได้ 200</text><rect x="330" y="60" width="220" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="89.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">in</text><text x="440.0" y="111.2" font-size="15" text-anchor="middle" fill="#0f172a">แสดงหน้าหลังบ้าน (children)</text><line x1="130" y1="150" x2="130" y2="205" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="145" y="183" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">ได้ 401</text><rect x="30" y="205" width="220" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="140.0" y="228.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">out</text><text x="140.0" y="250.2" font-size="15" text-anchor="middle" fill="#0f172a">Navigate ไป /admin/login</text><text x="140.0" y="272.2" font-size="15" text-anchor="middle" fill="#0f172a">เก็บ state.from ไว้</text><line x1="250" y1="245" x2="330" y2="245" stroke="#00767f" stroke-width="2" marker-end="url(#an)"/><rect x="330" y="205" width="220" height="80" rx="8" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="440.0" y="239.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">หน้า login</text><text x="440.0" y="261.2" font-size="15" text-anchor="middle" fill="#0f172a">กรอกอีเมล + รหัสผ่าน</text><line x1="440" y1="205" x2="440" y2="132" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><text x="455" y="160" font-size="15" text-anchor="start" fill="#15803d" font-weight="bold">login สำเร็จ → navigate(from)</text><text x="455" y="182" font-size="15" text-anchor="start" fill="#15803d">กลับหน้าที่ตั้งใจ แล้วตรวจอีกรอบ</text><rect x="30" y="305" width="740" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="400" y="331" font-size="15" text-anchor="middle" fill="#0f172a">เช็คใหม่ทุกครั้งที่เปลี่ยนหน้า เพราะบัตรอาจหมดอายุระหว่างใช้งาน</text><rect x="30" y="360" width="740" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="400" y="382" font-size="16" text-anchor="middle" fill="#b45309" font-weight="bold">ตัวกันจริงคือ server (ตอบ 401)</text><text x="400" y="403" font-size="15" text-anchor="middle" fill="#0f172a">RequireAuth แค่พาคนไปหน้า login ไม่ได้ปกป้องข้อมูลเอง</text>
</svg>
