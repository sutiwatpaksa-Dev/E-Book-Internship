<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="รูปแบบ prompt ที่ใช้ได้กับทุกเครื่องมือ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>รูปแบบ prompt ที่ใช้ได้กับทุกเครื่องมือ</title><desc>ส่วนประกอบ prompt: บทบาท เป้าหมาย ข้อจำกัด ตัวอย่างเข้าออก ให้ลิสต์สมมติฐาน เทสต์ก่อน ให้อธิบาย</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="798" height="398" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">6 ชิ้นต่อ prompt ใช้ได้ทั้งแชทและ agent</text>
<rect x="20" y="52" width="252" height="112" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="146.0" y="76" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">บทบาท</text>
<text x="146.0" y="100" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เช่น &#x27;เป็นพี่เลี้ยง สอนน้องฝึกงาน&#x27;</text>
<rect x="274" y="52" width="252" height="112" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="400.0" y="76" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">เป้าหมาย</text>
<text x="400.0" y="100" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ทำอะไร ชิ้นเดียว</text>
<rect x="528" y="52" width="252" height="112" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="654.0" y="76" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">ข้อจำกัด</text>
<text x="654.0" y="100" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ห้ามอะไร แก้ไฟล์ไหนได้</text>
<rect x="20" y="182" width="252" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="146.0" y="206" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">ตัวอย่างเข้า/ออก</text>
<text x="146.0" y="230" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">input → output ที่ต้องการ</text>
<rect x="274" y="182" width="252" height="112" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="206" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">ขอสมมติฐาน</text>
<text x="400.0" y="230" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">&#x27;ลิสต์สิ่งที่คุณเดาไว้ก่อนเริ่ม&#x27;</text>
<rect x="528" y="182" width="252" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="654.0" y="206" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">เทสต์ก่อน + ให้อธิบาย</text>
<text x="654.0" y="230" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เขียนเทสต์ก่อน แล้วอธิบายเหตุผล</text>
<rect x="20" y="320" width="760" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="400" y="345" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตัวอย่างสั้น: &#x27;เป็นพี่เลี้ยง: เขียนเทสต์ก่อนสำหรับฟังก์ชัน X (input A → output B)</text>
<text x="400" y="366" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ห้ามแก้ไฟล์อื่น ลิสต์สมมติฐานก่อน แล้วอธิบายทีละบรรทัด&#x27;</text>
</svg>
