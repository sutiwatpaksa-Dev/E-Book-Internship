<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="ย้ายสมุดไป Cloudflare ทีละขั้น" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ย้ายสมุดไป Cloudflare ทีละขั้น</title><desc>จดชื่อ เพิ่มใน Cloudflare เปลี่ยน nameserver รอ Active แล้วเพิ่มบรรทัด A และ CNAME</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">ย้ายสมุดไป Cloudflare ทีละขั้น</text>
<rect x="30" y="52" width="60" height="56" rx="10" fill="#00767f" stroke="#00767f" stroke-width="2"/>
<text x="60.0" y="88.4" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<rect x="110" y="52" width="660" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="440.0" y="74.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">จดชื่อเว็บ</text>
<text x="440.0" y="95.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ที่ร้านขายชื่อ เปิดต่ออายุอัตโนมัติ + 2FA</text>
<line x1="60" y1="110" x2="60" y2="128" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="30" y="128" width="60" height="56" rx="10" fill="#00767f" stroke="#00767f" stroke-width="2"/>
<text x="60.0" y="164.4" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<rect x="110" y="128" width="660" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="440.0" y="150.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Add a domain</text>
<text x="440.0" y="171.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ที่ dash.cloudflare.com เลือกแผน Free</text>
<line x1="60" y1="186" x2="60" y2="204" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="30" y="204" width="60" height="56" rx="10" fill="#00767f" stroke="#00767f" stroke-width="2"/>
<text x="60.0" y="240.4" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<rect x="110" y="204" width="660" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="440.0" y="226.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เปลี่ยน nameserver</text>
<text x="440.0" y="247.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เอาชื่อ xxx.ns.cloudflare.com 2 ชื่อ ไปใส่ที่ร้านขายชื่อ</text>
<line x1="60" y1="262" x2="60" y2="280" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="30" y="280" width="60" height="56" rx="10" fill="#00767f" stroke="#00767f" stroke-width="2"/>
<text x="60.0" y="316.4" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<rect x="110" y="280" width="660" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="440.0" y="302.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">รอสถานะ Active</text>
<text x="440.0" y="323.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่กี่นาทีถึงไม่กี่ชั่วโมง</text>
<line x1="60" y1="338" x2="60" y2="356" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="30" y="356" width="60" height="56" rx="10" fill="#00767f" stroke="#00767f" stroke-width="2"/>
<text x="60.0" y="392.4" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<rect x="110" y="356" width="660" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="440.0" y="378.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เพิ่มบรรทัดชี้ไปเครื่องเช่า</text>
<text x="440.0" y="399.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">A @ → IP  ·  CNAME www → example.com</text>
</svg>
