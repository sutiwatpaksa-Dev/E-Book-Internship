<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="โครงหน้าร่วมและ Outlet" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>โครงหน้าร่วมและ Outlet</title><desc>PublicLayout มี Navbar และ Footer ส่วน Outlet คือช่องที่หน้าลูกถูกวาดตามลิงก์</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker></defs>
<rect x="1" y="1" width="798" height="418" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">PublicLayout: โครงที่ทุกหน้าใช้ร่วมกัน + ช่อง Outlet</text>
<rect x="30" y="50" width="440" height="330" rx="12" fill="#ffffff" stroke="#0e8a94" stroke-width="2.5"/>
<text x="46" y="72" font-size="16" text-anchor="start" fill="#0e8a94" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">PublicLayout</text>
<rect x="46" y="84" width="408" height="44" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="250.0" y="111.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Navbar  (เมนู NavLink)</text>
<rect x="46" y="138" width="408" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="250" y="172" font-size="20" text-anchor="middle" fill="#b45309" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;Outlet /&gt;</text>
<text x="250" y="204" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ช่องว่างนี้ = ที่ให้หน้าลูกมาแสดง</text>
<text x="250" y="230" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เปลี่ยนตามลิงก์ (รวมถึงหน้า 404)</text>
<text x="250" y="256" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;main&gt;</text>
<rect x="46" y="298" width="408" height="44" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="250.0" y="325.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Footer  (ที่อยู่ เบอร์โทร เวลาเปิด)</text>
<circle cx="428" cy="358" r="14" fill="#16a34a"/>
<text x="380" y="364" font-size="14" text-anchor="end" fill="#0f172a" font-weight="normal">LineButton</text>
<rect x="560" y="80" width="210" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="665.0" y="100.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">HomePage</text>
<text x="665.0" y="122.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">/</text>
<polyline points="560,106 520,106 520,213 458,213" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<rect x="560" y="150" width="210" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="665.0" y="170.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">AboutPage</text>
<text x="665.0" y="192.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">/about</text>
<polyline points="560,176 520,176 520,213 458,213" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<rect x="560" y="220" width="210" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="665.0" y="240.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ContactPage</text>
<text x="665.0" y="262.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">/contact</text>
<polyline points="560,246 520,246 520,213 458,213" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="665" y="62" font-size="16" text-anchor="middle" fill="#16a34a" font-weight="bold">หน้าลูก</text>
<text x="400" y="404" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Navbar กับ Footer เขียนครั้งเดียว ใช้ร่วมทุกหน้า</text>
</svg>
