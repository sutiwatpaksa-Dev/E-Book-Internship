<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 435" role="img" aria-label="ส่วนประกอบของ HTTP request และ response" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ส่วนประกอบของ HTTP request และ response</title><desc>Request และ Response มี start line, headers และ body เหมือนกัน คั่นด้วยบรรทัดว่าง</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="433" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">หน้าตาของ Request และ Response</text>
<text x="205" y="62" font-size="17" text-anchor="middle" fill="#00767f" font-weight="bold">Request (client → server)</text>
<rect x="20" y="76" width="370" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
<text x="30" y="102" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">POST /laptops HTTP/1.1</text>
<rect x="20" y="122" width="370" height="100" rx="6" fill="#d5f2f3" stroke="#0e8a94"/>
<text x="30" y="147" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">Host: localhost:3000</text>
<text x="30" y="175" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">Content-Type: application/json</text>
<text x="30" y="203" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">Authorization: Bearer abc123</text>
<rect x="20" y="228" width="370" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="30" y="256" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">{"brand":"Lenovo","model":"T14"}</text>
<text x="595" y="62" font-size="17" text-anchor="middle" fill="#00767f" font-weight="bold">Response (server → client)</text>
<rect x="410" y="76" width="370" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
<text x="420" y="102" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">HTTP/1.1 201 Created</text>
<rect x="410" y="122" width="370" height="72" rx="6" fill="#d5f2f3" stroke="#0e8a94"/>
<text x="420" y="147" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">Content-Type: application/json</text>
<text x="420" y="175" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">Content-Length: 78</text>
<rect x="410" y="200" width="370" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="420" y="228" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">{"id":7,"brand":"Lenovo"}</text>
<rect x="40" y="330" width="220" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="150.0" y="346.1" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">Start line</text>
<text x="150.0" y="367.1" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ทำอะไร กับอะไร / ผลเป็นยังไง</text>
<rect x="290" y="330" width="220" height="44" rx="8" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="400.0" y="346.1" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">Headers</text>
<text x="400.0" y="367.1" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลประกอบ ชื่อ: ค่า</text>
<rect x="540" y="330" width="220" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="650.0" y="346.1" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">Body</text>
<text x="650.0" y="367.1" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลจริง (มักเป็น JSON)</text>
<text x="400" y="408" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">คั่นระหว่าง headers กับ body ด้วย "บรรทัดว่าง 1 บรรทัด"</text>
</svg>
