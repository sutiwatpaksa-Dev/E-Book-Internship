<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="ลำดับตอน login" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ลำดับตอน login</title><desc>เบราว์เซอร์ส่งอีเมลและรหัสผ่าน server หาบัญชี เทียบ hash ถ้าตรงออก JWT และส่งกลับใน Set-Cookie ถ้าไม่ตรงตอบ 401</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="498" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">ลำดับตอน login</text>
<rect x="30" y="48" width="160" height="36" rx="8" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="110" y="72" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">เบราว์เซอร์</text><line x1="110" y1="84" x2="110" y2="486" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="320" y="48" width="160" height="36" rx="8" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="400" y="72" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">server (Hono)</text><line x1="400" y1="84" x2="400" y2="486" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="610" y="48" width="160" height="36" rx="8" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="690" y="72" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">ฐานข้อมูล</text><line x1="690" y1="84" x2="690" y2="486" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="110" y1="130" x2="400" y2="130" stroke="#00767f" stroke-width="2" marker-end="url(#an)"/><text x="255" y="112" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">① POST /api/admin/login</text><text x="255" y="150" font-size="15" text-anchor="middle" fill="#475569">ส่งอีเมล + รหัสผ่าน</text><line x1="400" y1="195" x2="690" y2="195" stroke="#00767f" stroke-width="2" marker-end="url(#an)"/><text x="545" y="177" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">② หาบัญชีจากอีเมล</text><line x1="690" y1="235" x2="400" y2="235" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#as)"/><text x="545" y="257" font-size="15" text-anchor="middle" fill="#475569">ได้แถวพร้อม password_hash</text><rect x="250" y="275" width="300" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="400.0" y="302.2" font-size="15" text-anchor="middle" fill="#0f172a">③ Bun.password.verify(รหัสที่พิมพ์, hash)</text><line x1="400" y1="370" x2="110" y2="370" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="255" y="350" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">ไม่ตรง / ไม่พบอีเมล → 401</text><text x="255" y="390" font-size="15" text-anchor="middle" fill="#dc2626">อีเมลหรือรหัสผ่านไม่ถูกต้อง</text><rect x="250" y="405" width="300" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="400.0" y="430.2" font-size="15" text-anchor="middle" fill="#0f172a">④ ตรง → sign JWT (sub, exp = 1 วัน)</text><line x1="400" y1="470" x2="110" y2="470" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><text x="255" y="458" font-size="15" text-anchor="middle" fill="#15803d" font-weight="bold">⑤ 200 + Set-Cookie: session=&lt;JWT&gt;</text>
</svg>
