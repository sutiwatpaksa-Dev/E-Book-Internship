<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Layered: คำขอไหลผ่านชั้นต่างๆ"><title>Layered: คำขอไหลผ่านชั้นต่างๆ</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="798" height="328" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="34" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="18" font-weight="700" fill="#0b3c91" text-anchor="middle">Layered Architecture: คำขอไหลลงทีละชั้น คำตอบไหลกลับขึ้นมา</text>
<rect x="24" y="80" width="128" height="92" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
<text x="88" y="116" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
<text x="88" y="146" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">browser / curl</text>
<line x1="154" y1="126" x2="182" y2="126" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="182" y="80" width="128" height="92" rx="8" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5" />
<text x="246" y="116" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">routes</text>
<text x="246" y="146" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">รับคำขอ ตรวจ input</text>
<line x1="312" y1="126" x2="340" y2="126" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="340" y="80" width="128" height="92" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
<text x="404" y="116" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">services</text>
<text x="404" y="146" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">กฎธุรกิจ</text>
<line x1="470" y1="126" x2="498" y2="126" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="498" y="80" width="128" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
<text x="562" y="116" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">repositories</text>
<text x="562" y="146" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">คุยกับ DB</text>
<line x1="628" y1="126" x2="656" y2="126" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="656" y="80" width="128" height="92" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
<text x="720" y="116" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">database</text>
<text x="720" y="146" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">เก็บข้อมูล</text>
<text x="400" y="214" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="15" font-weight="600" fill="#dc2626" text-anchor="middle">ห้ามข้ามชั้น: routes ไม่คุย database ตรงๆ / repositories ไม่รู้จัก HTTP</text>
<rect x="60" y="236" width="680" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
<text x="400" y="262" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="15" font-weight="400" fill="#0f172a" text-anchor="middle">ข้อดี: อ่านง่าย รู้ทันทีว่าโค้ดแต่ละแบบอยู่ชั้นไหน แก้ที่เดียวไม่กระทบชั้นอื่น</text>
<text x="400" y="284" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="15" font-weight="400" fill="#0f172a" text-anchor="middle">ข้อเสีย: ฟีเจอร์เดียวกระจายอยู่ 3 โฟลเดอร์ ยิ่งโตยิ่งต้องกระโดดไปมา</text>
</svg>
