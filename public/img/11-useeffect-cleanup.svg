<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Cleanup: เก็บกวาดก่อนเริ่มรอบใหม่ หรือก่อนหายไป" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Cleanup: เก็บกวาดก่อนเริ่มรอบใหม่ หรือก่อนหายไป</title><desc>cleanup รันก่อน effect รอบใหม่เมื่อ dependency เปลี่ยน และรันตอน unmount</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="378" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">Cleanup: เก็บกวาดก่อนเริ่มรอบใหม่ หรือก่อนหายไป</text>
<text x="30" y="70" font-size="16" text-anchor="start" fill="#00767f" font-weight="bold">กรณี A: dependency เปลี่ยน (เช่น url)</text>
<rect x="30" y="85" width="200" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="130.0" y="119.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">effect รอบที่ 1</text>
<text x="130.0" y="141.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตั้ง timer / listener</text>
<rect x="300" y="85" width="200" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="119.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">cleanup รอบที่ 1</text>
<text x="400.0" y="141.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เก็บของรอบเก่า</text>
<rect x="570" y="85" width="200" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="670.0" y="119.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">effect รอบที่ 2</text>
<text x="670.0" y="141.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตั้งของใหม่</text>
<line x1="232" y1="125" x2="298" y2="125" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="502" y1="125" x2="568" y2="125" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="265" y="112" font-size="15" text-anchor="middle" fill="#64748b" font-weight="normal">x เปลี่ยน</text>
<text x="535" y="112" font-size="15" text-anchor="middle" fill="#64748b" font-weight="normal">แล้วค่อย</text>
<text x="30" y="220" font-size="16" text-anchor="start" fill="#00767f" font-weight="bold">กรณี B: ชิ้นส่วนหายไปจากจอ (unmount)</text>
<rect x="30" y="235" width="200" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="130.0" y="269.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">effect</text>
<text x="130.0" y="291.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตั้ง timer / listener</text>
<rect x="300" y="235" width="200" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="258.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">cleanup</text>
<text x="400.0" y="280.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">clearInterval /</text>
<text x="400.0" y="302.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">removeEventListener / abort</text>
<rect x="570" y="235" width="200" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="269.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เรียบร้อย</text>
<text x="670.0" y="291.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่มีอะไรค้างอยู่</text>
<line x1="232" y1="275" x2="298" y2="275" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="502" y1="275" x2="568" y2="275" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="265" y="262" font-size="15" text-anchor="middle" fill="#64748b" font-weight="normal">หายไป</text>
<text x="400" y="352" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">ไม่เก็บกวาด = timer ยังเดินต่อ, listener ซ้อนกัน, request ค้าง</text>
</svg>
