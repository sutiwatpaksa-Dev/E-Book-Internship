<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-label="Props: ข้อมูลไหลจากชิ้นส่วนแม่ลงไปหาลูก" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
