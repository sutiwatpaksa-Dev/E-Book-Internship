<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="พิมพ์ลิงก์ตรงๆ หรือรีเฟรชบนระบบจริง" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>พิมพ์ลิงก์ตรงๆ หรือรีเฟรชบนระบบจริง</title><desc>server ต้องส่ง index.html กลับเสมอ ไม่ใช่ตอบ 404 แล้ว React Router เลือกหน้าเอง</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker></defs>
<rect x="1" y="1" width="798" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">พิมพ์ /contact ตรงๆ หรือกดรีเฟรชบนระบบจริง</text>
<rect x="200" y="50" width="400" height="50" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="400.0" y="69.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">พิมพ์ https://เว็บ/contact หรือกดรีเฟรช</text>
<text x="400.0" y="91.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เบราว์เซอร์ถาม server ว่าขอไฟล์ "contact"</text>
<polyline points="300,100 300,130 205,130 205,150" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<polyline points="500,100 500,130 595,130 595,150" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<text x="205" y="146" font-size="1" text-anchor="middle" fill="#0f172a" font-weight="normal"></text>
<rect x="30" y="150" width="350" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="205.0" y="179.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">server ตั้งผิด  ✗</text>
<text x="205.0" y="201.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">หาไฟล์ชื่อ contact ไม่เจอ</text>
<line x1="205" y1="220" x2="205" y2="250" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="30" y="250" width="350" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="205.0" y="275.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ตอบ 404</text>
<text x="205.0" y="297.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ผู้ใช้เห็นหน้าพัง ทั้งที่ลิงก์ถูก</text>
<rect x="420" y="150" width="350" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="595.0" y="179.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">server ตั้งถูก  ✓</text>
<text x="595.0" y="201.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่มีไฟล์ตามที่ขอ → ส่ง index.html กลับ</text>
<line x1="595" y1="220" x2="595" y2="250" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="420" y="250" width="350" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="595.0" y="275.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เบราว์เซอร์โหลด index.html + โค้ด React</text>
<text x="595.0" y="297.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Router อ่านลิงก์ /contact</text>
<line x1="595" y1="312" x2="595" y2="338" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="420" y="338" width="350" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="595.0" y="365.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แสดงหน้า ContactPage</text>
<rect x="30" y="400" width="740" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="400.0" y="420.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตอนพัฒนา Vite ทำให้เอง · ตอนขึ้นระบบจริงต้องตั้งเอง (บทที่ 20 และ 22)</text>
