<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-label="ตรวจไฟล์ .env ตอนเปิดโปรแกรม" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ตรวจไฟล์ .env ตอนเปิดโปรแกรม</title><desc>env.ts ตรวจค่าตั้งค่าด้วย Zod ถ้าผ่านได้ env ที่ชนิดถูกต้อง ถ้าขาดหรือผิดโปรแกรมหยุดทันที</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker></defs>
<rect x="1" y="1" width="798" height="388" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">src/env.ts ตรวจค่าตั้งค่าตั้งแต่เปิดโปรแกรม</text>
<rect x="30" y="56" width="250" height="196" rx="10" fill="#ffffff" stroke="#0e8a94" stroke-width="2"/>
<text x="155" y="82" font-size="16" text-anchor="middle" fill="#0e8a94" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">server/.env</text>
<text x="46" y="114" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">DATABASE_URL=postgres://…</text>
<text x="46" y="142" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">PORT=3000</text>
<text x="46" y="184" font-size="15" text-anchor="start" fill="#64748b" font-weight="normal">ไม่ใส่ก็ได้ (มีค่าเริ่มต้น)</text>
<text x="46" y="208" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">NODE_ENV = development</text>
<text x="46" y="232" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">TRUST_PROXY = false</text>
<line x1="280" y1="154" x2="320" y2="154" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="320" y="100" width="160" height="108" rx="10" fill="#d5f2f3" stroke="#00767f" stroke-width="2"/>
<text x="400.0" y="137.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Env.parse(</text>
<text x="400.0" y="159.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">process.env)</text>
<text x="400.0" y="181.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตรวจด้วย Zod</text>
<polyline points="480,140 510,140 510,100 540,100" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<polyline points="480,170 510,170 510,212 540,212" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="540" y="56" width="230" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="655.0" y="85.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ผ่าน  ✓</text>
<text x="655.0" y="107.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ได้ env ที่ชนิดถูกต้อง</text>
<text x="655.0" y="129.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">PORT เป็นตัวเลข ใช้ทั้งโปรแกรม</text>
<rect x="540" y="172" width="230" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="655.0" y="201.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ขาด / ผิด  ✗</text>
<text x="655.0" y="223.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ขึ้น ZodError ... DATABASE_URL</text>
<text x="655.0" y="245.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แล้วหยุดทันที</text>
<rect x="30" y="290" width="740" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="400.0" y="312.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">หยุดตั้งแต่ตอนเปิด ดีกว่าเปิดได้แล้วไปพังทีหลังแบบงงๆ</text>
<text x="400.0" y="334.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ถ้าเจอ ZodError: ตรวจว่ามีไฟล์ .env และสั่ง bun run dev ในโฟลเดอร์ server/</text>
</svg>
