<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 724" role="img" aria-label="งานจริงเป็นวงรอบ 7 ขั้น" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="14">
<title>งานจริงเป็นวงรอบ 7 ขั้น</title><desc>Problem เข้าใจปัญหา, Design ออกแบบ, Coding เขียนโค้ด (DB, Backend, API, Frontend), Testing ทดสอบ, Documentation เขียนเอกสาร, Deploy ขึ้นระบบจริง, Maintenance ดูแลระบบ แล้ววนกลับไปที่ Problem เพราะ bug และ feedback คือปัญหาใหม่ (ฉบับแนวตั้งสำหรับจอมือถือ)</desc>
<defs><marker id="lm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="358" height="722" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="180" y="32" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">งานจริงเป็นวงรอบ 7 ขั้น</text>
<text x="180" y="54" font-size="14" text-anchor="middle" fill="#475569">ไม่ใช่เส้นตรงที่จบตอน deploy</text>
<g fill="none" stroke="#64748b" stroke-width="1.5"><path d="M194 140 V160" marker-end="url(#lm)"/><path d="M194 224 V244" marker-end="url(#lm)"/><path d="M194 308 V328" marker-end="url(#lm)"/><path d="M194 392 V412" marker-end="url(#lm)"/><path d="M194 476 V496" marker-end="url(#lm)"/><path d="M194 560 V580" marker-end="url(#lm)"/><path d="M194 644 V660 H18 V109 H42" stroke-dasharray="5 4" marker-end="url(#lm)"/></g>
<rect x="44" y="78" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="103" font-size="16" font-weight="bold" fill="#0f172a">1 · Problem <tspan font-weight="normal" font-size="14" fill="#475569">เข้าใจปัญหา</tspan></text>
<text x="60" y="126" fill="#0f172a">user story · ขอบเขตงาน</text>
<rect x="44" y="162" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="187" font-size="16" font-weight="bold" fill="#0f172a">2 · Design <tspan font-weight="normal" font-size="14" fill="#475569">ออกแบบ</tspan></text>
<text x="60" y="210" fill="#0f172a">ภาพร่างหน้าจอ · ตาราง · รายการ API</text>
<rect x="44" y="246" width="300" height="62" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="60" y="271" font-size="16" font-weight="bold" fill="#00767f">3 · Coding <tspan font-weight="normal" font-size="14" fill="#475569">เขียนโค้ด</tspan></text>
<text x="60" y="294" fill="#0f172a">DB → Backend → API → Frontend</text>
<rect x="44" y="330" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="355" font-size="16" font-weight="bold" fill="#0f172a">4 · Testing <tspan font-weight="normal" font-size="14" fill="#475569">ทดสอบ</tspan></text>
<text x="60" y="378" fill="#0f172a">เทสต์ที่รันซ้ำได้ + เช็กลิสต์</text>
<rect x="44" y="414" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="439" font-size="16" font-weight="bold" fill="#0f172a">5 · Documentation <tspan font-weight="normal" font-size="14" fill="#475569">เขียนเอกสาร</tspan></text>
<text x="60" y="462" fill="#0f172a">README · API doc</text>
<rect x="44" y="498" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="523" font-size="16" font-weight="bold" fill="#0f172a">6 · Deploy <tspan font-weight="normal" font-size="14" fill="#475569">ขึ้นระบบจริง</tspan></text>
<text x="60" y="546" fill="#0f172a">เว็บบน URL จริง</text>
<rect x="44" y="582" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="607" font-size="16" font-weight="bold" fill="#0f172a">7 · Maintenance <tspan font-weight="normal" font-size="14" fill="#475569">ดูแลระบบ</tspan></text>
<text x="60" y="630" fill="#0f172a">log · backup</text>
<text x="180" y="686" font-size="14" text-anchor="middle" fill="#475569">วนกลับ: bug และ feedback จากผู้ใช้</text>
<text x="180" y="706" font-size="14" text-anchor="middle" fill="#475569">คือปัญหาใหม่</text>
</svg>
