<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" role="img" aria-label="เกณฑ์ประเมิน 100 คะแนน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>เกณฑ์ประเมิน 100 คะแนน</title><desc>คะแนนหกหัวข้อรวม 100 ผ่านเมื่อได้ 70 ขึ้นไปและไม่พลาดสามข้อที่ตกทันที</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="423" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">เกณฑ์ประเมิน 100 คะแนน</text>
<text x="250" y="76" font-size="16" text-anchor="end" fill="#0f172a">ฐานข้อมูล</text><rect x="262" y="56" width="180" height="28" rx="5" fill="#1a4fb0"/><text x="452" y="77" font-size="17" text-anchor="start" fill="#0b3c91" font-weight="bold">15</text><text x="250" y="112" font-size="16" text-anchor="end" fill="#0f172a">API</text><rect x="262" y="92" width="300" height="28" rx="5" fill="#1a4fb0"/><text x="572" y="113" font-size="17" text-anchor="start" fill="#0b3c91" font-weight="bold">25</text><text x="250" y="148" font-size="16" text-anchor="end" fill="#0f172a">หน้าเว็บลูกค้า</text><rect x="262" y="128" width="240" height="28" rx="5" fill="#1a4fb0"/><text x="512" y="149" font-size="17" text-anchor="start" fill="#0b3c91" font-weight="bold">20</text><text x="250" y="184" font-size="16" text-anchor="end" fill="#0f172a">หน้าหลังบ้าน</text><rect x="262" y="164" width="240" height="28" rx="5" fill="#1a4fb0"/><text x="512" y="185" font-size="17" text-anchor="start" fill="#0b3c91" font-weight="bold">20</text><text x="250" y="220" font-size="16" text-anchor="end" fill="#0f172a">Google + ความปลอดภัย</text><rect x="262" y="200" width="120" height="28" rx="5" fill="#1a4fb0"/><text x="392" y="221" font-size="17" text-anchor="start" fill="#0b3c91" font-weight="bold">10</text><text x="250" y="256" font-size="16" text-anchor="end" fill="#0f172a">โค้ด + README + นำเสนอ</text><rect x="262" y="236" width="120" height="28" rx="5" fill="#1a4fb0"/><text x="392" y="257" font-size="17" text-anchor="start" fill="#0b3c91" font-weight="bold">10</text><text x="780" y="76" font-size="16" text-anchor="end" fill="#475569" font-weight="bold">รวม 100 คะแนน</text><rect x="20" y="285" width="250" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="145" y="315" font-size="18" text-anchor="middle" fill="#15803d" font-weight="bold">ผ่าน</text><text x="145" y="343" font-size="16" text-anchor="middle" fill="#0f172a">ได้ 70 คะแนนขึ้นไป</text><text x="145" y="370" font-size="16" text-anchor="middle" fill="#0f172a">และไม่พลาด 3 ข้อทางขวา</text><rect x="290" y="285" width="490" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="535" y="311" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold">มีข้อเดียว = ไม่ผ่านทันที</text><text x="310" y="341" font-size="16" text-anchor="start" fill="#0f172a">• รหัสผ่านไม่ได้ hash ด้วย bcrypt/argon2</text><text x="310" y="367" font-size="16" text-anchor="start" fill="#0f172a">• เรียก API หลังบ้านได้โดยไม่ต้อง login</text><text x="310" y="393" font-size="16" text-anchor="start" fill="#0f172a">• ทำตาม README แล้วเปิดเว็บไม่ขึ้น</text>
</svg>
