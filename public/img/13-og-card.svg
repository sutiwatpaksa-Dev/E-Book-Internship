<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="แท็กในหน้าเว็บกลายเป็นผลค้นหาและการ์ดแชร์" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>แท็กในหน้าเว็บกลายเป็นผลค้นหาและการ์ดแชร์</title><desc>title และ meta description ใช้ในผลค้นหา Google ส่วน og tags ใช้ทำการ์ดตอนแชร์ใน LINE หรือ Facebook</desc>
