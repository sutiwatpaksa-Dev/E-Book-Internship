<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="async / await: รอผลโดยหน้าเว็บไม่ค้าง" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>async / await: รอผลโดยหน้าเว็บไม่ค้าง</title><desc>โค้ดหลังคำสั่ง await รอจนกว่า Promise เสร็จ ส่วนโค้ดอื่นของเว็บทำงานต่อได้</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="358" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">async / await: รอผลโดยหน้าเว็บไม่ค้าง</text>
<text x="60" y="70" font-size="15" text-anchor="start" fill="#64748b" font-weight="normal">เวลา →</text>
<line x1="60" y1="86" x2="760" y2="86" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="60" y="110" width="160" height="56" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="140.0" y="132.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">try {</text>
<text x="140.0" y="154.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">setLoading(true)</text>
<rect x="250" y="110" width="200" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="350.0" y="132.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">await fetch(url)</text>
<text x="350.0" y="154.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รอเซิร์ฟเวอร์ตอบ ⏳</text>
<rect x="480" y="110" width="130" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="545.0" y="132.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ได้ข้อมูล</text>
<text x="545.0" y="154.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">setData(...)</text>
<rect x="480" y="190" width="130" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="545.0" y="212.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">พัง (throw)</text>
<text x="545.0" y="234.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เน็ตหลุด / 404</text>
<rect x="640" y="150" width="130" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="705.0" y="172.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">finally</text>
<text x="705.0" y="194.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">setLoading(false)</text>
<line x1="222" y1="138" x2="248" y2="138" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="452" y1="138" x2="478" y2="138" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="452" y1="150" x2="478" y2="215" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="612" y1="138" x2="638" y2="170" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="612" y1="218" x2="638" y2="190" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="540" y="266" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">catch (err) { setError(...) }</text>
<text x="400" y="306" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ระหว่างรอ React ยังวาดหน้าอื่น รับการคลิกได้ตามปกติ (ไม่ค้าง)</text>
<text x="400" y="334" font-size="15" text-anchor="middle" fill="#0b3c91" font-weight="bold">finally ทำงานเสมอ ไม่ว่าสำเร็จหรือพัง จึงเหมาะกับปิดไฟ loading</text>
</svg>
