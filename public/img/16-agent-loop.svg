<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="วงจรทำงานกับ agent อย่างปลอดภัย" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>วงจรทำงานกับ agent อย่างปลอดภัย</title><desc>commit ก่อน แล้วให้ agent วางแผน อ่านแล้วอนุมัติ รันเทสต์ อ่าน diff และ commit ถ้าพังให้ git restore</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="798" height="328" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">ทำงานกับ agent: commit ก่อน → แผน → อนุมัติ → ตรวจ → commit</text>
<rect x="16" y="60" width="138" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="85.0" y="84" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">1 commit ก่อน</text>
<text x="85.0" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">จุดย้อนกลับ</text>
<line x1="156" y1="110" x2="172" y2="110" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="172" y="60" width="138" height="100" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="241.0" y="84" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">2 ขอแผน</text>
<text x="241.0" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ยังไม่แก้ไฟล์</text>
<line x1="312" y1="110" x2="328" y2="110" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="328" y="60" width="138" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="397.0" y="84" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">3 อนุมัติ</text>
<text x="397.0" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">อ่านก่อนกด</text>
<line x1="468" y1="110" x2="484" y2="110" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="484" y="60" width="138" height="100" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="553.0" y="84" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">4 รันเทสต์</text>
<text x="553.0" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ดูผลจริง</text>
<line x1="624" y1="110" x2="640" y2="110" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="640" y="60" width="138" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="709.0" y="84" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">5 อ่าน diff</text>
<text x="709.0" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">อธิบายได้ → commit</text>
<rect x="20" y="206" width="760" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400" y="236" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">พัง/แก้เกิน/วนไม่จบ: git restore . (ไฟล์ที่ยังไม่ commit) หรือ git switch กลับ branch เดิม</text>
<text x="400" y="288" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Git คือปุ่ม undo ของเรา ใช้ได้กับทุกเครื่องมือ (ฟีเจอร์ undo ในเครื่องมือเสริมได้ แต่ไม่ครอบทุกกรณี)</text>
<line x1="710" y1="162" x2="710" y2="204" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
</svg>
