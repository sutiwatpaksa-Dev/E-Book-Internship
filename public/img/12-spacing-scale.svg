<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="ระยะห่าง: 1 หน่วย = 4px" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ระยะห่าง: 1 หน่วย = 4px</title><desc>padding คือช่องว่างด้านใน margin คือด้านนอก gap คือระหว่างชิ้น หน่วยละ 4 พิกเซล</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="398" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">ระยะห่าง: 1 หน่วย = 4px</text>
<rect x="40" y="55" width="330" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-dasharray="6 5" stroke-width="2"/>
<text x="205" y="78" font-size="14" text-anchor="middle" fill="#92400e" font-weight="bold">mt-8 = เว้นด้านนอก 32px (margin)</text>
<rect x="75" y="95" width="260" height="145" rx="8" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<rect x="95" y="125" width="220" height="100" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="205" y="112" font-size="14" text-anchor="middle" fill="#1a4fb0" font-weight="bold">p-4 = เว้นด้านใน 16px (padding)</text>
<text x="205" y="168" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">เนื้อหา</text>
<text x="205" y="194" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ลาเต้ 65 บาท</text>
<text x="205" y="284" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">ช่องว่าง 3 ชนิดของกล่องหนึ่งใบ</text>
<rect x="430" y="70" width="150" height="70" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="505.0" y="110.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">การ์ด 1</text>
<rect x="620" y="70" width="150" height="70" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="695.0" y="110.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">การ์ด 2</text>
<line x1="582" y1="105" x2="618" y2="105" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
<line x1="618" y1="105" x2="582" y2="105" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
<text x="600" y="64" font-size="15" text-anchor="middle" fill="#d97706" font-weight="bold">gap-4</text>
<text x="600" y="158" font-size="14" text-anchor="middle" fill="#d97706" font-weight="normal">16px</text>
<text x="600" y="200" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">gap-4 = ช่องว่าง "ระหว่าง" ชิ้น</text>
<text x="430" y="242" font-size="14" text-anchor="start" fill="#64748b" font-weight="bold">ตัวเลข</text>
<rect x="430" y="252" width="20.0" height="10" rx="3" fill="#1a4fb0"/>
<text x="430" y="284" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">p-1</text>
<text x="430" y="304" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal">4px</text>
<rect x="498" y="252" width="26.0" height="10" rx="3" fill="#1a4fb0"/>
<text x="498" y="284" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">p-2</text>
<text x="498" y="304" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal">8px</text>
<rect x="566" y="252" width="38.0" height="10" rx="3" fill="#1a4fb0"/>
<text x="566" y="284" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">p-4</text>
<text x="566" y="304" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal">16px</text>
<rect x="634" y="252" width="50.0" height="10" rx="3" fill="#1a4fb0"/>
<text x="634" y="284" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">p-6</text>
<text x="634" y="304" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal">24px</text>
<rect x="702" y="252" width="62.0" height="10" rx="3" fill="#1a4fb0"/>
<text x="702" y="284" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">p-8</text>
<text x="702" y="304" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal">32px</text>
<text x="400" y="372" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">ตัวเลขใหญ่ขึ้น = ห่างขึ้น (p-8 = 32px)  ใช้ได้กับ p, m, gap ทั้งหมด</text>
</svg>
