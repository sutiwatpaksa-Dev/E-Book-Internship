<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="แผนที่เครื่องมือ AI สำหรับ dev 3 แบบ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>แผนที่เครื่องมือ AI สำหรับ dev 3 แบบ</title><desc>เครื่องมือ AI แบ่งเป็น 3 แบบ: แชทในเบราว์เซอร์/แอป, AI ในโปรแกรมเขียนโค้ด, และ agent ที่ทำงานในโปรเจกต์</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="798" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">เครื่องมือ AI 3 แบบ: ยิ่งไปทางขวา ยิ่งทำเองได้มาก ยิ่งต้องคุมเป็น</text>
<rect x="20" y="52" width="226" height="300" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="133" y="80" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">1 แชท (เว็บ/แอป)</text>
<text x="133" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Gemini · ChatGPT</text>
<text x="133" y="128" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Claude (เว็บ)</text>
<line x1="34" y1="156" x2="232" y2="156" stroke="#0e8a94" stroke-width="1.5"/>
<text x="133" y="184" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เห็น: เฉพาะที่เรา</text>
<text x="133" y="210" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">พิมพ์/วาง/แนบ</text>
<text x="133" y="236" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แก้ไฟล์เราเอง: ไม่ได้</text>
<text x="133" y="262" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รันคำสั่งในเครื่อง: ไม่ได้</text>
<text x="133" y="288" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เราก๊อปไปใช้เอง</text>
<rect x="287" y="52" width="226" height="300" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400" y="80" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">2 AI ในโปรแกรมเขียนโค้ด</text>
<text x="400" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แผงแชท/ช่วยเติมโค้ด</text>
<text x="400" y="128" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ใน IDE หรือ editor</text>
<line x1="301" y1="156" x2="499" y2="156" stroke="#d97706" stroke-width="1.5"/>
<text x="400" y="184" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เห็น: ไฟล์ที่เปิด/</text>
<text x="400" y="210" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เลือกไว้ (ตามเครื่องมือ)</text>
<text x="400" y="236" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เสนอโค้ดให้เรากดรับ</text>
<text x="400" y="262" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ความสามารถต่างกัน</text>
<text x="400" y="288" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตามแต่ละเครื่องมือ</text>
<rect x="554" y="52" width="226" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="667" y="80" font-size="16" text-anchor="middle" fill="#00767f" font-weight="bold">3 Agent ในโปรเจกต์</text>
<text x="667" y="106" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Claude Code · Codex</text>
<text x="667" y="128" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Antigravity (agent)</text>
<line x1="568" y1="156" x2="766" y2="156" stroke="#16a34a" stroke-width="1.5"/>
<text x="667" y="184" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เห็น: โฟลเดอร์โปรเจกต์</text>
<text x="667" y="210" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แก้ไฟล์หลายไฟล์ได้</text>
<text x="667" y="236" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รันคำสั่ง/เทสต์ได้</text>
<text x="667" y="262" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ขออนุมัติตามโหมด</text>
<text x="667" y="288" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ที่ตั้งไว้</text>
<rect x="20" y="372" width="760" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="400" y="403" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ไม่ว่าแบบไหน: เราคือเจ้าของงาน ต้องอ่านและอธิบายได้ทุกบรรทัดก่อนส่ง</text>
<line x1="248" y1="200" x2="285" y2="200" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="515" y1="200" x2="552" y2="200" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
</svg>
