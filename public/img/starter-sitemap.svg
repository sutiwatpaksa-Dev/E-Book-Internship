<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-label="แผนผังเว็บ Bit Café ของงาน STARTER" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>แผนผังเว็บ Bit Café ของงาน STARTER</title><desc>หน้าลูกค้า 3 หน้า (หน้าแรก เกี่ยวกับ ติดต่อ) และหน้าจัดการร้านใต้ /admin ที่ต้อง login</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="463" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">แผนผังเว็บ Bit Café ของงาน STARTER</text>
<rect x="20" y="50" width="340" height="330" rx="8" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/><text x="190" y="78" font-size="17" text-anchor="middle" fill="#0b3c91" font-weight="bold">หน้าที่ลูกค้าเห็น (ใครก็เข้าได้)</text><rect x="40" y="95" width="300" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="111.2" font-size="15" text-anchor="middle" fill="#0f172a">แถบเมนูบน · ส่วนท้ายหน้า · ปุ่ม LINE ลอย</text><text x="190.0" y="133.2" font-size="15" text-anchor="middle" fill="#0f172a">มีทุกหน้า</text><rect x="40" y="158" width="300" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="52" y="181" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/</text><text x="150" y="181" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold">หน้าแรก</text><text x="52" y="202" font-size="15" text-anchor="start" fill="#475569">ภาพใหญ่ สินค้าเด่น 3 อย่าง จุดเด่นร้าน</text><rect x="40" y="222" width="300" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="52" y="245" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/about</text><text x="150" y="245" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold">เกี่ยวกับร้าน/บริการ</text><text x="52" y="266" font-size="15" text-anchor="start" fill="#475569">เรื่องราวร้าน การ์ดสินค้า เลือกหมวด</text><rect x="40" y="286" width="300" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="52" y="309" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/contact</text><text x="150" y="309" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold">ติดต่อ</text><text x="52" y="330" font-size="15" text-anchor="start" fill="#475569">ฟอร์ม ที่อยู่ เบอร์โทร แผนที่</text><text x="190" y="366" font-size="15" text-anchor="middle" fill="#b45309" font-weight="bold">พิมพ์ที่อยู่ที่ไม่มี → หน้า 404</text><rect x="380" y="50" width="400" height="330" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="580" y="78" font-size="17" text-anchor="middle" fill="#b45309" font-weight="bold">หน้าจัดการร้าน /admin (เจ้าของร้านเท่านั้น)</text><rect x="400" y="95" width="360" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="580.0" y="109.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">/admin/login</text><text x="580.0" y="131.2" font-size="15" text-anchor="middle" fill="#0f172a">กรอกอีเมล + รหัสผ่าน</text><rect x="400" y="148" width="360" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="412" y="172" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/admin</text><text x="752" y="172" font-size="15" text-anchor="end" fill="#475569">หน้าสรุป</text><rect x="400" y="191" width="360" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="412" y="215" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/admin/settings</text><text x="752" y="215" font-size="15" text-anchor="end" fill="#475569">ข้อมูลร้าน</text><rect x="400" y="234" width="360" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="412" y="258" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/admin/pages</text><text x="752" y="258" font-size="15" text-anchor="end" fill="#475569">ข้อความในแต่ละหน้า</text><rect x="400" y="277" width="360" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="412" y="301" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/admin/services</text><text x="752" y="301" font-size="15" text-anchor="end" fill="#475569">สินค้า/บริการ + หมวด</text><rect x="400" y="320" width="360" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="412" y="344" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">/admin/messages</text><text x="752" y="344" font-size="15" text-anchor="end" fill="#475569">ข้อความจากลูกค้า</text><rect x="20" y="395" width="760" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="400" y="417" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold">ยังไม่ login แล้วเข้าหน้าไหนใน /admin ก็ตาม (ยกเว้นหน้า login)</text><text x="400" y="438" font-size="16" text-anchor="middle" fill="#b91c1c">→ ถูกพากลับมาที่ /admin/login</text>
