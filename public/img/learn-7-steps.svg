<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="งานจริงเป็นวงรอบ 7 ขั้น" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="14">
<title>งานจริงเป็นวงรอบ 7 ขั้น</title><desc>Problem เข้าใจปัญหา, Design ออกแบบ, Coding เขียนโค้ด (DB, Backend, API, Frontend), Testing ทดสอบ, Documentation เขียนเอกสาร, Deploy ขึ้นระบบจริง, Maintenance ดูแลระบบ แล้ววนกลับไปที่ Problem เพราะ bug และ feedback คือปัญหาใหม่</desc>
