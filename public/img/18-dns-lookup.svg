<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" role="img" aria-label="DNS ถามต่อกันเป็นทอดๆ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>DNS ถามต่อกันเป็นทอดๆ</title><desc>เบราว์เซอร์ถาม resolver ถ้าไม่มี cache จะถาม root แล้ว TLD แล้ว authoritative และจำคำตอบไว้ตาม TTL</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">DNS ถามต่อกันเป็นทอดๆ</text>
<rect x="20" y="60" width="170" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="105.0" y="82.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เครื่องเรา</text>
<text x="105.0" y="103.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">cache ในเครื่อง</text>
<rect x="250" y="60" width="190" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="345.0" y="82.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Resolver</text>
<text x="345.0" y="103.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">1.1.1.1 / 8.8.8.8</text>
<line x1="190" y1="88" x2="248" y2="88" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="219" y="80" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">①</text>
<rect x="500" y="60" width="280" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="640.0" y="82.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Cache ของ resolver</text>
<text x="640.0" y="103.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(เจอ = ตอบเลย จบ)</text>
<line x1="440" y1="88" x2="498" y2="88" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<text x="365" y="160" font-size="15" text-anchor="start" fill="#00767f" font-weight="bold">ไม่เจอใน cache: resolver เดินถามเอง 3 ชั้น (ผลจริงของ dig +trace)</text>
<rect x="250" y="172" width="190" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="345.0" y="194.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Root server</text>
<text x="345.0" y="215.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">j.root-servers.net</text>
<text x="455" y="206" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">"ไม่รู้ ไปถามเซิร์ฟเวอร์ของ .org"</text>
<line x1="345" y1="118" x2="345" y2="172" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="228" y="206" font-size="15" text-anchor="end" fill="#0f172a" font-weight="bold">②</text>
<rect x="250" y="242" width="190" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="345.0" y="264.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">TLD server (.org)</text>
<text x="345.0" y="285.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">c0.org.afilias-nst.info</text>
<text x="455" y="276" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">"ไม่รู้ ไปถาม ns2.wikimedia.org"</text>
<line x1="345" y1="228" x2="345" y2="242" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="228" y="276" font-size="15" text-anchor="end" fill="#0f172a" font-weight="bold">③</text>
<rect x="250" y="312" width="190" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="345.0" y="334.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Authoritative</text>
<text x="345.0" y="355.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ns2.wikimedia.org</text>
<text x="455" y="346" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">"รู้! CNAME → dyna.wikimedia.org"</text>
<line x1="345" y1="298" x2="345" y2="312" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="228" y="346" font-size="15" text-anchor="end" fill="#0f172a" font-weight="bold">④</text>
<text x="400" y="426" font-size="15" text-anchor="middle" fill="#16a34a" font-weight="bold">⑤ resolver ส่งคำตอบกลับ + จำไว้ตาม TTL · ครั้งต่อไปจึงตอบเร็ว</text>
</svg>
