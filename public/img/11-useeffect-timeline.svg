<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="useEffect ทำงานหลังวาดหน้าจอเสร็จ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>useEffect ทำงานหลังวาดหน้าจอเสร็จ</title><desc>ลำดับ: render คำนวณหน้าตา, เบราว์เซอร์วาดลงจอ, effect ทำงาน, ก่อนรอบถัดไปหรือตอนหายไป cleanup ทำงาน</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="338" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">useEffect ทำงานหลังวาดหน้าจอเสร็จ</text>
<rect x="30" y="60" width="155" height="120" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="107.5" y="92.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">1 render</text>
<text x="107.5" y="114.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">React เรียกฟังก์ชัน</text>
<text x="107.5" y="136.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">คำนวณหน้าตา</text>
<text x="107.5" y="158.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(ห้ามมีผลข้างเคียง)</text>
<rect x="225" y="60" width="155" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="302.5" y="92.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">2 วาดลงจอ</text>
<text x="302.5" y="114.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เบราว์เซอร์แสดงผล</text>
<text x="302.5" y="136.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ผู้ใช้เห็นหน้าจอ</text>
<text x="302.5" y="158.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แล้ว</text>
<rect x="420" y="60" width="155" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="497.5" y="92.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">3 effect ทำงาน</text>
<text x="497.5" y="114.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">โค้ดใน useEffect</text>
<text x="497.5" y="136.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ดึงข้อมูล ตั้ง timer</text>
<text x="497.5" y="158.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตั้ง title</text>
<rect x="615" y="60" width="155" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="692.5" y="92.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">4 cleanup</text>
<text x="692.5" y="114.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รันก่อน effect รอบใหม่</text>
<text x="692.5" y="136.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">หรือตอนชิ้นส่วน</text>
<text x="692.5" y="158.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">หายไปจากจอ</text>
<line x1="187" y1="120" x2="222" y2="120" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="382" y1="120" x2="417" y2="120" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="577" y1="120" x2="612" y2="120" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<path d="M692,184 L692,235 L107,235 L107,184" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#as)"/>
<text x="400" y="225" font-size="15" text-anchor="middle" fill="#64748b" font-weight="normal">state หรือ props เปลี่ยน → วนกลับไปรอบใหม่</text>
<rect x="40" y="262" width="720" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="400.0" y="295.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ทำนอง: render = เตรียมของ · วาดลงจอ = เปิดร้าน · effect = ทำงานหลังร้านเปิด · cleanup = เก็บของก่อนปิด</text>
</svg>
