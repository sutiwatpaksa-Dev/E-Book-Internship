<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="จาก schema.ts ถึงตารางที่มีข้อมูล" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>จาก schema.ts ถึงตารางที่มีข้อมูล</title><desc>db:generate สร้างไฟล์ SQL จาก schema แล้ว db:migrate สร้างตารางจริง แล้ว seed ใส่ข้อมูลตั้งต้น</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker></defs>
<rect x="1" y="1" width="798" height="448" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">จากแบบแปลนถึงตารางที่มีข้อมูล: 3 คำสั่งตามลำดับ</text>
<rect x="30" y="54" width="340" height="52" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="200.0" y="74.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">schema.ts</text>
<text x="200.0" y="96.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แบบแปลนตาราง (TypeScript)</text>
<line x1="200" y1="106" x2="200" y2="146" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="216" y="131" font-size="15" text-anchor="start" fill="#00767f" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">bun run db:generate</text>
<text x="440" y="131" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">อ่าน schema แล้วสร้างไฟล์ SQL</text>
<rect x="30" y="146" width="340" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="200.0" y="166.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">drizzle/*.sql</text>
<text x="200.0" y="188.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไฟล์อัปเดตตาราง</text>
<line x1="200" y1="198" x2="200" y2="238" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="216" y="223" font-size="15" text-anchor="start" fill="#00767f" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">bun run db:migrate</text>
<text x="440" y="223" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">สั่ง PostgreSQL สร้าง/แก้ตารางจริง</text>
<rect x="30" y="238" width="340" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="200.0" y="258.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ตารางใน PostgreSQL</text>
<text x="200.0" y="280.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">สร้างแล้ว แต่ยังว่าง</text>
<line x1="200" y1="290" x2="200" y2="330" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="216" y="315" font-size="15" text-anchor="start" fill="#00767f" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">bun run seed</text>
<text x="440" y="315" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">ใส่ข้อมูลตั้งต้น รันซ้ำได้ ไม่ซ้ำ</text>
<rect x="30" y="330" width="340" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="200.0" y="350.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ตารางที่มีข้อมูลตั้งต้น</text>
<text x="200.0" y="372.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ลาเต้ มอคค่า ฯลฯ</text>
<rect x="30" y="400" width="740" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="400.0" y="423.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แก้ schema.ts ทุกครั้ง ต้อง db:generate → db:migrate ใหม่ ตารางถึงเปลี่ยน</text>
</svg>
