rker id="sgy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker></defs><rect x="2" y="2" width="796" height="326" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="20" y="70" width="94" height="90" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="67.0" y="109.4" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">1 Issue</text><text x="67.0" y="131.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">รับงาน</text><line x1="115" y1="115" x2="130" y2="115" stroke="#0b3c91" stroke-width="2" marker-end="url(#anavy)"/><rect x="131" y="70" width="94" height="90" rx="10" fill="#e0ebff" stroke="#1a4fb0" stroke-width="2"/><text x="178.0" y="109.4" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">2 Branch</text><text x="178.0" y="131.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">แตกจาก main</text><line x1="226" y1="115" x2="241" y2="115" stroke="#0b3c91" stroke-width="2" marker-end="url(#anavy)"/><rect x="242" y="70" width="94" height="90" rx="10" fill="#e0ebff" stroke="#1a4fb0" stroke-width="2"/><text x="289.0" y="109.4" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">3 Commit</text><text x="289.0" y="131.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ทีละเรื่อง</text><line x1="337" y1="115" x2="352" y2="115" stroke="#0b3c91" stroke-width="2" marker-end="url(#anavy)"/><rect x="353" y="70" width="94" height="90" rx="10" fill="#dbe7fb" stroke="#0b3c91" stroke-width="2"/><text x="400.0" y="109.4" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">4 Push</text><text x="400.0" y="131.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ขึ้น remote</text><line x1="448" y1="115" x2="463" y2="115" stroke="#0b3c91" stroke-width="2" marker-end="url(#anavy)"/><rect x="464" y="70" width="94" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="511.0" y="109.4" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">5 PR / MR</text><text x="511.0" y="131.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เปิดขอรวม</text><line x1="559" y1="115" x2="574" y2="115" stroke="#0b3c91" stroke-width="2" marker-end="url(#anavy)"/><rect x="575" y="70" width="94" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="622.0" y="109.4" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">6 Review</text><text x="622.0" y="131.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">แก้ตามที่ขอ</text><line x1="670" y1="115" x2="685" y2="115" stroke="#0b3c91" stroke-width="2" marker-end="url(#anavy)"/><rect x="686" y="70" width="94" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="733.0" y="109.4" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">7 Merge</text><text x="733.0" y="131.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เข้า main</text><path d="M610,162 C610,200 500,200 500,162" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ard)"/><text x="555" y="218" font-size="15" text-anchor="middle" font-weight="400" fill="#dc2626" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ถ้ามี comment: commit เพิ่มใน branch เดิม</text><rect x="30" y="245" width="740" height="60" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="400.0" y="269.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">PR ที่ดีมี: อธิบาย ทำอะไร / ทำไม / ทดสอบยังไง · เล็ก อ่านง่าย</text><text x="400.0" y="291.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">หลัง merge ลบ branch ทิ้ง แล้ว git switch main &amp;&amp; git pull</text></svg>