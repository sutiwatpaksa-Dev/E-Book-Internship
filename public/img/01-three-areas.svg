<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img"><title>3 พื้นที่ของ Git</title><defs><marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="snavy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#00767f"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="sblue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#0e8a94"/></marker><marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="sor" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#f59e0b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="sgr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="srd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="sgy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker></defs><rect x="2" y="2" width="796" height="326" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="20" y="50" width="180" height="100" rx="10" fill="#dff3f5" stroke="#0e8a94" stroke-width="2"/><text x="110.0" y="93.6" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Working Directory</text><text x="110.0" y="118.3" font-size="17" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ไฟล์ที่เรากำลังแก้</text><rect x="310" y="50" width="180" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="400.0" y="93.6" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Staging Area</text><text x="400.0" y="118.3" font-size="17" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ของที่เลือกจะเซฟ</text><rect x="600" y="50" width="180" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="690.0" y="93.6" font-size="17" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Repository</text><text x="690.0" y="118.3" font-size="17" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ประวัติ (commit)</text><line x1="200" y1="85" x2="310" y2="85" stroke="#00767f" stroke-width="2.5" marker-end="url(#anavy)"/><text x="255" y="72" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">git add</text><line x1="490" y1="85" x2="600" y2="85" stroke="#00767f" stroke-width="2.5" marker-end="url(#anavy)"/><text x="545" y="72" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">git commit</text><path d="M310,128 L200,128" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ard)"/><text x="255" y="150" font-size="15" text-anchor="middle" font-weight="400" fill="#dc2626" font-family="ui-monospace, Menlo, Consolas, monospace">restore --staged</text><path d="M690,155 L690,205 L110,205 L110,152" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#agy)"/><text x="400" y="198" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">git restore  /  git switch  (ดึงจากประวัติกลับมา)</text><text x="110" y="34" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ทุกคนในห้อง</text><text x="400" y="34" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ยืนหน้ากล้อง</text><text x="690" y="34" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">รูปที่ถ่ายเสร็จ</text><rect x="20" y="235" width="760" height="70" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="400.0" y="264.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">git status = ดูว่าไฟล์ไหนอยู่พื้นที่ไหน</text><text x="400.0" y="286.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">git diff = ดูบรรทัดที่ต่าง   ·   git diff --staged = ดูของที่ staged แล้ว</text></svg>