<rect x="300" y="60" width="130" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="365" y="126" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">DB</text>
<line x1="150" y1="74" x2="300" y2="74" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
<line x1="150" y1="100" x2="300" y2="100" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
<line x1="150" y1="126" x2="300" y2="126" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
<line x1="150" y1="152" x2="300" y2="152" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
<line x1="150" y1="172" x2="300" y2="172" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
<text x="225" y="66" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif"></text>
<rect x="20" y="200" width="410" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="225" y="226" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">รวม 101 รอบไป-กลับ</text>
<text x="225" y="252" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">1 ครั้งดึงลูกค้า + 100 ครั้งดึง rentals</text>
<text x="225" y="276" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">คนเพิ่ม = รอบเพิ่ม (ช้าลงเรื่อยๆ)</text>
<rect x="440" y="60" width="130" height="120" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="505" y="126" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">แอป</text>
<rect x="670" y="60" width="110" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="725" y="126" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">DB</text>
<line x1="570" y1="110" x2="670" y2="110" stroke="#16a34a" stroke-width="4" marker-end="url(#arg)"/>
<line x1="670" y1="140" x2="570" y2="140" stroke="#16a34a" stroke-width="4" marker-end="url(#arg)"/>
<text x="620" y="98" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ขอ 1 ที</text>
<text x="620" y="164" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ได้ครบ</text>
<rect x="440" y="200" width="340" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="610" y="232" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">1–2 query ไม่ว่ากี่คน</text>
<text x="610" y="260" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">คนเพิ่ม เวลาแทบไม่เพิ่ม</text>
<line x1="430" y1="60" x2="430" y2="300" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="400" y="330" font-size="16" fill="#0b3c91" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ซื้อของทีละชิ้น ขับกลับบ้านทุกครั้ง   เทียบกับ   จดรายการแล้วซื้อทีเดียว</text>
<text x="400" y="364" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">Drizzle: with: { rentals: true }  ·  Prisma: include: { rentals: true }</text>
<text x="400" y="396" font-size="15" fill="#64748b" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">วิธีจับได้: เปิด log ของ ORM แล้วนับว่า 1 หน้าจอยิง query กี่ครั้ง</text>
