<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 528" role="img" aria-label="ต่อสาย TCP แล้วตรวจบัตร TLS" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ต่อสาย TCP แล้วตรวจบัตร TLS</title><desc>ลำดับข้อความระหว่างเบราว์เซอร์กับ server ตอนจับมือ TCP แล้วทำ TLS ก่อนส่ง HTTP</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="526" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">ต่อสาย TCP แล้วตรวจบัตร TLS</text>
<rect x="60" y="44" width="200" height="40" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="160.0" y="69.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เบราว์เซอร์</text>
<rect x="540" y="44" width="200" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="640.0" y="69.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Server</text>
<line x1="160" y1="86" x2="160" y2="520" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="640" y1="86" x2="640" y2="520" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="20" y="108" font-size="15" text-anchor="start" fill="#d97706" font-weight="bold">TCP</text>
<line x1="162" y1="130" x2="638" y2="130" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="400" y="121" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">SYN  "ขอต่อสายหน่อย"</text>
<line x1="638" y1="172" x2="162" y2="172" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="400" y="163" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">SYN-ACK  "ได้ มาต่อ"</text>
<line x1="162" y1="214" x2="638" y2="214" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="400" y="205" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ACK  "ต่อแล้ว"</text>
<text x="20" y="254" font-size="15" text-anchor="start" fill="#0e8a94" font-weight="bold">TLS</text>
<line x1="162" y1="276" x2="638" y2="276" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="400" y="267" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ClientHello  "ฉันคุยแบบไหนได้บ้าง"</text>
<line x1="638" y1="318" x2="162" y2="318" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="400" y="309" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ใบรับรอง + กุญแจ  "นี่บัตรของฉัน"</text>
<rect x="190" y="334" width="420" height="34" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="400.0" y="356.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เบราว์เซอร์ตรวจบัตร: ชื่อตรง ไม่หมดอายุ ออกโดยผู้ที่เชื่อถือ</text>
<line x1="162" y1="404" x2="638" y2="404" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="400" y="395" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตกลงกุญแจลับ ต่อจากนี้เข้ารหัสทั้งหมด</text>
<text x="20" y="440" font-size="15" text-anchor="start" fill="#16a34a" font-weight="bold">HTTP</text>
<line x1="162" y1="462" x2="638" y2="462" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="400" y="453" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">GET /about</text>
<line x1="638" y1="504" x2="162" y2="504" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="400" y="495" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">200 OK + เนื้อหาหน้าเว็บ</text>
</svg>
