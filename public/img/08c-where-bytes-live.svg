<text x="390" y="124" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">ตรวจ · ย่อรูป · จัดลำดับงาน</text>
<rect x="590" y="56" width="190" height="124" rx="8" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/>
