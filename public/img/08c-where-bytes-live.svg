<text x="685" y="108" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="13" font-weight="600" fill="#0b3c91" text-anchor="middle">laptop_photos 1 แถว</text>
<text x="685" y="130" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">id · laptop_id · key</text>
<text x="685" y="150" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">size · width · height · is_cover</text>
