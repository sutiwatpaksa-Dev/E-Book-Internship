<line x1="482" y1="100" x2="588" y2="100" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#a)"/>
<text x="535" y="92" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="12" font-weight="600" fill="#0b3c91" text-anchor="middle">SELECT</text>
<line x1="298" y1="140" x2="158" y2="190" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#a)"/>
<text x="236" y="186" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="13" font-weight="600" fill="#0b3c91" text-anchor="middle">② JSON + URL</text>
<line x1="482" y1="140" x2="588" y2="262" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#g)"/>
<text x="528" y="214" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="end">ตอนอัปโหลด: API ส่งไฟล์ (PUT)</text>
<line x1="156" y1="236" x2="588" y2="300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="330" y="292" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">③ โหลดรูปตรงจาก storage / CDN ตาม URL</text>
<text x="330" y="312" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">(ไม่ผ่าน API ไม่ผ่านฐานข้อมูล)</text>
<rect x="60" y="356" width="680" height="32" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="400" y="377" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">ฐานข้อมูลตอบเร็วเพราะแถวเล็ก · ไฟล์ใหญ่ไปทางที่ออกแบบมาส่งไฟล์โดยเฉพาะ</text>
</svg>
