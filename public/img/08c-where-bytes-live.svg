<text x="89" y="216" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">หน้าเว็บร้าน</text>
<rect x="300" y="64" width="180" height="96" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
