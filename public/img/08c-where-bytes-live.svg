<text x="685" y="296" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">laptops/2/9f3c…-1600.webp</text>
<text x="685" y="316" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">laptops/2/9f3c…-400.webp</text>
<text x="685" y="336" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">(ไฟล์จริง หลาย KB–MB)</text>
