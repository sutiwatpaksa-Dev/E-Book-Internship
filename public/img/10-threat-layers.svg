<text x="185" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">กันคนกลาง</text>
<text x="185" y="170" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ดักอ่าน</text>
<line x1="104" y1="135" x2="124" y2="135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="262" y="70" width="118" height="130" rx="10" fill="#e6f5f6" stroke="#0e8a94" stroke-width="2"/>
<text x="321" y="100" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">ตรวจ input</text>
<text x="321" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">กันข้อมูล</text>
<text x="321" y="170" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แปลกปลอม</text>
<line x1="240" y1="135" x2="260" y2="135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="398" y="70" width="118" height="130" rx="10" fill="#e6f5f6" stroke="#0e8a94" stroke-width="2"/>
<text x="457" y="100" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">login +</text>
<text x="457" y="120" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">สิทธิ์</text>
<text x="457" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รู้ว่าเป็นใคร</text>
<text x="457" y="170" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ทำอะไรได้</text>
<line x1="376" y1="135" x2="396" y2="135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="534" y="70" width="118" height="130" rx="10" fill="#e6f5f6" stroke="#0e8a94" stroke-width="2"/>
<text x="593" y="100" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">สิทธิ์ DB</text>
<text x="593" y="120" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">น้อยที่สุด</text>
<text x="593" y="148" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">พังได้</text>
<text x="593" y="170" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แค่ส่วนเดียว</text>
<line x1="512" y1="135" x2="532" y2="135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="648" y1="135" x2="668" y2="135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="672" y="70" width="116" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="730.0" y="119.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ข้อมูล</text>
<text x="730.0" y="140.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ที่มีค่า</text>
<text x="730.0" y="161.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">(hash, ลูกค้า)</text>
<text x="400" y="236" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">ก่อนป้องกันอะไร ถามตัวเอง 3 ข้อ</text>
<rect x="24" y="254" width="240" height="104" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<circle cx="46" cy="278" r="13" fill="#f59e0b"/>
<text x="46" y="283.25" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="66" y="284" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold">อะไรมีค่า?</text>
<text x="144" y="330" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลลูกค้า, รหัสผ่าน, เงิน</text>
<rect x="278" y="254" width="240" height="104" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<circle cx="300" cy="278" r="13" fill="#f59e0b"/>
<text x="300" y="283.25" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="320" y="284" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold">ใครอยากได้/ทำพัง?</text>
<text x="398" y="330" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">คนนอก, ผู้ใช้เกเร, เราเองพลาด</text>
<rect x="532" y="254" width="240" height="104" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<circle cx="554" cy="278" r="13" fill="#f59e0b"/>
<text x="554" y="283.25" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="574" y="284" font-size="16" text-anchor="start" fill="#0f172a" font-weight="bold">ถ้าเสียไป เจ็บแค่ไหน?</text>
<text x="652" y="330" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">จัดของที่เจ็บมากไว้ก่อน</text>
