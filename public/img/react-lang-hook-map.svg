<text x="640.0" y="76.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">useState</text>
<rect x="30" y="102" width="440" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250.0" y="128.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ทำงานข้างนอกหลังวาดเสร็จ (ดึง API, ตั้ง timer)</text>
<line x1="472" y1="123" x2="508" y2="123" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="510" y="102" width="260" height="42" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="640.0" y="128.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">useEffect</text>
<rect x="30" y="154" width="440" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250.0" y="180.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">จับ DOM ตรงๆ / จำค่าที่ไม่ทำให้วาดใหม่</text>
