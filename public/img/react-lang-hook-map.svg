<text x="640.0" y="336.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">useSearchParams</text>
<rect x="30" y="362" width="440" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250.0" y="388.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">คำนวณหนักๆ ไม่ให้ซ้ำ (ใช้เมื่อช้าจริงเท่านั้น)</text>
