<rect x="510" y="362" width="260" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="640.0" y="388.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">useMemo / useCallback</text>
<rect x="30" y="414" width="440" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250.0" y="440.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ใช้ค่าร่วมกันทั้งแอป ไม่ต้องส่ง props ต่อกัน</text>
<line x1="472" y1="435" x2="508" y2="435" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="510" y="414" width="260" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="640.0" y="440.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">useContext</text>
