<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="แผน 10 วันของโจทย์ฝึกงาน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>แผน 10 วันของโจทย์ฝึกงาน</title><desc>เตรียมงาน ฐานข้อมูล API หน้าเว็บลูกค้า หลังบ้าน ตรวจรอบ 1 วันที่ 5 ตรวจรอบ 2 วันที่ 9 นำเสนอวันที่ 10</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="478" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">แผน 10 วันของโจทย์ฝึกงาน</text>
<rect x="30" y="48" width="20" height="18" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="58" y="63" font-size="15" text-anchor="start" fill="#0f172a">เตรียมงาน</text><rect x="150" y="48" width="20" height="18" rx="4" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/><text x="178" y="63" font-size="15" text-anchor="start" fill="#0f172a">เบื้องหลัง</text><rect x="270" y="48" width="20" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="298" y="63" font-size="15" text-anchor="start" fill="#0f172a">หน้าเว็บลูกค้า</text><rect x="420" y="48" width="20" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="448" y="63" font-size="15" text-anchor="start" fill="#0f172a">หลังบ้าน</text><rect x="570" y="48" width="20" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="598" y="63" font-size="15" text-anchor="start" fill="#0f172a">เก็บงาน + ส่ง</text><rect x="20" y="80" width="760" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="102" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 1</text><text x="100" y="102" font-size="15" text-anchor="start" fill="#0f172a">เขียน brief, ร่างหน้าเว็บ, สร้างโปรเจกต์</text><rect x="20" y="116" width="760" height="32" rx="6" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/><text x="32" y="138" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 2</text><text x="100" y="138" font-size="15" text-anchor="start" fill="#0f172a">ออกแบบ + สร้างตาราง, ข้อมูลตั้งต้น (seed), ผังตาราง</text><rect x="20" y="152" width="760" height="32" rx="6" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/><text x="32" y="174" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 3</text><text x="100" y="174" font-size="15" text-anchor="start" fill="#0f172a">API ที่ใครก็เรียกได้ + ตรวจข้อมูล + รูปแบบคำตอบ</text><rect x="20" y="188" width="760" height="32" rx="6" fill="#dbeafe" stroke="#1a4fb0" stroke-width="1.5"/><text x="32" y="210" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 4</text><text x="100" y="210" font-size="15" text-anchor="start" fill="#0f172a">ระบบ login + API หลังบ้าน (ไม่ login ได้ 401)</text><rect x="20" y="224" width="760" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="32" y="246" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 5</text><text x="100" y="246" font-size="15" text-anchor="start" fill="#0f172a">โครงหน้าเว็บ, เมนูบน, ส่วนท้าย, หน้าแรก</text><rect x="615" y="227" width="155" height="26" rx="13" fill="#0b3c91" stroke="#0b3c91" stroke-width="1.5"/><text x="692" y="246" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">พี่เลี้ยงตรวจรอบ 1</text><rect x="20" y="260" width="760" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="32" y="282" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 6</text><text x="100" y="282" font-size="15" text-anchor="start" fill="#0f172a">หน้าบ้านที่เหลือ + ฟอร์ม</text><rect x="20" y="296" width="760" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="32" y="318" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 7</text><text x="100" y="318" font-size="15" text-anchor="start" fill="#0f172a">หลังบ้าน: login, สรุป, ข้อมูลหลักของเว็บ</text><rect x="20" y="332" width="760" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="32" y="354" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 8</text><text x="100" y="354" font-size="15" text-anchor="start" fill="#0f172a">หลังบ้าน: จัดการข้อมูลที่เหลือ</text><rect x="20" y="368" width="760" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="32" y="390" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 9</text><text x="100" y="390" font-size="15" text-anchor="start" fill="#0f172a">Google หาเจอ, ทุกจอ, ข้อความโหลด/พัง</text><rect x="615" y="371" width="155" height="26" rx="13" fill="#0b3c91" stroke="#0b3c91" stroke-width="1.5"/><text x="692" y="390" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">พี่เลี้ยงตรวจรอบ 2</text><rect x="20" y="404" width="760" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="32" y="426" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">วัน 10</text><text x="100" y="426" font-size="15" text-anchor="start" fill="#0f172a">แก้ตามพี่เลี้ยง, เขียน README, ซ้อมนำเสนอ</text><rect x="615" y="407" width="155" height="26" rx="13" fill="#0b3c91" stroke="#0b3c91" stroke-width="1.5"/><text x="692" y="426" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">นำเสนอ 15 นาที</text><text x="400" y="462" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold">วันไหนทำไม่ทัน ห้ามเงียบ ต้องบอกพี่เลี้ยงภายในวันนั้น</text>
</svg>
