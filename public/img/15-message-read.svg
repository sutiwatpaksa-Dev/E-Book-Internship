<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" role="img" aria-label="ทำไมเปิดอ่านข้อความต้องใช้ PATCH" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ทำไมเปิดอ่านข้อความต้องใช้ PATCH</title><desc>GET ต้องดูอย่างเดียว ถ้า GET เปลี่ยนสถานะ ตัวโหลดล่วงหน้าอาจทำให้ข้อความกลายเป็นอ่านแล้วโดยไม่มีใครเห็น จึงใช้ PATCH</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="453" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">ทำไมเปิดอ่านข้อความต้องใช้ PATCH</text>
<rect x="20" y="50" width="760" height="150" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="400" y="76" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold">ถ้าให้ GET เปลี่ยนสถานะเอง (ห้ามทำ)</text><rect x="40" y="92" width="200" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="140.0" y="120.2" font-size="15" text-anchor="middle" fill="#0f172a">ตัวโหลดหน้า</text><text x="140.0" y="142.2" font-size="15" text-anchor="middle" fill="#0f172a">ล่วงหน้าของเบราว์เซอร์</text><text x="140.0" y="164.2" font-size="15" text-anchor="middle" fill="#0f172a">หรือระบบอื่น</text><line x1="240" y1="137" x2="300" y2="137" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="300" y="107" width="190" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="395.0" y="131.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">GET</text><text x="395.0" y="153.2" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">/messages/5</text><line x1="490" y1="137" x2="540" y2="137" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="540" y="92" width="220" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="650.0" y="120.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ข้อความ 5</text><text x="650.0" y="142.2" font-size="15" text-anchor="middle" fill="#0f172a">กลายเป็น "อ่านแล้ว"</text><text x="650.0" y="164.2" font-size="15" text-anchor="middle" fill="#0f172a">ทั้งที่เจ้าของร้านยังไม่เห็น</text><rect x="20" y="220" width="760" height="215" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="400" y="246" font-size="17" text-anchor="middle" fill="#15803d" font-weight="bold">ทำแบบนี้: ใช้ PATCH (เปลี่ยนข้อมูลต้องบอกชัดเจน)</text><rect x="40" y="264" width="170" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="125.0" y="293.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เจ้าของร้าน</text><text x="125.0" y="315.2" font-size="15" text-anchor="middle" fill="#0f172a">กดเปิดข้อความ</text><line x1="210" y1="299" x2="260" y2="299" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><rect x="260" y="264" width="260" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="390.0" y="282.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">PATCH</text><text x="390.0" y="304.2" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">/api/admin/messages/:id</text><text x="390.0" y="326.2" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">{ "isRead": true }</text><line x1="520" y1="299" x2="560" y2="299" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><rect x="560" y="264" width="200" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="293.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">server อัปเดต</text><text x="660.0" y="315.2" font-size="15" text-anchor="middle" fill="#0f172a">is_read ใน DB</text><rect x="40" y="356" width="350" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="215" y="380" font-size="15" text-anchor="middle" fill="#15803d" font-weight="bold">พบข้อความ → 200 ส่งข้อความที่แก้แล้วกลับ</text><text x="215" y="404" font-size="15" text-anchor="middle" fill="#0f172a">ต้องผ่านด่านตรวจ requireAdmin ก่อน</text><rect x="410" y="356" width="350" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="585" y="380" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">ไม่พบข้อความ → 404 NOT_FOUND</text><text x="585" y="404" font-size="15" text-anchor="middle" fill="#0f172a">"ไม่พบข้อความนี้"</text>
</svg>
