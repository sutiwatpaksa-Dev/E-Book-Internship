<text x="150" y="150" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">ลิงก์เมนู: hidden (ซ่อน)</text>
<text x="150" y="180" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">ปุ่ม ☰: เห็น</text>
<text x="150" y="210" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">(กดแล้วเมนูไหลลงมา)</text>
<text x="540" y="58" font-size="16" text-anchor="middle" fill="#0b3c91" font-weight="bold">จอใหญ่ (ตั้งแต่ 768px)</text>
<rect x="300" y="70" width="460" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="300" y="70" width="460" height="44" rx="10" fill="#6b3e26"/>
<text x="314" y="98" font-size="15" text-anchor="start" fill="#ffffff" font-weight="bold">☕ Bit Café</text>
<text x="470" y="98" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="normal">หน้าแรก</text>
<text x="565" y="98" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="normal">เกี่ยวกับเรา</text>
<text x="660" y="98" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="normal">ติดต่อ</text>
<text x="530" y="170" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">ลิงก์เมนู: md:flex (เรียงแนวนอน)</text>
<text x="530" y="200" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">ปุ่ม ☰: md:hidden (ซ่อน)</text>
<rect x="40" y="300" width="300" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="190.0" y="324.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">hidden md:flex</text>
<text x="190.0" y="345.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">มือถือ: ซ่อน / ตั้งแต่ md: แสดง</text>
<rect x="380" y="300" width="300" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="530.0" y="324.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">md:hidden</text>
