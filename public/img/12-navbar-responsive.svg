<text x="400" y="396" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">คำที่ไม่มีคำนำหน้า = ใช้กับมือถือก่อน แล้ว md: ไปแก้ทับบนจอใหญ่</text>
