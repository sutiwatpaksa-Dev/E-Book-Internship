<rect x="30" y="345" width="740" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="400.0" y="371.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ตั้งที่ Settings → Branches: ต้องผ่าน PR · มีคนอนุมัติ ≥ 1 · check ผ่าน · ห้าม force push</text>
