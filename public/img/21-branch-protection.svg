<text x="540.0" y="279.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เขียว ผ่าน</text>
<text x="540.0" y="301.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รอพี่เลี้ยงอนุมัติ</text>
<line x1="402" y1="175" x2="448" y2="120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="402" y1="215" x2="448" y2="265" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="670" y="250" width="100" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="720.0" y="279.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">main</text>
<text x="720.0" y="301.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รวมแล้ว</text>
<line x1="632" y1="285" x2="668" y2="285" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<path d="M450,105 C300,105 130,105 105,158" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
