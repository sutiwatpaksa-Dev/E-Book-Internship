<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="ค่าลับไหลไปไหน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ค่าลับไหลไปไหน</title><desc>ค่าลับเก็บในช่อง Secrets ของ GitHub แล้วส่งให้เครื่องกลางเป็นตัวแปรตอนรัน ไม่อยู่ในโค้ดหรือ Git</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="418" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">ค่าลับอยู่ใน Secrets ไม่ใช่ในโค้ด</text>
<rect x="30" y="70" width="200" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="130.0" y="97.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Secrets ของ GitHub</text>
<text x="130.0" y="119.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">SSH_KEY</text>
<text x="130.0" y="141.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">SSH_KNOWN_HOSTS</text>
<text x="130.0" y="163.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">SSH_HOST · SSH_USER</text>
<rect x="310" y="70" width="200" height="110" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="410.0" y="97.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">เครื่องกลาง (runner)</text>
<text x="410.0" y="119.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ได้ค่าเป็นตัวแปร env</text>
<text x="410.0" y="141.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เฉพาะตอนงานรัน</text>
<text x="410.0" y="163.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ใช้เสร็จเครื่องถูกทิ้ง</text>
<rect x="590" y="70" width="180" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="680.0" y="108.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">เครื่องเช่า</text>
<text x="680.0" y="130.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">รับ SSH ด้วยกุญแจ</text>
<text x="680.0" y="152.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ที่ตรงกัน</text>
<line x1="232" y1="125" x2="308" y2="125" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<line x1="512" y1="125" x2="588" y2="125" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="270" y="112" font-size="13" text-anchor="middle" fill="#d97706" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">${{ secrets.X }}</text>
<text x="550" y="112" font-size="14" text-anchor="middle" fill="#00767f" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">ssh</text>
<rect x="30" y="230" width="360" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="210.0" y="259.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Git / โค้ดใน repo</text>
<text x="210.0" y="281.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่มีกุญแจ ไม่มี IP ลับ</text>
<text x="210" y="320" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">ห้ามใส่ค่าลับในโค้ดหรือ commit ลง Git</text>
<line x1="230" y1="228" x2="350" y2="302" stroke="#dc2626" stroke-width="0"/>
<rect x="430" y="230" width="340" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="600.0" y="259.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ค่าธรรมดา (Variable): DOMAIN</text>
<text x="600.0" y="281.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เปิดดูได้ ไม่ใช่ความลับ</text>
<rect x="30" y="345" width="740" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="376.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ห้ามพิมพ์ค่าลับออกมาดู · ลบไฟล์กุญแจในเครื่องเรา (rm ci_deploy_key*) เก็บที่ GitHub ที่เดียว</text>
<text x="210" y="285" font-size="1" fill="none"></text>
</svg>
