<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="กฎ rewrite ใน vercel.json" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>กฎ rewrite ใน vercel.json</title><desc>Vercel ไล่ดูกฎจากบนลงล่าง เส้นทาง /api ส่งไป Render ไฟล์จริงถูกส่งตรง ที่เหลือได้ index.html</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">คำขอเข้ามา Vercel เลือกทางไหน</text>
<rect x="30" y="70" width="180" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="120.0" y="92.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">คำขอเข้ามา</text>
<text x="120.0" y="114.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เช่น /api/services</text>
<rect x="270" y="60" width="240" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="390.0" y="92.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">กฎ 1 (อยู่บนสุด)</text>
<text x="390.0" y="114.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">/api/:path*</text>
<rect x="570" y="60" width="200" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="81.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ส่งต่อ Render</text>
<text x="670.0" y="103.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">คำตอบ + cookie</text>
<text x="670.0" y="125.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">กลับในนาม example.com</text>
<line x1="212" y1="98" x2="268" y2="98" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="512" y1="98" x2="568" y2="98" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="540" y="86" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">ตรง</text>
<line x1="390" y1="138" x2="390" y2="190" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<text x="400" y="168" font-size="14" text-anchor="start" fill="#64748b" font-weight="bold">ไม่ตรง</text>
<rect x="270" y="192" width="240" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="390.0" y="219.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">มีไฟล์จริงไหม</text>
<text x="390.0" y="241.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เช่น /assets/app.js</text>
<rect x="570" y="192" width="200" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="219.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">ส่งไฟล์นั้นตรงๆ</text>
<text x="670.0" y="241.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="normal">(Vercel ดูไฟล์จริงก่อนเสมอ)</text>
<line x1="512" y1="225" x2="568" y2="225" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="540" y="213" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">มี</text>
<line x1="390" y1="260" x2="390" y2="312" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<text x="400" y="290" font-size="14" text-anchor="start" fill="#64748b" font-weight="bold">ไม่มี</text>
<rect x="270" y="314" width="240" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="390.0" y="341.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">กฎ 2: /(.*)</text>
<text x="390.0" y="363.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เช่น /about /contact</text>
<rect x="570" y="314" width="200" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="341.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ส่ง /index.html</text>
<text x="670.0" y="363.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ให้ React เลือกหน้าเอง</text>
<line x1="512" y1="347" x2="568" y2="347" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="30" y="314" width="200" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="130.0" y="330.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่มีกฎ 2</text>
<text x="130.0" y="352.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">→ รีเฟรช /about</text>
<text x="130.0" y="374.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ได้ 404</text>
<rect x="30" y="396" width="740" height="32" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="417.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อควรระวัง: กฎ /api ต้องอยู่บนสุด ไม่งั้น /(.*) จะดักไว้ แล้วได้หน้าเว็บแทนข้อมูล</text>
</svg>
