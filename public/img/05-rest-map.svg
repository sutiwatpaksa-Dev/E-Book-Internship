<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" role="img" aria-label="แผนที่ REST resource" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>แผนที่ REST resource</title><desc>URL /laptops และ /laptops/5 กับ method ที่ใช้ได้ และตัวอย่าง URL ซ้อนกัน</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="446" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">REST: URL เป็นคำนาม · method เป็นคำกริยา</text>
<rect x="20" y="52" width="370" height="196" rx="10" fill="#eef9fa" stroke="#0e8a94" stroke-width="2"/>
<text x="205" y="82" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">/laptops   (ทั้งกอง)</text>
<rect x="40" y="102" width="86" height="30" rx="15" fill="#16a34a"/>
<text x="83" y="123" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">GET</text>
<text x="138" y="123" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">ดูทั้งหมด (+ กรอง ?status=)</text>
<rect x="40" y="146" width="86" height="30" rx="15" fill="#0e8a94"/>
<text x="83" y="167" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">POST</text>
<text x="138" y="167" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">สร้างเครื่องใหม่</text>
<text x="205" y="214" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">พหูพจน์ · ตัวพิมพ์เล็ก · ไม่มีคำกริยาใน URL</text>
<rect x="410" y="52" width="370" height="260" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="595" y="82" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">/laptops/5   (เครื่องที่ 5)</text>
<rect x="430" y="102" width="86" height="30" rx="15" fill="#16a34a"/>
<text x="473" y="123" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">GET</text>
<text x="528" y="123" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">ดูเครื่องเดียว</text>
<rect x="430" y="146" width="86" height="30" rx="15" fill="#d97706"/>
<text x="473" y="167" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">PATCH</text>
<text x="528" y="167" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">แก้บาง field</text>
<rect x="430" y="190" width="86" height="30" rx="15" fill="#d97706"/>
<text x="473" y="211" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">PUT</text>
<text x="528" y="211" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">แทนที่ทั้งก้อน</text>
<rect x="430" y="234" width="86" height="30" rx="15" fill="#dc2626"/>
<text x="473" y="255" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">DELETE</text>
<text x="528" y="255" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">ลบ</text>
<text x="595" y="296" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">ใส่ id ต่อท้ายเป็น path param</text>
<rect x="20" y="268" width="370" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="205" y="298" font-size="17" text-anchor="middle" fill="#00767f" font-weight="bold">/customers/3/rentals   (ซ้อนกัน)</text>
<rect x="40" y="318" width="86" height="30" rx="15" fill="#16a34a"/>
<text x="83" y="339" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">GET</text>
<text x="138" y="339" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">การเช่าทั้งหมดของลูกค้า 3</text>
<rect x="20" y="384" width="760" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="400.0" y="410.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ห้าม: /getAllLaptops · /createLaptop · GET /deleteLaptop/5  (กริยาใน URL / ใช้ GET เปลี่ยนข้อมูล)</text>
</svg>
