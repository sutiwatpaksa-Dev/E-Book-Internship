<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img"><title>SSH key คู่กุญแจ</title><defs><marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="snavy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#0b3c91"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="sblue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1a4fb0"/></marker><marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="sor" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#f59e0b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="sgr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="srd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="sgy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker></defs><rect x="2" y="2" width="796" height="336" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="30" y="50" width="300" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="180.0" y="107.4" font-size="16" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เครื่องเรา</text><text x="180.0" y="130.6" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id_ed25519  (private)</text><text x="180.0" y="153.8" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เก็บลับ ห้ามส่งใคร!</text><rect x="470" y="50" width="300" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="620.0" y="107.4" font-size="16" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">GitHub / GitLab</text><text x="620.0" y="130.6" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เก็บ id_ed25519.pub</text><text x="620.0" y="153.8" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(public key ของเรา)</text><line x1="190" y1="215" x2="470" y2="215" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aor)"/><text x="330" y="240" font-size="15" text-anchor="middle" font-weight="700" fill="#f59e0b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">วางแค่ .pub ลงในหน้า Settings → SSH keys</text><line x1="330" y1="100" x2="470" y2="100" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#anavy)"/><text x="400" y="88" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">git push</text><text x="400" y="130" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">พิสูจน์ว่าเป็นเราด้วย</text><text x="400" y="152" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">private key</text><rect x="30" y="265" width="740" height="55" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="400.0" y="286.9" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">public key = กุญแจกลอนที่แจกได้ · private key = ลูกกุญแจที่มีแค่เรา</text><text x="400.0" y="308.6" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ถ้า private key รั่ว ให้ลบ public key ออกจากเว็บแล้วสร้างคู่ใหม่ทันที</text></svg>