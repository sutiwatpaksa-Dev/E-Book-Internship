<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-label="Type narrowing ทีละขั้น" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Type narrowing ทีละขั้น</title><desc>แผนภาพแสดง v ที่เป็น string number หรือ null ถูกเช็คทีละเงื่อนไขจนเหลือชนิดเดียว</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="508" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="32" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">Narrowing: เช็คทีละด่าน ชนิดของ v ค่อยๆ แคบลง</text>
<rect x="40" y="52" width="340" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="210.0" y="77.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เริ่มต้น: v เป็น string | number | null</text>
<text x="210.0" y="100.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ยังไม่รู้ว่าเป็นอะไร</text>
<line x1="210" y1="118" x2="210" y2="150" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="40" y="152" width="340" height="56" rx="10" fill="#ffffff" stroke="#00767f" stroke-width="2"/>
<text x="210.0" y="185.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">if (v === null)</text>
<line x1="382" y1="180" x2="458" y2="180" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="420" y="170" font-size="15" text-anchor="middle" fill="#16a34a" font-weight="bold">ใช่</text>
<rect x="460" y="152" width="310" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="615.0" y="184.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">v เป็น null → return ออกไป</text>
<line x1="210" y1="210" x2="210" y2="242" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="236" y="232" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">ไม่ใช่</text>
<rect x="40" y="244" width="340" height="64" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="210.0" y="280.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เหลือ string | number</text>
<line x1="210" y1="310" x2="210" y2="342" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="40" y="344" width="340" height="56" rx="10" fill="#ffffff" stroke="#00767f" stroke-width="2"/>
<text x="210.0" y="376.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">if (typeof v === "string")</text>
<line x1="382" y1="372" x2="458" y2="372" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="420" y="362" font-size="15" text-anchor="middle" fill="#16a34a" font-weight="bold">ใช่</text>
<rect x="460" y="344" width="310" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="615.0" y="376.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">v เป็น string → ใช้ .length ได้</text>
<line x1="210" y1="402" x2="210" y2="432" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="236" y="424" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">ไม่ใช่</text>
<rect x="40" y="434" width="340" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="210.0" y="466.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เหลือ number → ใช้ .toFixed() ได้</text>
<rect x="460" y="244" width="310" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="615.0" y="269.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">TS จำผลการเช็คไว้</text>
<text x="615.0" y="292.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ในบล็อกนั้นๆ ให้เอง</text>
</svg>
