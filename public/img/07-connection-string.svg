<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="ส่วนประกอบของ connection string">
<title>ส่วนประกอบของ connection string</title>
<defs><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker></defs>
<rect x="1" y="1" width="798" height="328" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="400" y="34" font-size="15" fill="#64748b" text-anchor="middle" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">postgres://postgres:secret@localhost:5432/shop</text>
<text x="84" y="98" font-size="22" fill="#1a4fb0" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">postgres</text>
<text x="189.952" y="98" font-size="22" fill="#64748b" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">://</text>
<text x="229.684" y="98" font-size="22" fill="#16a34a" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">postgres</text>
<text x="335.63599999999997" y="98" font-size="22" fill="#64748b" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">:</text>
<text x="348.88" y="98" font-size="22" fill="#dc2626" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">secret</text>
<text x="428.344" y="98" font-size="22" fill="#64748b" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">@</text>
<text x="441.58799999999997" y="98" font-size="22" fill="#b45309" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">localhost</text>
<text x="560.784" y="98" font-size="22" fill="#64748b" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">:</text>
<text x="574.028" y="98" font-size="22" fill="#0b3c91" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">5432</text>
<text x="627.004" y="98" font-size="22" fill="#64748b" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">/</text>
<text x="640.248" y="98" font-size="22" fill="#0f766e" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">shop</text>
<line x1="136.976" y1="108" x2="136.976" y2="128" stroke="#1a4fb0" stroke-width="2"/>
<text x="136.976" y="150" font-size="16" fill="#1a4fb0" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ชนิดฐานข้อมูล</text>
<text x="136.976" y="170" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(protocol)</text>
<line x1="282.65999999999997" y1="108" x2="282.65999999999997" y2="200" stroke="#16a34a" stroke-width="2"/>
<text x="282.65999999999997" y="222" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ผู้ใช้</text>
<text x="282.65999999999997" y="242" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(user)</text>
<line x1="388.61199999999997" y1="108" x2="388.61199999999997" y2="128" stroke="#dc2626" stroke-width="2"/>
<text x="388.61199999999997" y="150" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">รหัสผ่าน</text>
<text x="388.61199999999997" y="170" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(password)</text>
<line x1="501.186" y1="108" x2="501.186" y2="200" stroke="#b45309" stroke-width="2"/>
<text x="501.186" y="222" font-size="16" fill="#b45309" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เครื่องที่รันฐานข้อมูล</text>
<text x="501.186" y="242" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(host)</text>
<line x1="600.5160000000001" y1="108" x2="600.5160000000001" y2="128" stroke="#0b3c91" stroke-width="2"/>
<text x="600.5160000000001" y="150" font-size="16" fill="#0b3c91" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">port</text>
<text x="600.5160000000001" y="170" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(ประตู)</text>
<line x1="666.7360000000001" y1="108" x2="666.7360000000001" y2="200" stroke="#0f766e" stroke-width="2"/>
<text x="666.7360000000001" y="222" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ชื่อ database</text>
<text x="400" y="300" font-size="15" fill="#64748b" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ถ้ารหัสผ่านมีอักขระพิเศษ เช่น @ : / ต้องแปลงเป็น %40 %3A %2F (URL-encode)</text>
</svg>
