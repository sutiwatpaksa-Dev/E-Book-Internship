<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Tailwind: แต่ละคำใน className = CSS หนึ่งอย่าง" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Tailwind: แต่ละคำใน className = CSS หนึ่งอย่าง</title><desc>แต่ละคำใน className เป็น CSS หนึ่งอย่าง Tailwind รวมให้เป็นหน้าตาของปุ่ม</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="378" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">Tailwind: แต่ละคำใน className = CSS หนึ่งอย่าง</text>
<rect x="30" y="50" width="740" height="46" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="400.0" y="78.6" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">className="bg-brand text-white px-4 py-2 rounded-lg"</text>
<rect x="30" y="122" width="170" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="115.0" y="143.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">bg-brand</text>
<line x1="204" y1="138" x2="254" y2="138" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
<rect x="258" y="122" width="300" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="408.0" y="142.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">background-color: สีหลักของร้าน</text>
<rect x="30" y="162" width="170" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="115.0" y="183.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">text-white</text>
<line x1="204" y1="178" x2="254" y2="178" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
<rect x="258" y="162" width="300" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="408.0" y="182.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">color: white  (สีตัวอักษร)</text>
<rect x="30" y="202" width="170" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="115.0" y="223.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">px-4</text>
<line x1="204" y1="218" x2="254" y2="218" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
<rect x="258" y="202" width="300" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="408.0" y="222.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">padding ซ้าย-ขวา: 16px  (4 × 4px)</text>
<rect x="30" y="242" width="170" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="115.0" y="263.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">py-2</text>
<line x1="204" y1="258" x2="254" y2="258" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
<rect x="258" y="242" width="300" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="408.0" y="262.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">padding บน-ล่าง: 8px  (2 × 4px)</text>
<rect x="30" y="282" width="170" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="115.0" y="303.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">rounded-lg</text>
<line x1="204" y1="298" x2="254" y2="298" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
<rect x="258" y="282" width="300" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="408.0" y="302.9" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">border-radius: 8px  (มุมโค้ง)</text>
<line x1="562" y1="200" x2="620" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="624" y="150" width="146" height="100" rx="10" fill="#00767f" stroke="#00767f" stroke-width="2"/>
<text x="697.0" y="204.9" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="normal">รวมกันได้</text>
<rect x="648" y="186" width="98" height="38" rx="8" fill="#6b3e26"/>
<text x="697" y="210" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">จองเลย</text>
<text x="400" y="350" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">Tailwind หาคำจาก "ข้อความเต็ม" ในโค้ด แล้วสร้าง CSS เฉพาะคำที่ใช้จริงให้เอง</text>
</svg>
