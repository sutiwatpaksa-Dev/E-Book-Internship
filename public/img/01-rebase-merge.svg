<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"><title>rebase กับ merge</title><defs><marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="snavy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#00767f"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="sblue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#0e8a94"/></marker><marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="sor" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#f59e0b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="sgr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="srd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="sgy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker></defs><rect x="2" y="2" width="796" height="396" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="200" y="30" font-size="16" text-anchor="middle" font-weight="700" fill="#00767f" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">merge: ประวัติแตกกิ่งแล้วมาบรรจบ</text><text x="600" y="30" font-size="16" text-anchor="middle" font-weight="700" fill="#00767f" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">rebase: ประวัติเป็นเส้นตรง</text><circle cx="50" cy="90" r="20" fill="#d5f0f2" stroke="#00767f" stroke-width="2.5"/><text x="50" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">A</text><circle cx="130" cy="90" r="20" fill="#d5f0f2" stroke="#00767f" stroke-width="2.5"/><text x="130" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">B</text><circle cx="210" cy="90" r="20" fill="#d5f0f2" stroke="#00767f" stroke-width="2.5"/><text x="210" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">E</text><circle cx="310" cy="90" r="20" fill="#d5f0f2" stroke="#00767f" stroke-width="2.5"/><text x="310" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">M</text><circle cx="170" cy="180" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="170" y="184.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">C</text><circle cx="250" cy="180" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="250" y="184.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">D</text><line x1="110" y1="90" x2="70" y2="90" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><line x1="190" y1="90" x2="150" y2="90" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><line x1="290" y1="90" x2="230" y2="90" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><path d="M122,108 L156,166" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><line x1="230" y1="180" x2="190" y2="180" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><path d="M292,106 L262,164" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aor)"/><text x="200" y="235" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">main มี E, feature มี C D → M รวมสองกิ่ง</text><circle cx="450" cy="90" r="20" fill="#d5f0f2" stroke="#00767f" stroke-width="2.5"/><text x="450" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">A</text><circle cx="530" cy="90" r="20" fill="#d5f0f2" stroke="#00767f" stroke-width="2.5"/><text x="530" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">B</text><circle cx="610" cy="90" r="20" fill="#d5f0f2" stroke="#00767f" stroke-width="2.5"/><text x="610" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">E</text><circle cx="690" cy="90" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="690" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">C'</text><circle cx="765" cy="90" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="765" y="94.9" font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">D'</text><line x1="510" y1="90" x2="470" y2="90" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><line x1="590" y1="90" x2="550" y2="90" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><line x1="670" y1="90" x2="630" y2="90" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><line x1="745" y1="90" x2="710" y2="90" stroke="#64748b" stroke-width="2.5" marker-end="url(#agy)"/><text x="600" y="140" font-size="15" text-anchor="middle" font-weight="400" fill="#16a34a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">C' D' = commit ใหม่ (รหัสเปลี่ยน)</text><text x="600" y="235" font-size="15" text-anchor="middle" font-weight="400" fill="#64748b" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">feature ถูกย้ายไปต่อท้าย main ล่าสุด</text><rect x="30" y="280" width="740" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="400.0" y="319.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">merge: เก็บประวัติจริง ปลอดภัย กับกิ่งที่แชร์ร่วม</text><text x="400.0" y="341.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">rebase: ประวัติสะอาด แต่เขียนประวัติใหม่ → ใช้กับ branch ของเราคนเดียวเท่านั้น</text></svg>