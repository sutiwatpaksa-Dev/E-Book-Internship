<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="เว็บทดลอง (Preview) ของแต่ละ PR" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>เว็บทดลอง (Preview) ของแต่ละ PR</title><desc>PR ได้เว็บทดลองแยก ส่วน main ได้เว็บจริง แต่ทั้งคู่ชี้ไปที่ API และฐานข้อมูลตัวจริงตัวเดียวกัน</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="398" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">ทุก PR ได้เว็บทดลอง แต่ใช้ข้อมูลจริงร่วมกัน</text>
<rect x="30" y="70" width="170" height="64" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="115.0" y="96.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">PR ใหม่</text>
<text x="115.0" y="118.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">จาก branch</text>
<rect x="280" y="70" width="230" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="395.0" y="96.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Vercel Preview</text>
<text x="395.0" y="118.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">bit-cafe-xxxx.vercel.app</text>
<rect x="30" y="210" width="170" height="64" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="115.0" y="236.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">รวมเข้า main</text>
<text x="115.0" y="258.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(merge)</text>
<rect x="280" y="210" width="230" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="395.0" y="236.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Vercel Production</text>
<text x="395.0" y="258.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">example.com</text>
<line x1="202" y1="102" x2="278" y2="102" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="202" y1="242" x2="278" y2="242" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="590" y="130" width="180" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="680.0" y="152.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">API (Render)</text>
<text x="680.0" y="174.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">+</text>
<text x="680.0" y="196.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ฐานข้อมูล (Neon)</text>
<text x="680.0" y="218.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ตัวจริงตัวเดียว</text>
<line x1="512" y1="102" x2="588" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="512" y1="242" x2="588" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="400" y="168" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold">ส่งลิงก์ให้พี่เลี้ยง/ลูกค้าดูก่อนรวม</text>
<rect x="30" y="310" width="740" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="339.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ระวัง: เว็บทดลองแก้ข้อมูลจริงได้ (ตามไฟล์ vercel.json)</text>
<text x="400.0" y="361.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ถ้างานใหญ่ขึ้น ควรแยก API + ฐานข้อมูลสำหรับทดลอง</text>
</svg>
