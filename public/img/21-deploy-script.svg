<text x="302.5" y="103.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">2 db:migrate</text>
<text x="302.5" y="125.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">อัปเดตตาราง</text>
<text x="302.5" y="147.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ก่อนเปิดโค้ดใหม่</text>
<line x1="382" y1="120" x2="417" y2="120" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="420" y="70" width="155" height="100" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="497.5" y="103.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">3 up -d</text>
<text x="497.5" y="125.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เปิดกล่องใหม่</text>
<text x="497.5" y="147.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แทนของเก่า</text>
<line x1="577" y1="120" x2="612" y2="120" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="615" y="70" width="155" height="100" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="692.5" y="103.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">4 image prune</text>
<text x="692.5" y="125.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ล้างของเก่า</text>
<text x="692.5" y="147.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ประหยัดดิสก์</text>
<rect x="30" y="205" width="740" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="229.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">set -euo pipefail: ขั้นไหนพัง หยุดทันที ไม่ทำต่อแบบครึ่งๆ กลางๆ</text>
<text x="400.0" y="251.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">(ลืมขั้น 2 ตอนทำมือคือสาเหตุเว็บ error ทั้งคืนในเรื่องเล่า)</text>
