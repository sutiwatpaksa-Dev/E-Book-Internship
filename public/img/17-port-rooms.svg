<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="IP คือตึก Port คือห้อง" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>IP คือตึก Port คือห้อง</title><desc>ที่อยู่เต็มของบริการประกอบด้วย IP บอกเครื่อง และ port บอกโปรแกรมในเครื่อง</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="358" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">IP คือตึก Port คือห้อง</text>
<rect x="30" y="50" width="230" height="60" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="145.0" y="85.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ลูกค้า (เบราว์เซอร์)</text>
<line x1="260" y1="80" x2="328" y2="80" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="330" y="50" width="440" height="300" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="550" y="78" font-size="15" text-anchor="middle" fill="#00767f" font-weight="bold">เครื่องเช่า  IP 203.0.113.10 (ตึก)</text>
<rect x="350" y="96" width="90" height="42" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="395.0" y="122.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ห้อง 22</text>
<text x="460" y="122" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">SSH : เข้าเครื่องเช่า</text>
<rect x="350" y="146" width="90" height="42" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="395.0" y="172.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ห้อง 80</text>
<text x="460" y="172" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">http : พาไป https</text>
<rect x="350" y="196" width="90" height="42" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="395.0" y="222.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ห้อง 443</text>
<text x="460" y="222" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">https : Caddy ประตูหน้า</text>
<rect x="350" y="246" width="90" height="42" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="395.0" y="272.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ห้อง 3000</text>
<text x="460" y="272" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">API : Hono</text>
<rect x="350" y="296" width="90" height="42" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="395.0" y="322.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ห้อง 5432</text>
<text x="460" y="322" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">ฐานข้อมูล : PostgreSQL</text>
<line x1="260" y1="92" x2="348" y2="230" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="30" y="160" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">ที่อยู่เต็ม =</text>
<text x="30" y="190" font-size="15" text-anchor="start" fill="#00767f" font-weight="bold">203.0.113.10:443</text>
<text x="30" y="220" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">IP:Port</text>
<text x="30" y="250" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">1 ห้องมีเจ้าของได้</text>
<text x="30" y="274" font-size="15" text-anchor="start" fill="#0f172a" font-weight="normal">คนเดียวเท่านั้น</text>
</svg>
