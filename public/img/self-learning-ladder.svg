<line x1="60" y1="250" x2="600" y2="70" stroke="#0b3c91" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#an)"/>
<text x="150" y="200" font-size="14" fill="#0b3c91" transform="rotate(-18 150 200)">ทุกขั้น: จดว่าลองอะไรไปแล้ว ได้ผลอะไร</text>
