<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="บันไดหาคำตอบ 5 ขั้นภายในราว 30 นาที" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16">
<title>บันไดหาคำตอบ 5 ขั้นภายในราว 30 นาที</title>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b3c91"/></marker></defs>
<rect x="1" y="1" width="798" height="398" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="34" font-size="20" text-anchor="middle" fill="#0b3c91" font-weight="bold">บันไดหาคำตอบ: ขึ้นทีละขั้น ติดขั้นไหนนานเกินก็ขึ้นขั้นถัดไป</text>

<!-- ขั้น 1 -->
<rect x="20" y="290" width="146" height="90" rx="10" fill="#e8effc" stroke="#0b3c91" stroke-width="2"/>
