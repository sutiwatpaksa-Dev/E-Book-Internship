<text x="400" y="428" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">หลักคิด: ข้อมูลจากผู้ใช้คือ &#x27;ข้อความ&#x27; เสมอ ห้ามให้ browser ตีความเป็นโค้ด</text>
