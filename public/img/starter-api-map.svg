 Menlo, Consolas, monospace" font-weight="bold"><tspan fill="#1a4fb0">GET</tspan><tspan> </tspan><tspan fill="#b91c1c">DELETE</tspan><tspan> </tspan></text><text x="519" y="389" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">messages/:id</text><text x="394" y="412" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold"><tspan fill="#b45309">PATCH</tspan><tspan> </tspan></text><text x="519" y="412" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">messages/:id</text><text x="768" y="126" font-size="15" text-anchor="end" fill="#15803d" font-weight="bold">ไม่ต้อง login ก่อน</text><text x="768" y="150" font-size="15" text-anchor="end" fill="#15803d" font-weight="bold">ไม่ต้อง login ก่อน</text><rect x="392" y="430" width="376" height="30" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="580" y="451" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="bold">ที่เหลือ ไม่ login → 401 (ด่าน requireAdmin)</text>
