<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">รายการ API: ใครก็เรียกได้ กับต้อง login</text>
<rect x="20" y="50" width="340" height="178" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="190" y="76" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold">ใครก็เรียกได้ (หน้าเว็บลูกค้า)</text><text x="34" y="98" font-size="15" text-anchor="start" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace">/api/...</text><text x="34" y="122" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold"><tspan fill="#1a4fb0">GET</tspan><tspan> </tspan></text><text x="84" y="122" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">settings</text><text x="34" y="146" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold"><tspan fill="#1a4fb0">GET</tspan><tspan> </tspan></text><text x="84" y="146" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">pages/:slug</text><text x="34" y="170" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold"><tspan fill="#1a4fb0">GET</tspan><tspan> </tspan></text><text x="84" y="170" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">categories</text><text x="34" y="194" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold"><tspan fill="#1a4fb0">GET</tspan><tspan> </tspan></text><text x="84" y="194" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">services?category=&amp;featured=</text><text x="34" y="218" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold"><tspan fill="#15803d">POST</tspan><tspan> </tspan></text><text x="84" y="218" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">contact</text><rect x="20" y="243" width="340" height="227" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="190" y="269" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">ตัวเลขบอกผล (status code)</text><text x="40" y="298" font-size="15" text-anchor="start" fill="#15803d" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">200</text><text x="80" y="298" font-size="15" text-anchor="start" fill="#0f172a">สำเร็จ</text><text x="40" y="322" font-size="15" text-anchor="start" fill="#15803d" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">201</text><text x="80" y="322" font-size="15" text-anchor="start" fill="#0f172a">สร้างของใหม่สำเร็จ</text><text x="40" y="346" font-size="15" text-anchor="start" fill="#b45309" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">400</text><text x="80" y="346" font-size="15" text-anchor="start" fill="#0f172a">ข้อมูลไม่ครบหรือผิดรูปแบบ</text><text x="40" y="370" font-size="15" text-anchor="start" fill="#b91c1c" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">401</text><text x="80" y="370" font-size="15" text-anchor="start" fill="#0f172a">ยังไม่ได้ login</text><text x="40" y="394" font-size="15" text-anchor="start" fill="#b45309" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">404</text><text x="80" y="394" font-size="15" text-anchor="start" fill="#0f172a">หาไม่เจอ</text><text x="40" y="418" font-size="15" text-anchor="start" fill="#b91c1c" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">409</text><text x="80" y="418" font-size="15" text-anchor="start" fill="#0f172a">ขัดกับข้อมูลเดิม เช่น ลบหมวดที่มีสินค้า</text><text x="40" y="442" font-size="15" text-anchor="start" fill="#b91c1c" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">500</text><text x="80" y="442" font-size="15" text-anchor="start" fill="#0f172a">server พังเอง</text><rect x="380" y="50" width="400" height="420" rx="8" fill="#fef3c7" stroke="#d97