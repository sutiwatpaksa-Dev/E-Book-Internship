<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img"><title>เครื่องเรากับ remote</title><defs><marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="snavy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#0b3c91"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker><marker id="sblue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1a4fb0"/></marker><marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="sor" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#f59e0b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="sgr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="srd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="sgy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker></defs><rect x="2" y="2" width="796" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="30" y="60" width="300" height="150" rx="12" fill="#e0ebff" stroke="#1a4fb0" stroke-width="2"/><text x="180.0" y="140.6" font-size="16" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif"></text><text x="180" y="90" font-size="17" text-anchor="middle" font-weight="700" fill="#0b3c91" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เครื่องเรา (local)</text><rect x="50" y="105" width="120" height="40" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="110.0" y="130.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Working</text><rect x="190" y="105" width="120" height="40" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="250.0" y="130.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Staging</text><rect x="100" y="155" width="180" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="190.0" y="180.2" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Local repo (main)</text><rect x="470" y="60" width="300" height="150" rx="10" fill="#dbe7fb" stroke="#0b3c91" stroke-width="2"/><text x="620.0" y="116.3" font-size="17" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">GitHub / GitLab</text><text x="620.0" y="140.9" font-size="17" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">(remote ชื่อ origin)</text><text x="620.0" y="165.6" font-size="17" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">origin/main</text><line x1="330" y1="100" x2="470" y2="100" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#anavy)"/><text x="400" y="90" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">git push</text><line x1="470" y1="130" x2="330" y2="130" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aor)"/><text x="400" y="152" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">git fetch</text><line x1="470" y1="200" x2="330" y2="200" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#agr)"/><text x="400" y="224" font-size="15" text-anchor="middle" font-weight="700" fill="#16a34a" font-family="ui-monospace, Menlo, Consolas, monospace">git clone (ครั้งแรก)</text><rect x="30" y="260" width="740" height="90" rx="10" fill="#ffffff" stroke="w" stroke-width="2"/><text x="400.0" y="299.4" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">push = ส่งขึ้น · fetch = ดูว่ามีอะไรใหม่ (ยังไม่แตะงานเรา)</text><text x="400.0" y="321.1" font-size="15" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">pull = ดึงมาแล้วรวมกับงานเรา · clone = ก๊อปทั้ง repo มาครั้งแรก</text></svg>