<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="CSRF ไหลยังไง" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16">
<title>CSRF ไหลยังไง</title>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00767f"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="20" text-anchor="middle" fill="#00767f" font-weight="bold">CSRF: เว็บอื่นหลอกให้ browser เราส่งคำสั่งแทน</text>
<rect x="16" y="60" width="200" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="116.0" y="87.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เว็บร้าย</text>
<text x="116.0" y="108.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">evil.example</text>
<text x="116.0" y="129.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ฟอร์มซ่อน POST ไปธนาคาร</text>
<rect x="300" y="60" width="200" height="86" rx="10" fill="#fff" stroke="#00767f" stroke-width="2"/>
<text x="400.0" y="87.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Browser ของเรา</text>
<text x="400.0" y="108.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">login ธนาคารค้างไว้</text>
<text x="400.0" y="129.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">มี cookie อยู่</text>
<rect x="584" y="60" width="200" height="86" rx="10" fill="#e6f5f6" stroke="#0e8a94" stroke-width="2"/>
<text x="684.0" y="87.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เว็บธนาคาร</text>
<text x="684.0" y="108.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">bank.example</text>
<text x="684.0" y="129.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เห็น cookie ถูกต้อง</text>
<line x1="218" y1="103" x2="298" y2="103" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="502" y1="103" x2="582" y2="103" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<circle cx="258" cy="86" r="11" fill="#f59e0b"/>
<text x="258" y="90.55" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<circle cx="542" cy="86" r="11" fill="#f59e0b"/>
<text x="542" y="90.55" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="400" y="172" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">1 เราเปิดหน้าเว็บร้ายขณะยัง login ธนาคารอยู่</text>
<text x="400" y="194" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">2 browser ส่ง POST /transfer พร้อม cookie ให้เองอัตโนมัติ</text>
<text x="400" y="220" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">3 ธนาคารเข้าใจว่าเราสั่งเอง: โอนเงินสำเร็จ (โดยเราไม่รู้ตัว)</text>
<text x="400" y="244" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="bold">วิธีกัน (ใช้ร่วมกันได้)</text>
<rect x="24" y="260" width="240" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="144" y="290" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">SameSite cookie</text>
<text x="144" y="324" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Lax/Strict: ไม่แนบ cookie</text>
<text x="144" y="350" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เมื่อคำสั่งมาจากเว็บอื่น</text>
<rect x="278" y="260" width="240" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="398" y="290" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">CSRF token</text>
<text x="398" y="324" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ฟอร์มจริงมีรหัสลับแนบ</text>
<text x="398" y="350" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เว็บร้ายไม่รู้ จึงปลอมไม่ได้</text>
<rect x="532" y="260" width="240" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="652" y="290" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">ตรวจ Origin</text>
<text x="652" y="324" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เช็คว่าคำขอมาจากเว็บเรา</text>
<text x="652" y="350" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่ใช่ evil.example</text>
<text x="400" y="418" font-size="15" text-anchor="middle" fill="#64748b" font-weight="normal">API ที่ไม่ใช้ cookie (ส่ง token ใน header เอง) เสี่ยง CSRF น้อยกว่ามาก</text>
</svg>
