<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" role="img" aria-label="Caddy ขอใบรับรอง HTTPS อัตโนมัติ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Caddy ขอใบรับรอง HTTPS อัตโนมัติ</title><desc>Caddy ขอใบรับรอง ผู้ออกถาม DNS แล้วทดสอบต่อเข้าเครื่องเรา ถ้าผ่านจึงออกใบรับรอง</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="462" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">Caddy ขอใบรับรอง HTTPS ให้เองอย่างไร</text>
<rect x="30" y="44" width="180" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="120.0" y="66.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Caddy</text>
<text x="120.0" y="88.0" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal">บนเครื่องเช่า</text>
<rect x="310" y="44" width="180" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="400.0" y="66.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ผู้ออกใบรับรอง</text>
<text x="400.0" y="88.0" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal">เช่น Let's Encrypt</text>
<rect x="590" y="44" width="180" height="56" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="680.0" y="66.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">DNS</text>
<text x="680.0" y="88.0" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal">ที่ตั้งไว้ในบทที่ 18</text>
<line x1="120" y1="100" x2="120" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="400" y1="100" x2="400" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="680" y1="100" x2="680" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="122" y1="134" x2="398" y2="134" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="260" y="124" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">1 ขอใบรับรองของ example.com</text>
<line x1="402" y1="176" x2="678" y2="176" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="540" y="166" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">2 example.com ชี้ไป IP ไหน?</text>
<line x1="678" y1="208" x2="402" y2="208" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="540" y="198" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">IP ของ VPS เรา</text>
<line x1="398" y1="252" x2="122" y2="252" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="260" y="242" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">3 ลองต่อ port 80/443 ที่ IP นั้น</text>
<line x1="122" y1="294" x2="398" y2="294" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="260" y="284" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">4 Caddy ตอบโจทย์ได้</text>
<line x1="398" y1="336" x2="122" y2="336" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="260" y="326" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">5 ออกใบรับรองให้</text>
<rect x="24" y="350" width="300" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="174.0" y="377.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เก็บใน caddy_data + ต่ออายุเอง</text>
<rect x="24" y="408" width="752" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="435.0" font-size="14" text-anchor="middle" fill="#b91c1c" font-weight="bold">ชื่อเว็บยังไม่ชี้มา / ประตู 80 ปิด / เมฆส้ม Cloudflare → challenge failed</text>
</svg>
