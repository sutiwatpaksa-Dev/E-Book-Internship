<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="ดึงข้อมูลจาก API: ต้องมี 3 แบบเสมอ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ดึงข้อมูลจาก API: ต้องมี 3 แบบเสมอ</title><desc>useFetch เริ่มที่ loading แล้วเปลี่ยนเป็น success หรือ error เสมอ ต้องมีหน้าตาให้ครบทั้งสามแบบ</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="418" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">ดึงข้อมูลจาก API: ต้องมี 3 แบบเสมอ</text>
<rect x="30" y="60" width="200" height="70" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="130.0" y="89.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">useEffect ทำงาน</text>
<text x="130.0" y="111.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">fetch(url)</text>
<line x1="232" y1="95" x2="308" y2="95" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="310" y="60" width="180" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="89.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">loading = true</text>
<text x="400.0" y="111.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">กำลังรอคำตอบ</text>
<line x1="492" y1="80" x2="558" y2="50" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="492" y1="110" x2="558" y2="150" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="560" y="34" width="210" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="665.0" y="56.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">สำเร็จ: ได้ JSON</text>
<text x="665.0" y="77.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">success: true</text>
<rect x="560" y="122" width="210" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="665.0" y="144.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">พัง: เน็ตหลุด / 404</text>
<text x="665.0" y="165.4" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่ใช่ JSON</text>
<text x="400" y="222" font-size="16" text-anchor="middle" fill="#0b3c91" font-weight="bold">หน้าจอที่ผู้ใช้เห็น</text>
<rect x="30" y="240" width="230" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="145.0" y="273.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">loading</text>
<text x="145.0" y="295.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">กำลังโหลด... ⏳</text>
<text x="145.0" y="317.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(หรือกล่องเทาๆ)</text>
<rect x="285" y="240" width="230" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="273.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">error</text>
<text x="400.0" y="295.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">โหลดข้อมูลไม่สำเร็จ 😢</text>
<text x="400.0" y="317.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">บอกสาเหตุเป็นภาษาคน</text>
<rect x="540" y="240" width="230" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="655.0" y="273.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">data</text>
<text x="655.0" y="295.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แสดงการ์ดสินค้า</text>
<text x="655.0" y="317.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">data?.map(...)</text>
<text x="400" y="372" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">ถ้าผู้ใช้ออกจากหน้าก่อนโหลดเสร็จ → cleanup: controller.abort() ยกเลิกการดึง</text>
<text x="400" y="396" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">if (loading) return ...;  if (error) return ...;  แล้วค่อยแสดงข้อมูล</text>
</svg>
