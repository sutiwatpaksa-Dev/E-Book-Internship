<text x="400" y="364" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">client ไม่เคยเห็นรายละเอียดภายใน · เขียนดักที่เดียว ไม่ต้องดักทุก handler</text>
</svg>
