<text x="660.0" y="99.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">status / code / message</text>
<text x="660.0" y="121.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ที่เราตั้งใจใส่</text>
