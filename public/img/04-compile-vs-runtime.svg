<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="TypeScript ตรวจตอน build ส่วน Zod ตรวจตอนรัน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>TypeScript ตรวจตอน build ส่วน Zod ตรวจตอนรัน</title><desc>สองโซน ฝั่งซ้าย TypeScript ตรวจโค้ดตอนเขียน ฝั่งขวา Zod ตรวจข้อมูลจากข้างนอกตอนรัน</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="408" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="32" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">TypeScript ตรวจ "โค้ดของเรา" / Zod ตรวจ "ข้อมูลจากข้างนอก"</text>
<rect x="20" y="54" width="350" height="330" rx="10" fill="#eef9fa" stroke="#0e8a94" stroke-width="2"/>
<text x="195" y="82" font-size="16" text-anchor="middle" fill="#0e8a94" font-weight="bold">ตอนเขียน / build (compile time)</text>
<rect x="45" y="100" width="300" height="70" rx="10" fill="#ffffff" stroke="#0e8a94" stroke-width="2"/>
<text x="195.0" y="128.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">TypeScript ตรวจ</text>
<text x="195.0" y="151.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ชื่อ field · ชนิดตัวแปร · argument</text>
<rect x="45" y="196" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="195.0" y="224.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เจอบั๊กตั้งแต่พิมพ์</text>
<text x="195.0" y="247.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เส้นแดงใน VS Code</text>
<rect x="45" y="292" width="300" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="195.0" y="320.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตอนรัน type หายไปหมด</text>
<text x="195.0" y="343.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(ถูกตัดทิ้งตอน build)</text>
<rect x="430" y="54" width="350" height="330" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="605" y="82" font-size="16" text-anchor="middle" fill="#b45309" font-weight="bold">ตอนรันจริง (runtime)</text>
<rect x="455" y="100" width="300" height="70" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="605.0" y="128.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลจากข้างนอก</text>
<text x="605.0" y="151.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ฟอร์ม · API อื่น · ไฟล์ · JSON</text>
<line x1="605" y1="172" x2="605" y2="200" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<rect x="455" y="202" width="300" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="605.0" y="230.7" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Zod .safeParse()</text>
<text x="605.0" y="253.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เป็นโค้ดที่รันตรวจจริง</text>
<line x1="605" y1="274" x2="605" y2="302" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="455" y="304" width="300" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="605.0" y="338.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลที่เชื่อได้ + มี type</text>
<line x1="372" y1="330" x2="428" y2="330" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#as)"/>
<text x="400" y="318" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">รอยต่อ</text>
</svg>
