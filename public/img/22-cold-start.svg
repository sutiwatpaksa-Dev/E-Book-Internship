<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="แผนฟรีที่หลับ (cold start)" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>แผนฟรีที่หลับ (cold start)</title><desc>เมื่อไม่มีคนใช้สักพัก API หลับ คนแรกที่เข้าต้องรอหลายสิบวินาที หลังจากนั้นเร็วปกติ</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="328" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">แผนฟรีหลับเมื่อไม่มีคนใช้: คนแรกต้องรอ</text>
<rect x="30" y="70" width="170" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="115.0" y="99.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ตื่นอยู่</text>
<text x="115.0" y="121.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ตอบเร็ว</text>
<rect x="250" y="70" width="170" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="335.0" y="99.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ไม่มีคนใช้</text>
<text x="335.0" y="121.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">สักพัก</text>
<rect x="470" y="70" width="140" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="540.0" y="99.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">หลับ</text>
<text x="540.0" y="121.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">(ถูกพักเครื่อง)</text>
<rect x="650" y="70" width="120" height="70" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="710.0" y="99.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">มีคนเข้า</text>
<text x="710.0" y="121.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">คนแรก</text>
<line x1="202" y1="105" x2="248" y2="105" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<line x1="422" y1="105" x2="468" y2="105" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<line x1="612" y1="105" x2="648" y2="105" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="470" y="180" width="300" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="620.0" y="206.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ปลุกเครื่อง ต้องรอหลายสิบวินาที</text>
<text x="620.0" y="228.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ลูกค้าเห็นหน้าโหลดนาน</text>
<line x1="710" y1="142" x2="710" y2="178" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="468" y1="212" x2="330" y2="212" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="30" y="180" width="300" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="180.0" y="206.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ตื่นแล้ว กลับมาเร็วปกติ</text>
<text x="180.0" y="228.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ครั้งถัดไปไม่ช้า</text>
<rect x="30" y="264" width="740" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="293.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ใช้โชว์งานได้ แต่ เว็บลูกค้าจริงควรใช้แผนที่ไม่หลับ และแจ้งลูกค้าเรื่องค่าใช้จ่ายตั้งแต่แรก</text>
</svg>
