<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Caddy ส่งคำขอไปไหน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
