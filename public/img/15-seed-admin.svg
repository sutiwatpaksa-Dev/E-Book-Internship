<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="สร้างบัญชีเจ้าของร้านคนแรกด้วย seed" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>สร้างบัญชีเจ้าของร้านคนแรกด้วย seed</title><desc>seed อ่านอีเมลและรหัสผ่านจาก .env hash รหัสผ่านแล้วบันทึกลงตาราง admins เก็บเฉพาะ password_hash</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="428" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">สร้างบัญชีเจ้าของร้านคนแรกด้วย seed</text>
<rect x="20" y="60" width="170" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="105.0" y="93.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">server/.env</text><text x="105.0" y="115.2" font-size="15" text-anchor="middle" fill="#0f172a">ADMIN_EMAIL</text><text x="105.0" y="137.2" font-size="15" text-anchor="middle" fill="#0f172a">ADMIN_PASSWORD</text><line x1="190" y1="110" x2="225" y2="110" stroke="#00767f" stroke-width="2" marker-end="url(#an)"/><rect x="225" y="60" width="170" height="100" rx="8" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="310.0" y="93.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">bun run seed</text><text x="310.0" y="115.2" font-size="15" text-anchor="middle" fill="#0f172a">src/db/seed.ts</text><text x="310.0" y="137.2" font-size="15" text-anchor="middle" fill="#0f172a">ถ้ามีทั้งคู่ใน .env</text><line x1="395" y1="110" x2="430" y2="110" stroke="#00767f" stroke-width="2" marker-end="url(#an)"/><rect x="430" y="60" width="170" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="515.0" y="93.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Bun.password</text><text x="515.0" y="115.2" font-size="15" text-anchor="middle" fill="#0f172a">.hash(password)</text><text x="515.0" y="137.2" font-size="15" text-anchor="middle" fill="#0f172a">→ argon2id</text><line x1="600" y1="110" x2="635" y2="110" stroke="#00767f" stroke-width="2" marker-end="url(#an)"/><rect x="635" y="60" width="145" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="707.5" y="82.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">INSERT admins</text><text x="707.5" y="104.2" font-size="15" text-anchor="middle" fill="#0f172a">email (ตัวเล็ก)</text><text x="707.5" y="126.2" font-size="15" text-anchor="middle" fill="#0f172a">password_hash</text><text x="707.5" y="148.2" font-size="15" text-anchor="middle" fill="#0f172a">name</text><text x="400" y="186" font-size="15" text-anchor="middle" fill="#475569">onConflictDoNothing บนอีเมล → รัน seed ซ้ำได้ ไม่เกิดบัญชีซ้ำ</text><rect x="20" y="215" width="760" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="400" y="243" font-size="15" text-anchor="middle" fill="#0f172a">เปิด pgAdmin ดูช่อง password_hash จะเห็นประมาณ</text><text x="400" y="270" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">$argon2id$v=19$m=65536,t=2,p=1$...  ไม่ใช่รหัสผ่านจริง</text><rect x="20" y="305" width="370" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="205" y="332" font-size="17" text-anchor="middle" fill="#15803d" font-weight="bold">hash = ทางเดียว</text><text x="205" y="360" font-size="15" text-anchor="middle" fill="#0f172a">ย้อนกลับเป็นรหัสจริงไม่ได้</text><text x="205" y="385" font-size="15" text-anchor="middle" fill="#0f172a">ใช้เก็บรหัสผ่าน</text><rect x="410" y="305" width="370" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="595" y="332" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold">เข้ารหัส (encrypt)</text><text x="595" y="360" font-size="15" text-anchor="middle" fill="#0f172a">มีกุญแจก็ถอดกลับได้</text><text x="595" y="385" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="bold">ห้ามใช้เก็บรหัสผ่าน</text>
</svg>
