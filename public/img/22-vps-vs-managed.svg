<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="เช่าเครื่องเอง กับ บริการสำเร็จรูป" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
