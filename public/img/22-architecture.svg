<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="หน้าตาระบบบน Vercel + Render + Neon" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>หน้าตาระบบบน Vercel + Render + Neon</title><desc>เบราว์เซอร์เปิดเว็บที่ Vercel คำขอ /api ถูกส่งต่อไป Render ซึ่งต่อ Neon ด้วยการเข้ารหัส</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="418" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">คำขอของลูกค้าเดินทางผ่าน 3 บริการ</text>
<rect x="30" y="160" width="150" height="80" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="105.0" y="194.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เบราว์เซอร์</text>
<text x="105.0" y="216.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ลูกค้า</text>
<rect x="250" y="60" width="230" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="365.0" y="98.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Vercel</text>
<text x="365.0" y="120.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">หน้าเว็บ React ที่แพ็กแล้ว</text>
<text x="365.0" y="142.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(เก็บเป็นไฟล์)</text>
<rect x="250" y="250" width="230" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="365.0" y="288.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Render</text>
<text x="365.0" y="310.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">API ในกล่อง Docker</text>
<text x="365.0" y="332.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(รันตลอดเวลา)</text>
<rect x="570" y="250" width="200" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="288.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Neon</text>
<text x="670.0" y="310.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ฐานข้อมูล</text>
<text x="670.0" y="332.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">PostgreSQL</text>
<line x1="150" y1="162" x2="250" y2="120" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="165" y="128" font-size="14" text-anchor="middle" fill="#00767f" font-weight="bold">example.com</text>
<text x="350" y="196" font-size="14" text-anchor="end" fill="#0f172a" font-weight="normal">ขอไฟล์ / ขอ /about</text>
<text x="350" y="216" font-size="14" text-anchor="end" fill="#64748b" font-weight="normal">→ Vercel ตอบเอง</text>
<line x1="365" y1="172" x2="365" y2="248" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="377" y="216" font-size="14" text-anchor="start" fill="#d97706" font-weight="bold">/api/... ส่งต่อ</text>
<line x1="482" y1="305" x2="568" y2="305" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="525" y="292" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">เข้ารหัส</text>
<text x="525" y="330" font-size="13" text-anchor="middle" fill="#64748b" font-weight="normal">(sslmode=require)</text>
<rect x="30" y="290" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="125.0" y="319.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">cookie เป็นของ</text>
<text x="125.0" y="341.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">example.com ที่เดียว</text>
<text x="30" y="388" font-size="15" text-anchor="start" fill="#00767f" font-weight="bold">เบราว์เซอร์เห็นชื่อเว็บเดียว: ระบบ login ด้วย cookie จึงใช้ได้เหมือนบทที่ 20</text>
</svg>
