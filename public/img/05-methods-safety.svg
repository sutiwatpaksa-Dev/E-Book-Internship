<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-label="Safe และ idempotent ของแต่ละ method" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Safe และ idempotent ของแต่ละ method</title><desc>ตารางแสดง GET PUT DELETE PATCH POST ว่าปลอดภัยและทำซ้ำได้ผลเท่าเดิมหรือไม่</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="464" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">Method: ปลอดภัย (safe) และ ทำซ้ำได้ผลเท่าเดิม (idempotent)</text>
<rect x="30" y="50" width="130" height="58" rx="6" fill="#00767f"/>
<text x="95.0" y="86" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">Method</text>
<rect x="160" y="50" width="170" height="58" rx="6" fill="#00767f"/>
<text x="245.0" y="74" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">Safe</text>
<text x="245.0" y="96" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">(ไม่เปลี่ยนข้อมูล)</text>
<rect x="330" y="50" width="200" height="58" rx="6" fill="#00767f"/>
<text x="430.0" y="74" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">Idempotent</text>
<text x="430.0" y="96" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">(ยิงซ้ำ ผลเท่าเดิม)</text>
<rect x="530" y="50" width="240" height="58" rx="6" fill="#00767f"/>
<text x="650.0" y="86" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">ตัวอย่าง</text>
<rect x="30" y="116" width="740" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="30" y="116" width="130" height="48" rx="6" fill="#16a34a"/>
<text x="95" y="147" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">GET</text>
<text x="245.0" y="147" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="bold">✓</text>
<text x="430.0" y="147" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="bold">✓</text>
<text x="540" y="147" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal">GET /laptops</text>
<rect x="30" y="172" width="740" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="30" y="172" width="130" height="48" rx="6" fill="#d97706"/>
<text x="95" y="203" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">PUT</text>
<text x="245.0" y="203" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold">✗</text>
<text x="430.0" y="203" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="bold">✓</text>
<text x="540" y="203" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal">PUT /laptops/5 ซ้ำ = ค่าเดิม</text>
<rect x="30" y="228" width="740" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="30" y="228" width="130" height="48" rx="6" fill="#d97706"/>
<text x="95" y="259" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">DELETE</text>
<text x="245.0" y="259" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold">✗</text>
<text x="430.0" y="259" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="bold">✓</text>
<text x="540" y="259" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal">ลบซ้ำ = ยังหายอยู่</text>
<rect x="30" y="284" width="740" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="30" y="284" width="130" height="48" rx="6" fill="#d97706"/>
<text x="95" y="315" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">PATCH</text>
<text x="245.0" y="315" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold">✗</text>
<text x="430.0" y="315" font-size="15" text-anchor="middle" fill="#b45309" font-weight="bold">ขึ้นกับวิธีเขียน</text>
<text x="540" y="315" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal">บวกเพิ่ม +1 ไม่ idempotent</text>
<rect x="30" y="340" width="740" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="30" y="340" width="130" height="48" rx="6" fill="#dc2626"/>
<text x="95" y="371" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">POST</text>
<text x="245.0" y="371" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold">✗</text>
<text x="430.0" y="371" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold">✗</text>
<text x="540" y="371" font-size="14" text-anchor="start" fill="#0f172a" font-weight="normal">POST ซ้ำ = สร้างซ้ำ</text>
<rect x="30" y="402" width="740" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="400.0" y="428.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">กฎเหล็ก: GET ต้องไม่เปลี่ยนข้อมูล · ปุ่ม "กดซ้ำ" ของ POST ต้องกันด้วย (เช่น ปิดปุ่มหลังกด)</text>
</svg>
