<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="ขั้นตอน schema, migration และการรัน migration กับฐานข้อมูล">
<title>ขั้นตอน schema, migration และการรัน migration กับฐานข้อมูล</title>
<defs><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker></defs>
<rect x="1" y="1" width="798" height="428" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="20" y="40" width="200" height="86" rx="12" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="120.0" y="76" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">schema.ts</text>
<text x="120.0" y="102" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">เราแก้ที่นี่ที่เดียว</text>
<rect x="300" y="40" width="210" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="405.0" y="76" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">drizzle/0001_x.sql</text>
<text x="405.0" y="102" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ไฟล์ SQL เก็บใน Git</text>
<rect x="590" y="40" width="190" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="685.0" y="76" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">ฐานข้อมูล</text>
<text x="685.0" y="102" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ตาราง + ตารางบันทึก</text>
<line x1="220" y1="83" x2="300" y2="83" stroke="#00767f" stroke-width="3" marker-end="url(#arn)"/>
<line x1="510" y1="83" x2="590" y2="83" stroke="#00767f" stroke-width="3" marker-end="url(#arn)"/>
<text x="260" y="70" font-size="15" fill="#00767f" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">generate</text>
<text x="550" y="70" font-size="15" fill="#00767f" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">migrate</text>
<text x="400" y="160" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">generate = เทียบ schema กับของเดิม แล้วเขียนไฟล์ SQL ใหม่</text>
<text x="400" y="182" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">migrate = รันเฉพาะไฟล์ที่ฐานข้อมูลยังไม่เคยรัน</text>
<path d="M120,126 L120,236 L685,236 L685,128" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aro)"/>
<text x="400" y="226" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">push = ข้ามไฟล์ migration (ใช้เฉพาะทดลองในเครื่อง)</text>
<rect x="20" y="252" width="760" height="164" rx="12" fill="#ffffff" stroke="#0e8a94" stroke-width="2"/>
<text x="40" y="282" font-size="16" fill="#00767f" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">กฎ migration</text>
<text x="40" y="311" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">1. เปลี่ยนโครงสร้าง: แก้ schema → generate → อ่านไฟล์ SQL → migrate → commit</text>
<text x="40" y="341" font-size="15" fill="#dc2626" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">2. migration ที่ถูกรันไปแล้ว ห้ามแก้ไฟล์เดิม  ถ้าผิดให้สร้างไฟล์ใหม่มาแก้</text>
<text x="40" y="371" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">3. ก่อนรันบน production ให้ backup และลองกับ DB ทดสอบก่อน</text>
<text x="40" y="398" font-size="15" fill="#64748b" text-anchor="start" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">Prisma: schema.prisma → prisma migrate dev → prisma/migrations/ → DB</text>
</svg>
