<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="ใครเห็นอะไร: แชทกับ agent" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ใครเห็นอะไร: แชทกับ agent</title><desc>แชทเห็นเฉพาะที่เราวาง ส่วน agent อ่านและแก้ไฟล์ในโปรเจกต์และรันคำสั่งโดยขออนุมัติ</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="798" height="418" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">ข้อมูลไหลทางไหน: แชท vs agent</text>
<text x="20" y="62" font-size="16" text-anchor="start" fill="#0b3c91" font-weight="bold">แบบแชท</text>
<rect x="20" y="74" width="150" height="70" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="95.0" y="98" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เรา + โปรเจกต์</text>
<rect x="325" y="74" width="150" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="98" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">แชท AI</text>
<text x="400.0" y="120" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(เว็บ/แอป)</text>
<rect x="630" y="74" width="150" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="705.0" y="98" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">คำตอบ + โค้ด</text>
<text x="705.0" y="120" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">บนหน้าจอ</text>
<line x1="172" y1="100" x2="323" y2="100" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="248" y="92" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เรา copy/วาง</text>
<line x1="477" y1="100" x2="628" y2="100" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="553" y="92" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ตอบกลับ</text>
<line x1="700" y1="146" x2="100" y2="180" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="400" y="176" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เรา copy กลับไปใส่ไฟล์เอง</text>
<text x="400" y="192" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal"></text>
<text x="20" y="226" font-size="16" text-anchor="start" fill="#0b3c91" font-weight="bold">แบบ agent</text>
<rect x="20" y="240" width="150" height="90" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="95.0" y="264" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เรา</text>
<text x="95.0" y="286" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(ตรวจ/อนุมัติ)</text>
<rect x="300" y="240" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="264" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Agent</text>
<text x="400.0" y="286" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(Claude Code, Codex,</text>
<text x="400.0" y="308" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">Antigravity)</text>
<rect x="630" y="240" width="150" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="705.0" y="264" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ไฟล์โปรเจกต์</text>
<rect x="630" y="290" width="150" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="705.0" y="314" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">terminal/เทสต์</text>
<line x1="172" y1="270" x2="298" y2="270" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<text x="235" y="262" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">สั่งงาน</text>
<line x1="298" y1="300" x2="172" y2="300" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<text x="235" y="320" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">แผน/diff/ขออนุญาต</text>
<line x1="502" y1="262" x2="628" y2="262" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="502" y1="310" x2="628" y2="310" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="20" y="352" width="760" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400" y="382" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ทุกอย่างที่ agent เห็น อาจถูกส่งไปประมวลผลที่ผู้ให้บริการ: ห้ามให้เห็นความลับ/ข้อมูลลูกค้า</text>
</svg>
