<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="ทำไมให้ Vercel ส่งต่อ /api" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ทำไมให้ Vercel ส่งต่อ /api</title><desc>เรียก onrender.com ตรงทำให้ cookie เป็นของอีกเว็บ ส่วนผ่าน Vercel เบราว์เซอร์เห็นชื่อเว็บเดียว cookie ใช้ได้</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">เรียก API ตรง vs ผ่าน Vercel</text>
<text x="30" y="68" font-size="16" text-anchor="start" fill="#dc2626" font-weight="bold">แบบที่ไม่แนะนำ: หน้าเว็บเรียก onrender.com ตรงๆ</text>
<rect x="30" y="82" width="170" height="64" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="115.0" y="108.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">เบราว์เซอร์</text>
<text x="115.0" y="130.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">หน้าเว็บ example.com</text>
<rect x="550" y="82" width="220" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="660.0" y="108.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Render</text>
<text x="660.0" y="130.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">xxx.onrender.com</text>
<line x1="202" y1="114" x2="548" y2="114" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="375" y="104" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">ข้ามเว็บ (คนละชื่อ)</text>
<text x="375" y="136" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">cookie เป็นของอีกชื่อ → login ผ่านแต่ cookie ไม่ติด</text>
<line x1="30" y1="176" x2="770" y2="176" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="30" y="208" font-size="16" text-anchor="start" fill="#16a34a" font-weight="bold">แบบของบทนี้: เบราว์เซอร์คุยแค่ example.com</text>
<rect x="30" y="224" width="170" height="64" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="115.0" y="250.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">เบราว์เซอร์</text>
<text x="115.0" y="272.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">เห็นชื่อเดียว</text>
<rect x="290" y="224" width="170" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="375.0" y="250.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Vercel</text>
<text x="375.0" y="272.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">example.com</text>
<rect x="570" y="224" width="200" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="250.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Render</text>
<text x="670.0" y="272.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">xxx.onrender.com</text>
<line x1="202" y1="256" x2="288" y2="256" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="462" y1="256" x2="568" y2="256" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="245" y="246" font-size="13" text-anchor="middle" fill="#00767f" font-weight="bold">/api</text>
<text x="515" y="246" font-size="13" text-anchor="middle" fill="#d97706" font-weight="bold">ส่งต่อ</text>
<rect x="30" y="314" width="740" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="334.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">cookie ที่ API ตั้ง เป็นของ example.com → ใช้แบบปลอดภัย (SameSite=Lax) ได้</text>
<text x="400.0" y="356.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ไม่ต้องตั้งค่าข้ามเว็บ ซึ่งยุ่งและเสี่ยงกว่า</text>
<rect x="30" y="380" width="740" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="400.0" y="407.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">แต่ลิงก์ onrender.com ของ API ยังถูกเรียกตรงได้ (ไม่ผ่าน Vercel) ดูกรอบเตือนเรื่อง rate limit ข้อ 4</text>
</svg>
