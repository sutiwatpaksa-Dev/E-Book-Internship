<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="SQL injection กับ parameterized query" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" font-size="16">
<title>SQL injection กับ parameterized query</title>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b3c91"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="468" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="28" font-size="20" text-anchor="middle" fill="#0b3c91" font-weight="bold">SQL Injection: ต่อข้อความ vs ส่ง parameter</text>
<rect x="16" y="44" width="768" height="196" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="32" y="72" font-size="17" text-anchor="start" fill="#dc2626" font-weight="bold">แบบอันตราย: เอาข้อความผู้ใช้ไปต่อเป็น SQL</text>
<rect x="32" y="88" width="200" height="64" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="132.0" y="114.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ผู้ใช้พิมพ์อีเมล:</text>
<text x="132.0" y="135.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">x&#x27; OR &#x27;1&#x27;=&#x27;1</text>
<line x1="234" y1="120" x2="262" y2="120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="264" y="88" width="300" height="64" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
<text x="414.0" y="114.75" font-size="15" text-anchor="middle" fill="#fca5a5" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT * FROM users</text>
<text x="414.0" y="135.75" font-size="15" text-anchor="middle" fill="#fca5a5" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">WHERE email = &#x27;x&#x27; OR &#x27;1&#x27;=&#x27;1&#x27;</text>
<line x1="566" y1="120" x2="594" y2="120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="596" y="88" width="172" height="64" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="682.0" y="114.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">DB อ่านเป็นคำสั่ง</text>
<text x="682.0" y="135.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">&#x27;1&#x27;=&#x27;1&#x27; จริงเสมอ</text>
<text x="400" y="176" font-size="17" text-anchor="middle" fill="#dc2626" font-weight="bold">ผลลัพธ์: ได้ผู้ใช้ทุกแถว (ข้ามการเช็คอีเมล)</text>
<text x="400" y="206" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ข้อมูลที่ควรเป็น &#x27;ข้อมูล&#x27; กลายเป็น &#x27;คำสั่ง&#x27; เพราะต่อสตริงเข้าด้วยกัน</text>
<rect x="16" y="256" width="768" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="32" y="284" font-size="17" text-anchor="start" fill="#16a34a" font-weight="bold">แบบปลอดภัย: parameterized query (ORM ทำให้อัตโนมัติ)</text>
<rect x="32" y="300" width="200" height="64" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="132.0" y="326.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ผู้ใช้พิมพ์อีเมล:</text>
<text x="132.0" y="347.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">x&#x27; OR &#x27;1&#x27;=&#x27;1</text>
<rect x="264" y="296" width="300" height="34" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
<text x="414.0" y="318.25" font-size="15" text-anchor="middle" fill="#bbf7d0" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">คำสั่ง: ... WHERE email = ?</text>
<rect x="264" y="338" width="300" height="34" rx="10" fill="#e8effc" stroke="#1a4fb0" stroke-width="2"/>
<text x="414.0" y="360.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">ค่า (ส่งแยก): &quot;x&#x27; OR &#x27;1&#x27;=&#x27;1&quot;</text>
<line x1="234" y1="332" x2="262" y2="318" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="234" y1="332" x2="262" y2="354" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="566" y1="334" x2="594" y2="334" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="596" y="300" width="172" height="70" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="682.0" y="329.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">DB ถือเป็นแค่ข้อความ</text>
<text x="682.0" y="350.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">หาอีเมลนี้ ไม่เจอ</text>
<text x="400" y="404" font-size="17" text-anchor="middle" fill="#16a34a" font-weight="bold">ผลลัพธ์: 0 แถว ปลอดภัย</text>
<text x="400" y="432" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">โครงคำสั่งถูกส่งไปก่อน ค่าส่งตามไปทีหลัง จึงไม่มีทางกลายเป็นคำสั่ง</text>
</svg>
