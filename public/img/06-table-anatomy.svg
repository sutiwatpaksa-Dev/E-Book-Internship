<text x="64" y="253" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = Primary Key: เลขประจำแถว ห้ามซ้ำ ห้ามว่าง (เหมือนเลขบัตรประชาชน)</text>
<rect x="40" y="270" width="14" height="14" rx="3" fill="#1a4fb0" stroke="#1a4fb0" stroke-width="1"/>
<text x="64" y="283" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">name = NOT NULL: ห้ามปล่อยว่าง</text>
<rect x="40" y="300" width="14" height="14" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<text x="64" y="313" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">phone = UNIQUE: ห้ามมีเบอร์ซ้ำกัน (แต่ปล่อยว่างได้)</text>
<text x="40" y="345" font-size="15" fill="#0b3c91" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Schema = หัวตารางทั้งหมดนี้: ชื่อคอลัมน์ + ชนิดข้อมูล + กฎ</text>
