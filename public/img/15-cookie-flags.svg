<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="cookie ปลอดภัยกว่า localStorage" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>cookie ปลอดภัยกว่า localStorage</title><desc>เทียบ localStorage กับ cookie HttpOnly และอธิบายค่าที่ตั้งใน cookie</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a94"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="478" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">cookie ปลอดภัยกว่า localStorage</text>
<rect x="20" y="50" width="370" height="200" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="205" y="78" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold">เก็บใน localStorage</text><rect x="40" y="94" width="330" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="205.0" y="119.2" font-size="15" text-anchor="middle" fill="#0f172a">โค้ดแปลกปลอมที่ถูกแอบใส่ในหน้าเว็บ</text><line x1="205" y1="134" x2="205" y2="164" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="166" width="330" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="205.0" y="190.2" font-size="15" text-anchor="middle" fill="#0f172a">อ่านบัตรจาก localStorage ได้ทั้งหมด</text><text x="205" y="232" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold">บัตรถูกขโมยทันที</text><rect x="410" y="50" width="370" height="200" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="595" y="78" font-size="17" text-anchor="middle" fill="#15803d" font-weight="bold">cookie แบบ HttpOnly</text><rect x="430" y="94" width="330" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="595.0" y="119.2" font-size="15" text-anchor="middle" fill="#0f172a">โค้ดแปลกปลอมที่ถูกแอบใส่ในหน้าเว็บ</text><line x1="595" y1="134" x2="595" y2="164" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/><rect x="430" y="166" width="330" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="595.0" y="190.2" font-size="15" text-anchor="middle" fill="#0f172a">อ่าน cookie นี้ไม่ได้</text><text x="595" y="232" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold">เบราว์เซอร์แนบให้เองตอนเรียก API</text><rect x="20" y="272" width="170" height="32" rx="16" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="105" y="294" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">HttpOnly</text><text x="205" y="294" font-size="16" text-anchor="start" fill="#0f172a">โค้ดในหน้าเว็บอ่าน cookie นี้ไม่ได้</text><rect x="20" y="312" width="170" height="32" rx="16" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="105" y="334" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">SameSite=Lax</text><text x="205" y="334" font-size="16" text-anchor="start" fill="#0f172a">เว็บอื่นส่งคำขอมาที่เว็บเรา เบราว์เซอร์ไม่แนบ cookie</text><rect x="20" y="352" width="170" height="32" rx="16" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="105" y="374" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">Secure</text><text x="205" y="374" font-size="16" text-anchor="start" fill="#0f172a">ส่งเฉพาะตอนเป็น https:// (เปิดตอนขึ้นระบบจริง)</text><rect x="20" y="392" width="170" height="32" rx="16" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="105" y="414" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">Max-Age=86400</text><text x="205" y="414" font-size="16" text-anchor="start" fill="#0f172a">หมดอายุใน 1 วัน (86,400 วินาที)</text><rect x="20" y="432" width="170" height="32" rx="16" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/><text x="105" y="454" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">Path=/</text><text x="205" y="454" font-size="16" text-anchor="start" fill="#0f172a">ใช้ได้ทุกหน้าของเว็บ</text>
</svg>
