<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" role="img" aria-label="Docker เปิดประตูข้ามยาม ufw" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Docker เปิดประตูข้ามยาม ufw</title><desc>พอร์ตที่เขียนใน ports ของ compose ถูกเปิดโดยกฎของ Docker ข้าม ufw</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">กับดัก: Docker เปิดประตูข้ามยาม ufw</text>
<text x="205" y="62" font-size="16" text-anchor="middle" fill="#475569" font-weight="bold">ที่เราคิดว่าเกิดขึ้น</text>
<text x="595" y="62" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold">ที่เกิดจริงเมื่อมี ports: "5432:5432"</text>
<rect x="110" y="76" width="190" height="44" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="205.0" y="103.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">คนนอก</text>
<rect x="40" y="170" width="330" height="38" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="205.0" y="194.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ufw: ไม่อนุญาต 5432</text>
<rect x="110" y="262" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="205.0" y="284.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">db :5432</text>
<text x="205.0" y="306.0" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal">ปลอดภัย</text>
<line x1="205" y1="122" x2="205" y2="166" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="215" y="150" font-size="15" text-anchor="start" fill="#b91c1c" font-weight="bold">✗ ถูกบล็อก</text>
<rect x="500" y="76" width="190" height="44" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="595.0" y="103.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">คนนอก</text>
<rect x="560" y="170" width="210" height="38" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="665.0" y="194.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ufw: ไม่อนุญาต 5432</text>
<rect x="500" y="262" width="210" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="605.0" y="284.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">db :5432</text>
<text x="605.0" y="306.0" font-size="14" text-anchor="middle" fill="#b91c1c" font-weight="normal">ใครก็ต่อเข้ามาได้</text>
<path d="M 498 98 L 440 98 L 440 288 L 496 288" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
<text x="450" y="150" font-size="14" text-anchor="start" fill="#b91c1c" font-weight="bold">กฎที่ Docker เขียนเอง</text>
<text x="450" y="172" font-size="14" text-anchor="start" fill="#b91c1c" font-weight="bold">ข้าม ufw ไปเลย</text>
<line x1="400" y1="52" x2="400" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="24" y="342" width="752" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="369.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">แก้: ลบ ports: ของ db และ server ออก (ให้กล่องคุยกันในเครือข่ายภายใน)</text>
<text x="400.0" y="391.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">ถ้าจำเป็นต้องดูชั่วคราว ใช้ "127.0.0.1:5432:5432" แล้วต่อผ่านอุโมงค์ SSH</text>
</svg>
