<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="วนรอบสั่งงาน AI" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>วนรอบสั่งงาน AI</title><desc>สั่งงานโดยบอก 5 อย่าง ดูผล ถ้ายังไม่ใช่ให้บอกจุดแก้ทีละ 1 ถึง 2 อย่างแล้วดูผลใหม่ จนได้งานที่ใช่ แล้วตรวจเองก่อนใช้</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect x="1" y="1" width="798" height="298" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">ไม่ต้องได้ในครั้งเดียว: สั่ง → ดูผล → แก้ทีละจุด</text>
<rect x="20" y="70" width="170" height="100" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="105" y="102" text-anchor="middle" fill="#00767f" font-weight="bold">① สั่งงาน</text>
<text x="105" y="128" font-size="14" text-anchor="middle" fill="#1e293b">บอก 5 อย่าง</text>
<text x="105" y="150" font-size="14" text-anchor="middle" fill="#1e293b">+ ตัวอย่างที่ชอบ</text>
<line x1="192" y1="120" x2="228" y2="120" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<rect x="232" y="70" width="170" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="317" y="102" text-anchor="middle" fill="#00767f" font-weight="bold">② ดูผล</text>
<text x="317" y="128" font-size="14" text-anchor="middle" fill="#1e293b">ตรงไหนใช่</text>
<text x="317" y="150" font-size="14" text-anchor="middle" fill="#1e293b">ตรงไหนยังไม่ใช่</text>
<line x1="404" y1="120" x2="586" y2="120" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="495" y="110" font-size="14" text-anchor="middle" fill="#15803d">ใช่แล้ว</text>
<rect x="590" y="70" width="190" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="685" y="102" text-anchor="middle" fill="#15803d" font-weight="bold">④ ได้งานที่ใช่</text>
<text x="685" y="128" font-size="14" text-anchor="middle" fill="#1e293b">ตรวจตัวเลข ชื่อ ลิงก์</text>
<text x="685" y="150" font-size="14" text-anchor="middle" fill="#1e293b">แล้วค่อยเอาไปใช้</text>
<rect x="232" y="210" width="170" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="317" y="238" text-anchor="middle" fill="#92400e" font-weight="bold">③ บอกจุดแก้</text>
<text x="317" y="262" font-size="14" text-anchor="middle" fill="#1e293b">ชัดๆ ทีละ 1–2 อย่าง</text>
<path d="M 360 172 L 360 206" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
<path d="M 274 208 L 274 174" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
<text x="372" y="194" font-size="14" fill="#b45309">ยังไม่ใช่</text>
<text x="180" y="194" font-size="14" fill="#b45309">ลองใหม่</text>
</svg>
