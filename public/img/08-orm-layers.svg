<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-label="ORM อยู่ตรงกลางระหว่างโค้ด TypeScript กับฐานข้อมูล">
<title>ORM อยู่ตรงกลางระหว่างโค้ด TypeScript กับฐานข้อมูล</title>
<defs><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker></defs>
<rect x="1" y="1" width="798" height="368" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="20" y="50" width="160" height="100" rx="12" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="100.0" y="86" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">โค้ดของเรา</text>
<text x="100.0" y="114" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">TypeScript</text>
<rect x="218" y="50" width="160" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="298.0" y="86" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ORM</text>
<text x="298.0" y="114" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Drizzle / Prisma</text>
<rect x="416" y="50" width="160" height="100" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="496.0" y="86" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">Driver + Pool</text>
<text x="496.0" y="114" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">pg (node-postgres)</text>
<rect x="614" y="50" width="166" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="697.0" y="86" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ฐานข้อมูล</text>
<text x="697.0" y="114" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">PostgreSQL</text>
<line x1="180" y1="90" x2="218" y2="90" stroke="#0b3c91" stroke-width="3" marker-end="url(#arn)"/>
<line x1="218" y1="120" x2="180" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/>
<line x1="378" y1="90" x2="416" y2="90" stroke="#0b3c91" stroke-width="3" marker-end="url(#arn)"/>
<line x1="416" y1="120" x2="378" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/>
<line x1="576" y1="90" x2="614" y2="90" stroke="#0b3c91" stroke-width="3" marker-end="url(#arn)"/>
<line x1="614" y1="120" x2="576" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#arg)"/>
<text x="400" y="38" font-size="15" fill="#64748b" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ไปทาง →  คำสั่ง     ·     ← กลับมา  ผลลัพธ์</text>
<rect x="20" y="180" width="760" height="78" rx="10" fill="#ffffff" stroke="#1a4fb0" stroke-width="2"/>
<text x="34" y="206" font-size="15" fill="#1a4fb0" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ที่เราเขียน:</text>
<text x="150" y="206" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">db.select().from(customers).where(eq(customers.name, name))</text>
<text x="34" y="236" font-size="15" fill="#b45309" text-anchor="start" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ที่ ORM ส่งไป:</text>
<text x="150" y="236" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">select ... from "customers" where "name" = $1   params: ["สมชาย"]</text>
<rect x="20" y="276" width="370" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205" y="304" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ผลที่ได้: แถว → object มี type</text>
<text x="205" y="332" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="ui-monospace, Menlo, Consolas, monospace">เช่น  { id: number; name: string }[]</text>
<rect x="410" y="276" width="370" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="595" y="304" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ค่าจากผู้ใช้ไปเป็น parameter ($1)</text>
<text x="595" y="332" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">แยกจากคำสั่ง → กัน SQL injection</text>
</svg>
