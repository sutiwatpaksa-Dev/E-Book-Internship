<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" role="img" aria-label="เปรียบเทียบการเขียน import และ export แบบ CommonJS กับ ESM"><defs><marker id="a0b3c91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b3c91"/></marker><marker id="as0b3c91" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b3c91"/></marker><marker id="af59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="asf59e0b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs><rect x="2" y="2" width="796" height="326" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="205" y="40" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="700">CommonJS (แบบเก่า)</text><text x="595" y="40" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="700">ESM (แบบใหม่ ที่เราใช้)</text><rect x="20" y="60" width="370" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="36" y="100" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">const dayjs = require("dayjs");</text><text x="36" y="126" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="36" y="152" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">module.exports = { add };</text><rect x="410" y="60" width="370" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="426" y="100" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">import dayjs from "dayjs";</text><text x="426" y="126" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="426" y="152" font-size="15" text-anchor="start" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">export function add() {}</text><text x="205" y="210" font-size="15" text-anchor="middle" fill="#0f172a">ไฟล์ .cjs หรือ package.json</text><text x="205" y="232" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">"type": "commonjs"</text><text x="595" y="210" font-size="15" text-anchor="middle" fill="#0f172a">ไฟล์ .mjs หรือ package.json</text><text x="595" y="232" font-size="15" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">"type": "module"</text><rect x="120" y="262" width="560" height="50" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/><text x="400.0" y="292.25" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">Bun และ Node รุ่นใหม่อ่านได้ทั้งสองแบบ แต่ในโปรเจกต์เดียวควรเลือกแบบเดียว</text></svg>
