<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="IBM Plex Sans Thai, Sarabun, sans-serif" role="img" aria-label="Runtime รันโค้ดของเรา ส่วน package manager ดาวน์โหลด package จาก registry มาไว้ใน node_modules"><title>Runtime รันโค้ดของเรา ส่วน package manager ดาวน์โหลด package จาก registry มาไว้ใน node_modules</title><defs><marker id="a0b3c91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00767f"/></marker><marker id="as0b3c91" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00767f"/></marker><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="as16a34a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="af59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="asf59e0b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs><rect x="2" y="2" width="796" height="426" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="30" y="38" font-size="17" text-anchor="start" fill="#00767f" font-weight="700">Runtime = เครื่องเล่นเพลง (รันโค้ด)</text><rect x="30" y="55" width="160" height="80" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="110.0" y="89.39999999999999" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="700">index.ts</text><text x="110.0" y="111.79999999999998" font-size="16" text-anchor="middle" fill="#0f172a">(โค้ดเรา)</text><rect x="300" y="55" width="200" height="80" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/><text x="400.0" y="89.39999999999999" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="700">Runtime</text><text x="400.0" y="111.79999999999998" font-size="16" text-anchor="middle" fill="#0f172a">node หรือ bun</text><rect x="620" y="55" width="150" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="695.0" y="89.39999999999999" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="700">ผลลัพธ์</text><text x="695.0" y="111.79999999999998" font-size="16" text-anchor="middle" fill="#0f172a">server ทำงาน</text><line x1="190" y1="95" x2="298" y2="95" stroke="#00767f" stroke-width="2.5" marker-end="url(#a0b3c91)"/><line x1="500" y1="95" x2="618" y2="95" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a16a34a)"/><text x="30" y="188" font-size="17" text-anchor="start" fill="#00767f" font-weight="700">Package manager = แอปสโตร์ (ติดตั้ง package)</text><rect x="30" y="205" width="160" height="80" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="110.0" y="239.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">package.json</text><text x="110.0" y="260.75" font-size="15" text-anchor="middle" fill="#0f172a">(รายการที่ต้องการ)</text><rect x="300" y="205" width="200" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="400.0" y="239.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">Package manager</text><text x="400.0" y="260.75" font-size="15" text-anchor="middle" fill="#0f172a">npm / yarn / pnpm / bun</text><rect x="620" y="205" width="150" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="695.0" y="239.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">node_modules/</text><text x="695.0" y="260.75" font-size="15" text-anchor="middle" fill="#0f172a">(ตัว package จริง)</text><line x1="190" y1="245" x2="298" y2="245" stroke="#00767f" stroke-width="2.5" marker-end="url(#a0b3c91)"/><line x1="500" y1="245" x2="618" y2="245" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#af59e0b)"/><line x1="690" y1="205" x2="690" y2="137" stroke="#00767f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a0b3c91)"/><text x="698" y="175" font-size="15" text-anchor="end" fill="#00767f">runtime import มาใช้</text><rect x="300" y="340" width="200" height="60" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/><text x="400.0" y="364.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">npm registry</text><text x="400.0" y="385.75" font-size="15" text-anchor="middle" fill="#0f172a">(คลังกลางบนเน็ต)</text><line x1="400" y1="285" x2="400" y2="338" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#af59e0b)" marker-start="url(#asf59e0b)"/><text x="412" y="318" font-size="15" text-anchor="start" fill="#0f172a">ขอ / ดาวน์โหลด</text><rect x="30" y="335" width="240" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="150.0" y="364.40000000000003" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="700">Bun = ทำทั้ง 2 อย่าง</text><text x="150.0" y="386.8" font-size="16" text-anchor="middle" fill="#0f172a">ในโปรแกรมเดียว</text><rect x="540" y="335" width="230" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="655.0" y="364.75" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">Yarn = package manager</text><text x="655.0" y="385.75" font-size="15" text-anchor="middle" fill="#0f172a">ยังต้องใช้ Node รันโค้ด</text></svg>
