<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Props ไหลจากบนลงล่าง และ callback ส่งเหตุการณ์ขึ้นบน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Props ไหลจากบนลงล่าง และ callback ส่งเหตุการณ์ขึ้นบน</title><desc>แม่ส่ง props ให้ลูก ลูกส่งเหตุการณ์กลับขึ้นไปผ่านฟังก์ชันที่แม่ส่งมา</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="328" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">Props ไหลจากบนลงล่าง และ callback ส่งเหตุการณ์ขึ้นบน</text>
<rect x="250" y="56" width="300" height="70" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="400.0" y="85.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">LaptopListPage (แม่)</text>
<text x="400.0" y="107.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">const [laptops, setLaptops] = useState(...)</text>
<rect x="250" y="226" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="255.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">LaptopCard (ลูก)</text>
<text x="400.0" y="277.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="normal">function LaptopCard({ laptop, onRent })</text>
<line x1="330" y1="128" x2="330" y2="224" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="320" y="168" font-size="15" text-anchor="end" fill="#00767f" font-weight="bold">props ลงล่าง</text>
<text x="320" y="190" font-size="13" text-anchor="end" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">laptop={l}  onRent={handleRent}</text>
<line x1="470" y1="224" x2="470" y2="128" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ao)"/>
<text x="480" y="168" font-size="15" text-anchor="start" fill="#d97706" font-weight="bold">callback ขึ้นบน</text>
<text x="480" y="190" font-size="13" text-anchor="start" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">onRent(laptop.id)</text>
<text x="400" y="320" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ลูกแก้ props ตรงๆ ไม่ได้ ถ้าจะเปลี่ยนข้อมูล ให้เรียกฟังก์ชันที่แม่ส่งมา</text>
</svg>
