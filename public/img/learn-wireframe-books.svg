<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 750" role="img" aria-label="Wireframe หน้ารายการหนังสือและหน้ารายละเอียดหนังสือบนมือถือ" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="14">
