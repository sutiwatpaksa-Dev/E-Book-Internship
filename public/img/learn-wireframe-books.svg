<text x="40" y="528" font-weight="700">อ่านภาพนี้</text>
<circle cx="51" cy="557" r="11" fill="#d97706"/><text x="51" y="562" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">1</text><text x="72" y="562">ช่องค้นหาอยู่บนสุด เพราะเป็นงานหลักของหน้านี้ (story 1)</text>
<circle cx="51" cy="589" r="11" fill="#d97706"/><text x="51" y="594" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">2</text><text x="72" y="594">ป้ายสถานะอยู่ในทุกแถว ไม่ต้องกดเข้าไปดู (story 2)</text>
