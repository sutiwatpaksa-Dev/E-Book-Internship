<circle cx="51" cy="653" r="11" fill="#d97706"/><text x="51" y="658" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">4</text><text x="72" y="658">สถานะใหญ่ที่สุดในหน้า เพราะคนเปิดมาเพื่อถามเรื่องนี้</text>
<text x="40" y="700" fill="#64748b" font-size="15">แท่งสีเทา = ข้อความ (ยังไม่ต้องเขียนจริง)</text>
<text x="40" y="726" fill="#64748b" font-size="15">เส้นประ = ยังไม่แน่ใจ ต้องถามก่อน (แบ่งหน้าดีไหมถ้ามีแค่ 30 เล่ม)</text>
