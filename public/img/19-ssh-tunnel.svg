<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" role="img" aria-label="อุโมงค์ SSH ไปยังฐานข้อมูล" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>อุโมงค์ SSH ไปยังฐานข้อมูล</title><desc>pgAdmin ต่อ localhost:5433 ผ่านอุโมงค์ SSH ไปที่ 127.0.0.1:5432 บนเครื่องเช่า</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="366" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">อุโมงค์ SSH: ดูฐานข้อมูลบนเครื่องเช่า โดยไม่เปิดประตู 5432</text>
<rect x="24" y="60" width="250" height="150" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="149.0" y="107.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เครื่องเรา</text>
<text x="149.0" y="129.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">pgAdmin</text>
<text x="149.0" y="151.0" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal">ต่อไปที่</text>
<text x="149.0" y="173.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">localhost:5433</text>
<rect x="526" y="60" width="250" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="651.0" y="107.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เครื่องเช่า</text>
<text x="651.0" y="129.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">sshd (ประตู 22)</text>
<text x="651.0" y="151.0" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal">ส่งต่อให้</text>
<text x="651.0" y="173.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">127.0.0.1:5432 = db</text>
<rect x="274" y="105" width="252" height="60" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
<text x="400" y="131" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">อุโมงค์ SSH เข้ารหัส</text>
<text x="400" y="152" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">วิ่งผ่านประตู 22</text>
<line x1="276" y1="85" x2="524" y2="85" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)" marker-start="url(#an)"/>
<text x="400" y="76" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal">ข้อมูลไปกลับทางเดียวกัน</text>
<rect x="24" y="230" width="752" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="400.0" y="257.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">ssh -L 5433:127.0.0.1:5432 bitcafe</text>
<rect x="24" y="290" width="752" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="315.0" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="normal">คนนอกต่อ 5432 ตรงๆ ไม่ได้ (ufw บล็อก และ db ไม่มี ports: ออกนอกเครื่อง)</text>
<text x="400.0" y="337.0" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="normal">ต่อได้เฉพาะคนที่มีลูกกุญแจ SSH</text>
</svg>
