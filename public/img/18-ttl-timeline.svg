<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" role="img" aria-label="TTL: ทำไมแก้แล้วบางคนยังเห็นค่าเก่า" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>TTL: ทำไมแก้แล้วบางคนยังเห็นค่าเก่า</title><desc>หลังแก้ record คนที่ cache ไว้ยังเห็นค่าเก่าจนกว่า TTL จะหมด</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="386" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="19" text-anchor="middle" fill="#00767f" font-weight="bold">TTL: ทำไมแก้แล้วบางคนยังเห็นค่าเก่า</text>
<line x1="60" y1="100" x2="740" y2="100" stroke="#00767f" stroke-width="1.5"/>
<line x1="60" y1="100" x2="745" y2="100" stroke="#00767f" stroke-width="2.5" marker-end="url(#an)"/>
<text x="60" y="84" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">เวลา</text>
<circle cx="150" cy="100" r="9" fill="#dc2626"/>
<text x="150" y="70" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">แก้ A</text>
<text x="150" y="130" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">IP เก่า → ใหม่</text>
<circle cx="650" cy="100" r="9" fill="#16a34a"/>
<text x="650" y="70" font-size="15" text-anchor="middle" fill="#16a34a" font-weight="bold">TTL หมด</text>
<text x="650" y="130" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ถามใหม่ได้ค่าใหม่</text>
<path d="M150,150 L150,162 L650,162 L650,150" fill="none" stroke="#d97706" stroke-width="3"/>
<text x="400" y="188" font-size="15" text-anchor="middle" fill="#d97706" font-weight="bold">ช่วงนี้ resolver ที่จำไว้ยังตอบค่าเก่า (TTL 3600 = นานสุด 1 ชั่วโมง)</text>
<rect x="40" y="214" width="340" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="210.0" y="246.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เครื่องเรา / เน็ตบ้านเรา</text>
<text x="210.0" y="267.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ยังจำค่าเก่า → เห็นเว็บเก่า</text>
<rect x="420" y="214" width="340" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="590.0" y="246.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เพื่อนที่ไม่เคยถามมาก่อน</text>
<text x="590.0" y="267.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ถามใหม่ → เห็นเว็บใหม่ทันที</text>
<rect x="40" y="310" width="720" height="62" rx="10" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="400.0" y="335.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เคล็ดลับก่อนย้ายเครื่อง: ลด TTL เหลือ 300 ไว้ล่วงหน้า 1 วัน</text>
<text x="400.0" y="356.8" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ย้ายเสร็จค่อยปรับกลับ  ·  ตรวจด้วย dig @1.1.1.1 หรือล้าง cache ในเครื่อง</text>
</svg>
