<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" role="img" aria-label="TypeScript แปลงเป็น JavaScript ก่อนรัน" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>TypeScript แปลงเป็น JavaScript ก่อนรัน</title><desc>ไฟล์ .ts ผ่าน tsc ตรวจ type และตัด type ทิ้งเป็น .js แล้ว node รัน ถ้า type ผิดจะแจ้ง error</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="383" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="34" font-size="19" text-anchor="middle" fill="#0b3c91" font-weight="bold">TypeScript ถูกแปลงเป็น JavaScript ก่อนรัน</text>
<rect x="25" y="70" width="150" height="100" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="100.0" y="101.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">index.ts</text>
<text x="100.0" y="125.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">โค้ดที่เราเขียน</text>
<text x="100.0" y="149.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">(มี type)</text>
<rect x="225" y="70" width="150" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="300.0" y="101.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">tsc</text>
<text x="300.0" y="125.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">1 ตรวจ type</text>
<text x="300.0" y="149.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">2 ตัด type ทิ้ง</text>
<rect x="425" y="70" width="150" height="100" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="500.0" y="101.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">index.js</text>
<text x="500.0" y="125.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">JS ธรรมดา</text>
<text x="500.0" y="149.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">(ไม่มี type)</text>
<rect x="625" y="70" width="150" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="700.0" y="101.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="bold">node</text>
<text x="700.0" y="125.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">รันโปรแกรม</text>
<text x="700.0" y="149.3" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="normal">ผลลัพธ์ออกจอ</text>
<line x1="177" y1="120" x2="223" y2="120" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="377" y1="120" x2="423" y2="120" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="577" y1="120" x2="623" y2="120" stroke="#0b3c91" stroke-width="2.5" marker-end="url(#an)"/>
<line x1="300" y1="172" x2="300" y2="222" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="160" y="224" width="280" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="300.0" y="244.4" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">type ผิด → แจ้ง error</text>
<text x="300.0" y="266.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">npm run build ไม่ผ่าน</text>
<text x="300.0" y="289.4" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">(ตั้ง noEmitOnError ให้ไม่สร้าง .js)</text>
<path d="M100,172 L100,345 L700,345 L700,172" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#as)"/>
<rect x="210" y="328" width="380" height="34" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="400.0" y="349.9" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ทางลัด tsx / Bun: ตัด type แล้วรันเลย (ไม่ตรวจ type!)</text>
</svg>
