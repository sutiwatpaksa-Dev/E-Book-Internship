<rect x="304.0" y="252.0" width="93.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="403.0" y="252.0" width="93.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<text x="400" y="358" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">md:grid-cols-2</text>
<text x="400" y="404" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">แท็บเล็ต 768px</text>
<text x="400" y="426" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">2 คอลัมน์</text>
<rect x="540" y="150" width="220" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="554.0" y="164.0" width="60.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="620.0" y="164.0" width="60.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="686.0" y="164.0" width="60.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="554.0" y="252.0" width="60.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="620.0" y="252.0" width="60.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="686.0" y="252.0" width="60.0" height="82.0" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<text x="650" y="358" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">xl:grid-cols-3</text>
<text x="650" y="404" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">จอใหญ่ 1280px</text>
<text x="650" y="426" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">3 คอลัมน์</text>
<text x="400" y="456" font-size="14" text-anchor="middle" fill="#00767f" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">class: grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3</text>
</svg>
