<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Breakpoint: ตั้งแต่ความกว้างนี้ขึ้นไป" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>Breakpoint: ตั้งแต่ความกว้างนี้ขึ้นไป</title><desc>มือถือ 1 คอลัมน์ ตั้งแต่ 768px เป็น 2 คอลัมน์ ตั้งแต่ 1280px เป็น 3 คอลัมน์ อ่านว่าตั้งแต่ขึ้นไป</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00767f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="468" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#00767f" font-weight="bold">Breakpoint: ตั้งแต่ความกว้างนี้ขึ้นไป</text>
<rect x="40" y="60" width="720" height="14" rx="7" fill="#e2e8f0"/>
<circle cx="40" cy="67" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="100" font-size="14" text-anchor="start" fill="#0f172a" font-weight="bold">0px</text>
<text x="40" y="120" font-size="14" text-anchor="start" fill="#64748b" font-weight="normal">(ไม่มีคำนำหน้า)</text>
<circle cx="340" cy="67" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="340" y="100" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">640px</text>
<text x="340" y="120" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">sm:</text>
<circle cx="400" cy="67" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="400" y="100" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">768px</text>
<text x="400" y="120" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">md:</text>
<circle cx="520" cy="67" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="520" y="100" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">1024px</text>
<text x="520" y="120" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">lg:</text>
<circle cx="640" cy="67" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="632" y="100" font-size="14" text-anchor="end" fill="#0f172a" font-weight="bold">1280px</text>
<text x="632" y="120" font-size="14" text-anchor="end" fill="#64748b" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">xl:</text>
<rect x="40" y="150" width="220" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="54.0" y="164.0" width="192.0" height="52.7" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="54.0" y="222.7" width="192.0" height="52.7" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<rect x="54.0" y="281.3" width="192.0" height="52.7" rx="4" fill="#d5f2f3" stroke="#0e8a94" stroke-width="1.5"/>
<text x="150" y="358" font-size="14" text-anchor="middle" fill="#d97706" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">grid-cols-1</text>
<text x="150" y="404" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">มือถือ 375px</text>
<text x="150" y="426" font-size="14" text-anchor="middle" fill="#64748b" font-weight="normal">1 คอลัมน์</text>
<rect x="290" y="150" width="220" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
