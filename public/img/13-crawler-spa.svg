<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="ระบบที่มาอ่านเว็บ React เห็นอะไร" font-family="'IBM Plex Sans Thai', Sarabun, sans-serif" font-size="16">
<title>ระบบที่มาอ่านเว็บ React เห็นอะไร</title><desc>Google รันโค้ดได้จึงเห็นเนื้อหา LINE และ Facebook ส่วนใหญ่ไม่รันโค้ดจึงเห็นแค่ index.html มีทางแก้ 3 ระดับ</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c91"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/></marker></defs>
<rect x="1" y="1" width="798" height="468" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="400" y="30" font-size="18" text-anchor="middle" fill="#0b3c91" font-weight="bold">ข้อจำกัดของเว็บ React: ระบบที่มาอ่านเว็บเห็นอะไร</text>
<rect x="160" y="48" width="480" height="58" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="400.0" y="71.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">server ส่งให้ระบบที่มาอ่านเว็บ</text>
<text x="400.0" y="93.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">หน้าเปล่า &lt;div id="root"&gt;&lt;/div&gt; + ไฟล์โค้ด</text>
<polyline points="300,106 300,126 205,126 205,140" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<polyline points="500,106 500,126 595,126 595,140" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="30" y="140" width="350" height="66" rx="10" fill="#dbeafe" stroke="#1a4fb0" stroke-width="2"/>
<text x="205.0" y="167.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Google</text>
<text x="205.0" y="189.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">รันโค้ดได้ (ช้ากว่า อาจต้องรอคิว)</text>
<rect x="420" y="140" width="350" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="595.0" y="167.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">LINE / Facebook</text>
<text x="595.0" y="189.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ส่วนใหญ่ไม่รันโค้ด</text>
<line x1="205" y1="206" x2="205" y2="234" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="595" y1="206" x2="595" y2="234" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="30" y="234" width="350" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205.0" y="263.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">เห็นเนื้อหาครบ  ✓</text>
<rect x="420" y="234" width="350" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="595.0" y="258.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เห็นแค่ข้อมูลใน index.html  ✗</text>
<text x="595.0" y="280.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">การ์ดอาจไม่ขึ้นรูปที่ร้านตั้ง</text>
<text x="400" y="326" font-size="16" text-anchor="middle" fill="#0b3c91" font-weight="bold">ทางแก้ (จากง่ายไปยาก)</text>
<rect x="30" y="340" width="230" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="145.0" y="372.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">1  ใส่ข้อมูลการ์ด</text>
<text x="145.0" y="394.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">ค่าเริ่มต้นใน index.html</text>
<line x1="260" y1="378" x2="290" y2="378" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="290" y="340" width="230" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="405.0" y="372.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">2  prerender</text>
<text x="405.0" y="394.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">สร้างหน้าไว้ล่วงหน้าตอนแพ็กเว็บ</text>
<line x1="520" y1="378" x2="550" y2="378" stroke="#64748b" stroke-width="2.5" marker-end="url(#as)"/>
<rect x="550" y="340" width="230" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="665.0" y="372.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">3  SSR</text>
<text x="665.0" y="394.2" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="normal">server สร้างหน้าให้ทุกครั้ง</text>
<text x="400" y="448" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ข้อจำกัดนี้ยอมรับได้ในงาน STARTER แต่ต้องเขียนอธิบายใน README</text>
</svg>
