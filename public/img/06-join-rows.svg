<text x="690" y="82" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = 2</text>
<rect x="50" y="106" width="120" height="40" rx="6" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="110" y="132" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = 2</text>
<rect x="630" y="106" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="690" y="132" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = 3</text>
<rect x="50" y="156" width="120" height="40" rx="6" fill="#d5f2f3" stroke="#0e8a94" stroke-width="2"/>
<text x="110" y="182" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = 3</text>
<rect x="630" y="156" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="690" y="182" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = 4</text>
<line x1="170" y1="126" x2="630" y2="76" stroke="#16a34a" stroke-width="3"/>
<line x1="170" y1="176" x2="630" y2="126" stroke="#16a34a" stroke-width="3"/>
<text x="420" y="88" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = 2 จับคู่กัน ✓</text>
<text x="420" y="138" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id = 3 จับคู่กัน ✓</text>
<text x="400" y="60" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif"></text>
<line x1="170" y1="76" x2="250" y2="76" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="256" y="81" font-size="15" fill="#dc2626" text-anchor="start" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ไม่มีคู่ ✗</text>
<line x1="630" y1="176" x2="550" y2="176" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="544" y="181" font-size="15" fill="#dc2626" text-anchor="end" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ไม่มีคู่ ✗</text>
<rect x="30" y="236" width="220" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="140" y="264" font-size="17" fill="#00767f" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">INNER JOIN</text>
<text x="140" y="290" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ได้ 2 แถว</text>
<text x="140" y="316" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id 2, 3</text>
<rect x="290" y="236" width="220" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400" y="264" font-size="17" fill="#00767f" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">LEFT (a ซ้าย) JOIN</text>
<text x="400" y="290" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ได้ 3 แถว</text>
<text x="400" y="316" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id 1, 2, 3</text>
<text x="400" y="338" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id 1 ฝั่ง b เป็น NULL</text>
<rect x="550" y="236" width="220" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="660" y="264" font-size="17" fill="#00767f" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">FULL JOIN</text>
<text x="660" y="290" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ได้ 4 แถว</text>
<text x="660" y="316" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">id 1, 2, 3, 4</text>
<text x="660" y="338" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400" font-family="IBM Plex Sans Thai, Sarabun, sans-serif">ที่ไม่มีคู่เป็น NULL</text>
</svg>
